name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build, static checks, regression and live tests
        run: npm test
      - name: Layout and accessibility audit (1440 px)
        run: npm run test:layout:quick
      - name: "Case packs - validate, build and smoke test every case"
        run: |
          for c in lldpe mock-cdu _template; do
            python3 tools/pack_validate.py $c
            BUILD_OUT=/tmp/case-$c python3 build.py $c
            node tests/smoke_case.js /tmp/case-$c/index.html
          done
