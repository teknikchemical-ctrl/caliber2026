<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Manufacturing Knowledge Hub</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1f2630;--line:#2b3440;--text:#e6edf3;--muted:#8b98a5;--acc:#2f81f7;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--vio:#a371f7}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px}
  aside{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
  .brand{font-weight:700;font-size:15px;padding:4px 10px 18px;line-height:1.3}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:11px}
  .nav{padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);display:flex;gap:10px;align-items:center}
  .nav:hover{background:var(--panel2);color:var(--text)}
  .nav.active{background:rgba(47,129,247,.15);color:var(--acc);font-weight:600}
  .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  main{flex:1;padding:26px 32px;overflow:auto}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:var(--muted);margin-bottom:22px}
  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .g4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card.click{cursor:pointer;transition:.15s}
  .card.click:hover{border-color:var(--acc);transform:translateY(-2px)}
  .stat b{font-size:26px;display:block}
  .stat span{color:var(--muted);font-size:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .tag.ok{color:var(--ok);border-color:rgba(63,185,80,.4)}
  .tag.warn{color:var(--warn);border-color:rgba(210,153,34,.4)}
  .tag.bad{color:var(--bad);border-color:rgba(248,81,73,.4)}
  .tag.acc{color:var(--acc);border-color:rgba(47,129,247,.4)}
  .tag.vio{color:var(--vio);border-color:rgba(163,113,247,.4)}
  h3{font-size:15px;margin-bottom:6px}
  .muted{color:var(--muted)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-weight:500;font-size:12px}
  tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font:inherit}
  button{background:var(--acc);border:none;color:#fff;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 14px}
  .tab{padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
  .tab.active{color:var(--text);border-color:var(--acc)}
  .chat{display:flex;flex-direction:column;height:calc(100vh - 150px)}
  .msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px 14px}
  .msg{max-width:80%;padding:12px 14px;border-radius:12px;line-height:1.55;white-space:pre-wrap}
  .msg.u{align-self:flex-end;background:var(--acc)}
  .msg.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .src{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;white-space:normal}
  .src div{padding:6px 8px;background:var(--panel2);border-radius:6px;margin-top:6px;cursor:pointer}
  .src div:hover{outline:1px solid var(--acc)}
  .composer{display:flex;gap:8px}
  .composer input{flex:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:12px;padding:6px 10px;border-radius:20px;border:1px solid var(--line);cursor:pointer;color:var(--muted)}
  .chip:hover{color:var(--text);border-color:var(--acc)}
  .doc{background:#fff;color:#1b1f24;border-radius:10px;padding:28px 32px;line-height:1.65}
  .doc h2{margin-bottom:10px} .doc ol{margin:8px 0 8px 20px}
  .opl{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .opl .box{border-radius:10px;padding:14px;border:2px solid}
  .opl .good{border-color:var(--ok)} .opl .badb{border-color:var(--bad)}
  .rel svg{width:100%;height:auto}
  .split{display:grid;grid-template-columns:2fr 1fr;gap:14px}
  .hidden{display:none}
  .back{color:var(--acc);cursor:pointer;margin-bottom:12px;display:inline-block}
  @media(max-width:900px){.g4,.split,.opl{grid-template-columns:1fr}main{padding:18px}}

  h4{font-size:13px} .tab{white-space:nowrap} .tabs{overflow:auto} .stat b .tag{font-size:14px}
.pbar{padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:12.5px;background:var(--panel2)}
.sheet{background:#fbfbf8;border:1px solid #c9c9c0;border-radius:6px;overflow:auto;max-height:76vh}
.sheet svg{display:block;font-family:Arial,Helvetica,sans-serif}.sheet text{fill:#111}
.pdn{cursor:pointer}.pdn .b{fill:#fff;stroke:#111;stroke-width:1.4;transition:.15s}.pdn .eq{fill:#eceff3}.pdn .gl{fill:none;stroke:#111;stroke-width:1.3}.pdn .it{font-size:8px;font-weight:700;text-anchor:middle}.pdn .mt{fill:#111}
.pdn .lv{font-size:8px;font-weight:700;paint-order:stroke;stroke:#fbfbf8;stroke-width:3px;stroke-linejoin:round}.pdn .lv.ok{fill:#1a7f37}.pdn .lv.al{fill:#cf222e}.pdn .lv.ef{fill:#b35900}
.pdn:hover .b,.pdn:hover .gl{stroke:#0969da}.pdn.sel .b,.pdn.sel .gl{stroke:#0969da;stroke-width:2.6}.pdn.sel{filter:drop-shadow(0 0 4px #0969da)}
.pdn.al .b{stroke:#cf222e;fill:#ffd9d6}.pdn.ef .b{stroke:#b35900;fill:#ffe9c9}
.pipe{fill:none;stroke:#111;stroke-width:2.8;stroke-linejoin:round}.pipe.th{stroke-width:1.2}.sig{fill:none;stroke:#111;stroke-width:1;stroke-dasharray:5 3}
.fl{fill:none;stroke:#0969da;stroke-width:2.2;stroke-dasharray:3 13;stroke-linecap:round;animation:flw 1s linear infinite;pointer-events:none}.fl.off{opacity:0;animation-play-state:paused}
@keyframes flw{to{stroke-dashoffset:-16}}@keyframes spn{to{transform:rotate(360deg)}}@keyframes fan{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.55)}}
.pdn .spin{animation:spn 1.8s linear infinite}.pdn .fan{animation:fan .5s ease-in-out infinite}.pdn.stop .spin,.pdn.stop .fan{animation-play-state:paused}
.pn{cursor:pointer}.pn .b{fill:#1f2630;stroke:#8b98a5;stroke-width:1.6;transition:.15s}.pn .b.eq{stroke:#2f81f7;stroke-width:2}.pn:hover .b{stroke:#58a6ff}.pn.sel .b{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 6px #2f81f7)}.pn.al .b{stroke:#f85149}.pn .g{fill:none;stroke:#8b98a5;stroke-width:1.5}.pn .tx,.pn .lb{fill:#e6edf3;font-size:10px}.pn .it{fill:#e6edf3;font-size:7.5px}.pn .lv{font-size:9.5px;font-weight:600}.pn .ok{fill:#3fb950}.pn .al{fill:#f85149}
.pn .bl{fill:#161b22;stroke:#2f81f7;stroke-width:1.4}.pn .bn{fill:#e6edf3;font-size:10px;font-weight:700;pointer-events:none}.pn.sel .bl{fill:#2f81f7}.pn.sel .g{stroke:#fff}.pn .b.nzb{stroke:#d29922;fill:#2a2415}.pn.sel .b.nzb{fill:#d29922}.pn:hover .g{stroke:#58a6ff}
</style>

1 to the reactor (DC-4501) via pump GA-1201A. Suction line 4\" passes XV-1201, then splits to two pump casings with 2\" discharge through XV-1201A/B and non-return valves into a common 4\"-HC-1002-CS02-I line, through FIT-1201 to the reactor. A minimum-flow bypass (FV-1201, opens on low flow) returns flow to suction."},{"id":"CHK-002","doc":"DOC-001","asset":"AST-002","page":1,"sec":"Trip & Permissive Logic","text":"Start permissive: suction valve XV-1201 open (ZSO-1201). Trips: suction pressure low-low PSLL-1201 (0.5 barg), discharge flow low-low FSLL-1201 (9 m3/h), bearing temperature high-high TSHH-1201/TT-1201, bearing vibration high-high VSHH-1201/VT-1201; local emergency-stop hand switch HS-1201. Seal flush per API Plan 11 + Plan 62; PDI-1201 must confirm dP > 1.5 bar (permissive). Logic per SEQ-1201."},{"id":"CHK-003","doc":"DOC-001","asset":"AST-002","page":1,"sec":"Data Quality Note","text":"Drawing reference is the placeholder TJC-LLD-PID-XXXX. Note 1 states this is sample data for CALIBER purposes only."},{"id":"CHK-004","doc":"DOC-002","asset":"AST-003","page":1,"sec":"Process Description","text":"Polymer fluid bed dryer YD-2301 (4.0 x 8.5 m, EL +6.00, chain-and-sprocket SCM440 drive, 30 kW motor) receives powder at 4\" from centrifuge GF-2210 through XV-2210 (Kadant rotary joint). N2 purge 1\" via FV-2302 (trips closed per drawing label), vent to fine dust collector, powder outlet 4\" via TV-2301 (trips closed) to downstream."},{"id":"CHK-005","doc":"DOC-002","asset":"AST-003","page":1,"sec":"Trip & Permissive Logic","text":"Start permissive via level switch LSHH-2303 and XV-2210. C&E block EFF-1..5 lists TSHH-2301, FSLL-2302, S5LL-2305, ASHH-2307 (Z50-2304) and MPR-2301 as initiating causes. Lube oil to gearbox OK (PSL-2306) is an other-permissive; a DCS RESET is shown. Local emergency stop HS-1201."},{"id":"CHK-006","doc":"DOC-002","asset":"AST-003","page":1,"sec":"Data Quality Note","text":"Trip box beside FIT-2301 is titled TSHH-2301 (a temperature tag) but describes \"Discharge Flow LOW-LOW 9 m3/h\". Tag S5LL-2305 is probably SSLL-2305. ASHH-2307 has no stated measured variable. HS-1201, PDI-1201, RO-1201 and motor EQ1000012011- duplicate Set 1 tags. Notes 2-3 cite Set 1 datasheet/logic (GA-1201A, SEQ-1201)."},{"id":"CHK-007","doc":"DOC-003","asset":"AST-007","page":1,"sec":"Process Description","text":"Catalyst reduction reactor DC-3401A with fixed Pd/Al2O3 bed receives H2 injection (FT/FV-3403) and N2; analysis take-offs on inlet and outlet; in-line heater EA-3401 on the trim gas line. PSV-3401 set 6 barg; 8-point multipoint thermocouple TE-3401."},{"id":"CHK-008","doc":"DOC-003","asset":"AST-007","page":1,"sec":"Trip & Interlock Logic","text":"SEQ-3401. T1: TSHH-3401 high-high >230 degC, 2oo3 voting. T2: PSHH-3404 >5 barg, normally closed, trips on high pressure (PV-3404 trips open). T3: AI-3401 O2 >100 ppm = inerting fail; permissive to enable startup. T4: N2 flow >150 kg/h, maintain/increase flow on trip. T5: heater element over-temperature at skin TC >260 degC. Effects: EFF-1 trip, EFF-2 trip/maintain/increase flow, EFF-3 flow on trip; P1-P4 permissives to enable startup."},{"id":"CHK-009","doc":"DOC-004","asset":"AST-009","page":1,"sec":"Process Description","text":"Two-stage, two-throw reciprocating recycle gas compressor KC-4501 (gearbox + motor). Feed from tank 12-T-01 via KO drum FA-4510 (6\"), suction valves XV-4501, discharge through cooler EA-4502 to reactor loop line 3\"-HC-1002-CS021. Anti-surge recycle valve FV-4502 opens on low flow. Support systems: seal gas (nitrogen buffer FT-4506), lube oil (PSL/PSLL-4504, oil pump P1) and jacket cooling water (FSL-4508)."},{"id":"CHK-010","doc":"DOC-004","asset":"AST-009","page":1,"sec":"Trip & Permissive Logic","text":"SEQ-4501 start permissives: 1 lube oil pressure (PSL-4504), 2 seal gas nitrogen buffer flow (FT-4506), 3 KO drum level (LT-4510), 4 jacket cooling water flow (FSL-4508). PSLL-4501 suction pressure low-low = suction open permissive/trip. Anti-surge recycle control valving trip per SEQ-4501."},{"id":"CHK-011","doc":"DOC-004","asset":"AST-009","page":1,"sec":"Revision / Data Quality Note","text":"Title block: TITLE KA-4501, Ref TJC-LLD-PID-4501, REV 02, DATE 02. Revision table: Rev 1 = 01 (date 02), Rev 2 = - (date 02). Equipment body and legend use tag KC-4501, not KA-4501. Indicator PI-1201 is printed on the suction line (tag reused from Set 1). Note 1: all values fictional for training."},{"id":"CHK-012","doc":"DOC-005","asset":"AST-012","page":1,"sec":"Process Description","text":"Cold hexane from upstream pump GA-5610 enters shell-and-tube heater EA-5601 (N1, 6\"), heated by MP steam on the tube side (N3 4\" in, N4 3\" out) via TV-5602 (air-actuated, fails safe in a specific position). Hot hexane leaves N2 to the recycle system; condensate leaves through steam trap ST-5604 to the condensate system."},{"id":"CHK-013","doc":"DOC-005","asset":"AST-012","page":1,"sec":"Trip & Permissive Logic","text":"Interlock/control loop: PDT-5605 differential > 0.7 bar = fouling alarm (PDAH-5605, A1, EFF-2). Start permissive: PDT-5605 condensate trap fouling alarm and TI-5604 condensate trap check. TCV-5602/TV-5602 failure position C1 (EFF-1). PSV-5607 set 16 barg (R1, EFF-3)."},{"id":"CHK-014","doc":"DOC-005","asset":"AST-012","page":1,"sec":"Data Quality Note","text":"Note 5 states \"Fictional diagram for training purposes\"; pump GA-5610 is labelled \"upstream fictional pump\". Materials note 4 lists SS304L and SA-516-70 without saying which part each applies to."},{"id":"CHK-015","doc":"DOC-006","asset":"AST-015","page":1,"sec":"Process Description","text":"LP separator FA-6710 with demister mat; bottoms (hexane + polymer) leave via 6\"-HC-6710-WCC-I through TB-6702 block valve and level valve LV-6701 (Fisher 667 diaphragm actuator, DVC6200 positioner, HART communicator; globe, body WCC, ASME 300#, 300 mm). Instrument air 3\"-IA-6702-WCC-I below 1.0 barg triggers PSL-6702."},{"id":"CHK-016","doc":"DOC-006","asset":"AST-015","page":1,"sec":"Trip & Interlock Logic","text":"Logic panel SEQ-6701: LSHH-6710 >85% (1oo2) -> EFF-1 open LV-6701 fully; LSLL-6710 15% (1oo2) -> EFF-4 DCS alarm; HS-6701 manual ESD (1oo1) -> EFF-3 vent actuator; PSL-6702 <1.0 barg -> EFF-3 vent actuator and EFF-4 DCS alarm. Permissives: 1 PI-6702 > 1.2 barg, 2 DVC6200 healthy, 3 HV-6701 bypass closed."},{"id":"CHK-017","doc":"DOC-007","asset":"AST-018","page":1,"sec":"Process Description","text":"Axial induced-draft cooling tower fan CT-7801 (6 FRP blades, composite drive shaft, 55 kW TEFC IP56, 380 V/3 Ph/50 Hz, non-hazardous area) with gearbox and cooling tower cell; basin drain and vents shown. Spare cell CT-7802 is started by interlock."},{"id":"CHK-018","doc":"DOC-007","asset":"AST-018","page":1,"sec":"Trip & Interlock Logic","text":"INTERLOCK SEQ-7801: fan vibration VSHH-7802 >9 mm/s -> trip fan motor; gearbox oil temp TSHH-7802 =90 degC -> annunciate alarm on DCS; gearbox oil pressure PSL-7807 0.8 barg and fan motor overload MPR-7801 -> request start of spare CT-7802. Start permissive (AND-gate): gearbox oil level OK, basin level normal (LSL-7804), lockout release logic."},{"id":"CHK-019","doc":"DOC-007","asset":"AST-018","page":1,"sec":"Data Quality Note","text":"A second vibration row lists VSHH-7802 with \"=90 degC\" (looks copied from the oil-temp row). Lockout release text refers to \"image_0.png\" and is garbled. Instruments PT/PSLL/FI-1201 reuse Set 1 tags. Reference printed as \"Ref. Plog.\" Legend text mentions \"IMAGE 1\" placeholders."},{"id":"CHK-020","doc":"DOC-008","asset":"AST-021","page":1,"sec":"Process Description","text":"Reflux accumulator drum (1600 mm dia, 9.6 m3 T-T, SA-516 Gr.70, PSV set 10 barg, PCV split-range, C/L 4500 mm) receives overhead from column DA-8910 (8\"-HC-1002-CS02-I via TT-8911). Pumps GA-8920A/B return reflux (6\", FT-8912) and send product out (PT-8913); boot drain HV-8904 with auto-drain vent. Minimum-flow bypass FV-8911 opens on low flow."},{"id":"CHK-021","doc":"DOC-008","asset":"AST-021","page":1,"sec":"Trip & Interlock Logic (SIL 1)","text":"SEQ-8901: LSHH-8901 >85% (1oo2 latched) -> EFF-1 trip column feed; LSLL-8901 15% (1oo2) -> EFF-2 trip reflux pump GA-8920 A/B; PSHH-8902 >8 barg (1oo2) -> EFF-3 open vent PCV-8905; HS-8901 manual E-stop -> EFF-4 DCS alarm. Start permissive is an AND-gate. Suction: ZSO-4901 open; PSV-8901 labelled \"Suction Pressure LOW-LOW, setpoint 0.5 barg\"."},{"id":"CHK-022","doc":"DOC-008","asset":"AST-021","page":1,"sec":"Data Quality Note","text":"The drum body carries no equipment tag; FA-8901 is inferred from SEQ-8901 and datasheet TJC-LLD-GA-FA-8901. GA-8920A is labelled Standby and GA-8920B Duty. PSV-8901 is used as a low-low pressure switch tag. PI/PSLL/XV-1201A/B/TSHH-1201 reuse Set 1 tags; drum flow label FI-8012 vs FI-8912 unclear. Note 1: sample data only."},{"id":"CHK-023","doc":"DOC-009","asset":null,"page":1,"sec":"Case framing","text":"Case 1 pack: P&ID explains how the system works; Plot Plan shows where equipment is located; together they give operational context. Extractable content: equipment list, flow paths, piping and valve logic, sensors/transmitters, control valves, DCS monitoring points, trips, alarms, interlocks, SOPs, incidents, live data."},{"id":"CHK-024","doc":"DOC-010","asset":null,"page":1,"sec":"Maintenance history structure","text":"Maintenance History workbook uses Equipment Tag as the common key across datasets. Visible columns: WO_Number, Notification_No, Report_Date, Start_Date, Completion_Date, Status, Equipment, Equipment description, Functional location, Area_Code, Area_Name, Plant, Work_Type, Discipline, Priority. Work types include inspection, preventive, predictive, calibration, corrective and overhaul. A second sheet 'Explanation' documents each column. The actual rows were not provided."},{"id":"CHK-025","doc":"DOC-019","asset":"AST-002","page":1,"sec":"Equipment Location Detail","text":"Plot plan sheet for GA-1201A (HEXANE FEED PUMP), s only."},{"id":"CHK-049","doc":"DOC-027","asset":"AST-002","page":1,"sec":"OPL Header, Purpose & Hazard","text":"OPL-GA-1201A-01 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Mechanical Seal Flush (API Plan 11) Verification. Discipline: Mechanical. Equipment: GA-1201A - HEXANE FEED PUMP. Area / Unit: 1200 - HEXANE FEED SYSTEM. Related Interlock: SEQ-1201 (SIL 1). P&ID Ref: TJC-LLD-PID-1201. Classification: Trouble Case (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains mechanical seal flush (api plan 11) verification for GA-1201A (HEXANE FEED PUMP) in the HEXANE FEED SYSTEM. Confirm seal flush dP > 1.5 bar before start. Low flush = seal face overheating and hexane leak to atmosphere. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task:"},{"id":"CHK-050","doc":"DOC-027","asset":"AST-002","page":1,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-051","doc":"DOC-027","asset":"AST-002","page":1,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Line up discharge flush to seal chamber and open flush isolation | Isolation & LOTO verified. 2. Check PDI-1201 reads 1.5-2.5 bar dP across the flush orifice RO-1201 | Parts match BOM / spec. 3. Verify no visible leak or drip at the gland / seal drain | Torque / clearance to spec. 4. If dP low, isolate and inspect orifice RO-1201 for plugging by polymer/dirt | No leak / smooth operation. 5. Confirm quench (Plan 62) N2/steam is lined up to the outboard side | Record in equipment history."},{"id":"CHK-052","doc":"DOC-027","asset":"AST-002","page":1,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Hexane leak observed at GA-1201A seal gland during operation, seal dr. | API Plan 11 flush orifice RO-1201 partially plugged causing seal face. | Replaced JC T2100 mechanical seal cartridge, cleaned flush orifice, v. 2. GA-1201A tripped on VSHH-1201 high vibration 7.4 mm/s | Angular misalignment 0.12 mm/100mm after foundation settlement | Laser re-aligned pump/motor, re-shimmed motor feet, vibration back to. 3. Bearing DE noisy with rising temperature TI-1201 trend | Outer race spalling on DE bearing due to prolonged misalignment | Renewed DE bearing 7310 BECBM, flushed housing, refilled ISO VG 68."},{"id":"CHK-053","doc":"DOC-027","asset":"AST-002","page":1,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Confirm seal flush dP > 1.5 bar before start. Low flush = seal face overheating and hexane leak to atmosphere. (2) Respect the interlock SEQ-1201: e.g. PSLL-1201 trips at < 0.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-1201 before working on GA-1201A. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Sunday, 22 March 2026."},{"id":"CHK-054","doc":"DOC-028","asset":"AST-002","page":2,"sec":"OPL Header, Purpose & Hazard","text":"OPL-GA-1201A-02 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Bearing Oil Bath Level & Greasing. Discipline: Mechanical. Equipment: GA-1201A - HEXANE FEED PUMP. Area / Unit: 1200 - HEXANE FEED SYSTEM. Related Interlock: SEQ-1201 (SIL 1). P&ID Ref: TJC-LLD-PID-1201. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains bearing oil bath level & greasing for GA-1201A (HEXANE FEED PUMP) in the HEXANE FEED SYSTEM. Maintain oil bath at the centre of the sight glass with ISO VG 68. Both over-fill and under-fill overheat the bearing. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task:"},{"id":"CHK-055","doc":"DOC-028","asset":"AST-002","page":2,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-056","doc":"DOC-028","asset":"AST-002","page":2,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Stop pump, isolate electrically (LOTO) before any lube work | Isolation & LOTO verified. 2. Check the oil sight-glass level sits at the middle mark | Parts match BOM / spec. 3. Top-up with ISO VG 68 only - never mix grades | Torque / clearance to spec. 4. Inspect the constant-level oiler bottle and refill | No leak / smooth operation. 5. Record oil condition (colour/water) on the weekly lube route sheet | Record in equipment history."},{"id":"CHK-057","doc":"DOC-028","asset":"AST-002","page":2,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Hexane leak observed at GA-1201A seal gland during operation, seal dr. | API Plan 11 flush orifice RO-1201 partially plugged causing seal face. | Replaced JC T2100 mechanical seal cartridge, cleaned flush orifice, v. 2. GA-1201A tripped on VSHH-1201 high vibration 7.4 mm/s | Angular misalignment 0.12 mm/100mm after foundation settlement | Laser re-aligned pump/motor, re-shimmed motor feet, vibration back to. 3. Bearing DE noisy with rising temperature TI-1201 trend | Outer race spalling on DE bearing due to prolonged misalignment | Renewed DE bearing 7310 BECBM, flushed housing, refilled ISO VG 68."},{"id":"CHK-058","doc":"DOC-028","asset":"AST-002","page":2,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Maintain oil bath at the centre of the sight glass with ISO VG 68. Both over-fill and under-fill overheat the bearing. (2) Respect the interlock SEQ-1201: e.g. PSLL-1201 trips at < 0.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-1201 before working on GA-1201A. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Thursday, 26 March 2026."},{"id":"CHK-059","doc":"DOC-029","asset":"AST-002","page":3,"sec":"OPL Header, Purpose & Hazard","text":"OPL-GA-1201A-03 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Pump-Motor Alignment Check (Laser). Discipline: Mechanical. Equipment: GA-1201A - HEXANE FEED PUMP. Area / Unit: 1200 - HEXANE FEED SYSTEM. Related Interlock: SEQ-1201 (SIL 1). P&ID Ref: TJC-LLD-PID-1201. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains pump-motor alignment check (laser) for GA-1201A (HEXANE FEED PUMP) in the HEXANE FEED SYSTEM. Shaft misalignment is the #1 root cause of GA-1201A high-vibration trips (VSHH-1201) and premature bearing/seal failure. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task:"},{"id":"CHK-060","doc":"DOC-029","asset":"AST-002","page":3,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-061","doc":"DOC-029","asset":"AST-002","page":3,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Isolate and LOTO the motor, remove coupling guard | Isolation & LOTO verified. 2. Mount laser alignment brackets across the coupling spacer | Parts match BOM / spec. 3. Rotate 0-90-180-270 deg and capture readings | Torque / clearance to spec. 4. Target angular < 0.05 mm/100 mm and offset < 0.05 mm | No leak / smooth operation. 5. Add/remove shims under motor feet, re-check, and record the alignment report | Record in equipment history."},{"id":"CHK-062","doc":"DOC-029","asset":"AST-002","page":3,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Hexane leak observed at GA-1201A seal gland during operation, seal dr. | API Plan 11 flush orifice RO-1201 partially plugged causing seal face. | Replaced JC T2100 mechanical seal cartridge, cleaned flush orifice, v. 2. GA-1201A tripped on VSHH-1201 high vibration 7.4 mm/s | Angular misalignment 0.12 mm/100mm after foundation settlement | Laser re-aligned pump/motor, re-shimmed motor feet, vibration back to. 3. Bearing DE noisy with rising temperature TI-1201 trend | Outer race spalling on DE bearing due to prolonged misalignment | Renewed DE bearing 7310 BECBM, flushed housing, refilled ISO VG 68."},{"id":"CHK-063","doc":"DOC-029","asset":"AST-002","page":3,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Shaft misalignment is the #1 root cause of GA-1201A high-vibration trips (VSHH-1201) and premature bearing/seal failure. (2) Respect the interlock SEQ-1201: e.g. PSLL-1201 trips at < 0.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-1201 before working on GA-1201A. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Monday, 30 March 2026."},{"id":"CHK-064","doc":"DOC-030","asset":"AST-002","page":4,"sec":"OPL Header, Purpose & Hazard","text":"OPL-GA-1201A-04 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Minimum Flow Line Operation & Deadhead Protection. Discipline: Process / Operations. Equipment: GA-1201A - HEXANE FEED PUMP. Area / Unit: 1200 - HEXANE FEED SYSTEM. Related Interlock: SEQ-1201 (SIL 1). P&ID Ref: TJC-LLD-PID-1201. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains minimum flow line operation & deadhead protection for GA-1201A (HEXANE FEED PUMP) in the HEXANE FEED SYSTEM. Never run the pump against a closed discharge. The min-flow recycle (FV-1201) protects the pump from deadhead overheating. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task:"},{"id":"CHK-065","doc":"DOC-030","asset":"AST-002","page":4,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-066","doc":"DOC-030","asset":"AST-002","page":4,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Confirm FV-1201 min-flow recycle line is open before start | Permit valid & briefed. 2. Watch that FIC-1201 stays above the 9 m3/h minimum continuous flow | Parameter within limit. 3. If FSLL-1201 trips, check downstream XV-1201 and manual valves for a closed path | Interlock status confirmed. 4. Do not defeat the min-flow interlock to force higher discharge pressure | Change logged on DCS. 5. Reset the pump only after the low-flow cause has been cleared | Handover to next shift."},{"id":"CHK-067","doc":"DOC-030","asset":"AST-002","page":4,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Hexane leak observed at GA-1201A seal gland during operation, seal dr | API Plan 11 flush orifice RO-1201 partially plugged causing seal face | Replaced JC T2100 mechanical seal cartridge, cleaned flush orifice, v. 2. GA-1201A tripped on VSHH-1201 high vibration 7.4 mm/s | Angular misalignment 0.12 mm/100mm after foundation settlement | Laser re-aligned pump/motor, re-shimmed motor feet, vibration back to. 3. Bearing DE noisy with rising temperature TI-1201 trend | Outer race spalling on DE bearing due to prolonged misalignment | Renewed DE bearing 7310 BECBM, flushed housing, refilled ISO VG 68."},{"id":"CHK-068","doc":"DOC-030","asset":"AST-002","page":4,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Never run the pump against a closed discharge. The min-flow recycle (FV-1201) protects the pump from deadhead overheating. (2) Respect the interlock SEQ-1201: e.g. PSLL-1201 trips at < 0.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-1201 before working on GA-1201A. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Friday, 03 April 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-069","doc":"DOC-031","asset":"AST-002","page":5,"sec":"OPL Header, Purpose & Hazard","text":"OPL-GA-1201A-05 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Cold Alignment vs Hot Check for Hexane Service. Discipline: Mechanical. Equipment: GA-1201A - HEXANE FEED PUMP. Area / Unit: 1200 - HEXANE FEED SYSTEM. Related Interlock: SEQ-1201 (SIL 1). P&ID Ref: TJC-LLD-PID-1201. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains cold alignment vs hot check for hexane service for GA-1201A (HEXANE FEED PUMP) in the HEXANE FEED SYSTEM. Hexane at operating temperature grows the casing; a good cold alignment must include the correct thermal-growth offset. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task:"},{"id":"CHK-070","doc":"DOC-031","asset":"AST-002","page":5,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-071","doc":"DOC-031","asset":"AST-002","page":5,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Take cold alignment with the specified target offsets applied | Isolation & LOTO verified. 2. After ~2 h at temperature, do a hot-check on the coupling | Parts match BOM / spec. 3. Compare hot readings against the cold targets | Torque / clearance to spec. 4. Adjust thermal-growth compensation if repeat vibration trips occur | No leak / smooth operation. 5. Log both cold and hot data in the machine history file | Record in equipment history."},{"id":"CHK-072","doc":"DOC-031","asset":"AST-002","page":5,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Hexane leak observed at GA-1201A seal gland during operation, seal dr. | API Plan 11 flush orifice RO-1201 partially plugged causing seal face. | Replaced JC T2100 mechanical seal cartridge, cleaned flush orifice, v. 2. GA-1201A tripped on VSHH-1201 high vibration 7.4 mm/s | Angular misalignment 0.12 mm/100mm after foundation settlement | Laser re-aligned pump/motor, re-shimmed motor feet, vibration back to. 3. Bearing DE noisy with rising temperature TI-1201 trend | Outer race spalling on DE bearing due to prolonged misalignment | Renewed DE bearing 7310 BECBM, flushed housing, refilled ISO VG 68."},{"id":"CHK-073","doc":"DOC-031","asset":"AST-002","page":5,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Hexane at operating temperature grows the casing; a good cold alignment must include the correct thermal-growth offset. (2) Respect the interlock SEQ-1201: e.g. PSLL-1201 trips at < 0.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-1201 before working on GA-1201A. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Tuesday, 07 April 2026."},{"id":"CHK-074","doc":"DOC-032","asset":"AST-002","page":6,"sec":"OPL Header, Purpose & Hazard","text":"OPL-GA-1201A-06 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Start-Up & Priming Procedure GA-1201A. Discipline: Process / Operations. Equipment: GA-1201A - HEXANE FEED PUMP. Area / Unit: 1200 - HEXANE FEED SYSTEM. Related Interlock: SEQ-1201 (SIL 1). P&ID Ref: TJC-LLD-PID-1201. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains start-up & priming procedure ga-1201a for GA-1201A (HEXANE FEED PUMP) in the HEXANE FEED SYSTEM. Correct priming and venting prevents a dry-run that instantly destroys the mechanical seal. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task:"},{"id":"CHK-075","doc":"DOC-032","asset":"AST-002","page":6,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-076","doc":"DOC-032","asset":"AST-002","page":6,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Open the suction valve fully and vent the casing air via N5 vent | Permit valid & briefed. 2. Establish seal flush Plan 11 and confirm PDI-1201 dP | Parameter within limit. 3. Confirm the min-flow recycle line FV-1201 is open | Interlock status confirmed. 4. Bump-start the motor and check correct rotation direction | Change logged on DCS. 5. Start the motor and confirm PIC-1201 pressure and vibration settle within 5 s | Handover to next shift."},{"id":"CHK-077","doc":"DOC-032","asset":"AST-002","page":6,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Hexane leak observed at GA-1201A seal gland during operation, seal dr | API Plan 11 flush orifice RO-1201 partially plugged causing seal face | Replaced JC T2100 mechanical seal cartridge, cleaned flush orifice, v. 2. GA-1201A tripped on VSHH-1201 high vibration 7.4 mm/s | Angular misalignment 0.12 mm/100mm after foundation settlement | Laser re-aligned pump/motor, re-shimmed motor feet, vibration back to. 3. Bearing DE noisy with rising temperature TI-1201 trend | Outer race spalling on DE bearing due to prolonged misalignment | Renewed DE bearing 7310 BECBM, flushed housing, refilled ISO VG 68."},{"id":"CHK-078","doc":"DOC-032","asset":"AST-002","page":6,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Correct priming and venting prevents a dry-run that instantly destroys the mechanical seal. (2) Respect the interlock SEQ-1201: e.g. PSLL-1201 trips at < 0.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-1201 before working on GA-1201A. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Saturday, 11 April 2026."},{"id":"CHK-079","doc":"DOC-033","asset":"AST-002","page":7,"sec":"OPL Header, Purpose & Hazard","text":"OPL-GA-1201A-07 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Vibration Trend Monitoring & Alarm Response (VSHH-1201). Discipline: Instrument. Equipment: GA-1201A - HEXANE FEED PUMP. Area / Unit: 1200 - HEXANE FEED SYSTEM. Related Interlock: SEQ-1201 (SIL 1). P&ID Ref: TJC-LLD-PID-1201. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains vibration trend monitoring & alarm response (vshh-1201) for GA-1201A (HEXANE FEED PUMP) in the HEXANE FEED SYSTEM. A rising vibration trend predicts bearing failure days in advance and lets you plan a repair before a trip. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task:"},{"id":"CHK-080","doc":"DOC-033","asset":"AST-002","page":7,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling n-Hexane at up to 16 barg / 80 degC. Observe the following before and during the task: (1) De-energise and isolate the loop; place the function to bypass/inhibit under permit. (2) Inform the panel operator before working on any trip, valve or transmitter. (3) Take care with instrument air / hydraulic pressure when disconnecting tubing. (4) Verify intrinsic-safety / Ex integrity is restored before returning to service. (5) Wear correct PPE and follow ESD/override control procedures. 3. TOOLS & MATERIALS REQUIRED: HART communicator / positioner software (e.g. ValveLink); Loop calibrator & decade box / pressure source; Digital multimeter and clamp meter; Span/zero test gas or reference standards; Torque screwdriver and small hand tools; Certified test/inhibit permit."},{"id":"CHK-081","doc":"DOC-033","asset":"AST-002","page":7,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Record VT-1201 on the daily PdM route in mm/s RMS | Loop isolated / under permit. 2. Note alarm at 4.5 mm/s and trip at 7.1 mm/s (VSHH-1201) | Reference standard traceable. 3. A rise greater than 1 mm/s within a week = plan a bearing inspection | As-found & as-left recorded. 4. Correlate the vibration rise with TI-1201 bearing temperature | Trip / control action verified. 5. Escalate to reliability engineer if the 1x running-speed component dominates | Return to service confirmed."},{"id":"CHK-082","doc":"DOC-033","asset":"AST-002","page":7,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Scheduled proof test of low-low suction pressure trip | Switch set-point drift found +0.08 barg during proof test | Recalibrated PSLL-1201 to 0.5 barg trip, function tested to DCS. 2. PDI-1201 reading erratic, seal-flush low alarm nuisance-tripping | Impulse lines fouled with hexane residue/polymer fines | Cleaned impulse lines and re-zeroed PDI-1201 transmitter. 3. Discharge flow control hunting, FIC-1201 oscillating | Loop poorly tuned after transmitter re-range | Re-ranged FT-1201 and retuned FIC-1201 PID parameters."},{"id":"CHK-083","doc":"DOC-033","asset":"AST-002","page":7,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) A rising vibration trend predicts bearing failure days in advance and lets you plan a repair before a trip. (2) Respect the interlock SEQ-1201: e.g. PSLL-1201 trips at < 0.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-1201 before working on GA-1201A. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Wednesday, 15 April 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID; Interlock and Maintenance History"},{"id":"CHK-084","doc":"DOC-034","asset":"AST-003","page":8,"sec":"OPL Header, Purpose & Hazard","text":"OPL-YD-2301-01 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Nitrogen Inerting Before Steam-On. Discipline: Process / Operations. Equipment: YD-2301 - POLYMER FLUID BED DRYER. Area / Unit: 2300 - POWDER DRYING SYSTEM. Related Interlock: SEQ-5500 (SIL 2). P&ID Ref: TJC-LLD-PID-2301. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains nitrogen inerting before steam-on for YD-2301 (POLYMER FLUID BED DRYER) in the POWDER DRYING SYSTEM. Polymer powder + oxygen + heat can cause a dust explosion. The dryer must be fully inerted before any steam is admitted. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task:"},{"id":"CHK-085","doc":"DOC-034","asset":"AST-003","page":8,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-086","doc":"DOC-034","asset":"AST-003","page":8,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Start the N2 purge and raise FT-2302 flow above 200 kg/h | Permit valid & briefed. 2. Confirm the vent O2 analyzer AT-2307 reads below 5 % | Parameter within limit. 3. Only then admit steam gradually via TIC-2301 / TV-2301 | Interlock status confirmed. 4. Never bypass the FSLL-2302 low-flow inert trip to start faster | Change logged on DCS. 5. If O2 rises above 8 %, the ASHH-2307 trip will stop steam and drive | Handover to next shift."},{"id":"CHK-087","doc":"DOC-034","asset":"AST-003","page":8,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Steam and powder leaking at YD-2301 discharge gland | PTFE 4526L gland packing worn beyond service limit | Replaced 8 pcs PTFE 4526L packing, staggered joints, re-nipped after. 2. Minor powder weep at feed-end gland | PTFE 4505L packing hardened and worn | Renewed 2 pcs PTFE 4505L feed-end packing. 3. Scheduled proof test of dryer outlet high-high temperature trip | Set-point within tolerance, minor zero drift corrected | Recalibrated TSHH-2301 to 125 degC and function tested to logic."},{"id":"CHK-088","doc":"DOC-034","asset":"AST-003","page":8,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Polymer powder + oxygen + heat can cause a dust explosion. The dryer must be fully inerted before any steam is admitted. (2) Respect the interlock SEQ-5500: e.g. TSHH-2301 trips at > 125 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-2301 before working on YD-2301. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Thursday, 02 April 2026. Footer note: Cross-ref tag YD-2301 across Datasheet, GA, P&ID; Interlock and Maintenance History."},{"id":"CHK-089","doc":"DOC-035","asset":"AST-003","page":9,"sec":"OPL Header, Purpose & Hazard","text":"OPL-YD-2301-02 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Gland Packing Replacement (PTFE 4526L). Discipline: Mechanical. Equipment: YD-2301 - POLYMER FLUID BED DRYER. Area / Unit: 2300 - POWDER DRYING SYSTEM. Related Interlock: SEQ-5500 (SIL 2). P&ID Ref: TJC-LLD-PID-2301. Classification: Trouble Case (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains gland packing replacement (ptfe 4526l) for YD-2301 (POLYMER FLUID BED DRYER) in the POWDER DRYING SYSTEM. Worn gland packing lets powder and steam leak at the drum ends. This is the most frequent YD-2301 maintenance job and a housekeeping/safety issue. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task:"},{"id":"CHK-090","doc":"DOC-035","asset":"AST-003","page":9,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-091","doc":"DOC-035","asset":"AST-003","page":9,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Isolate steam and N2, drain condensate, and LOTO the drive | Isolation & LOTO verified. 2. Remove the old PTFE rings (8 pcs 4526L at discharge, 2 pcs 4505L at feed) | Parts match BOM / spec. 3. Fit new rings one at a time, staggering the joints by 90 deg | Torque / clearance to spec. 4. Tighten the gland follower evenly - snug only, never over-torque | No leak / smooth operation. 5. Warm through slowly and re-check for leaks, re-nip after 24 h | Record in equipment history."},{"id":"CHK-092","doc":"DOC-035","asset":"AST-003","page":9,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Steam and powder leaking at YD-2301 discharge gland | PTFE 4526L gland packing worn beyond service limit | Replaced 8 pcs PTFE 4526L packing, staggered joints, re-nipped after . 2. Minor powder weep at feed-end gland | PTFE 4505L packing hardened and worn | Renewed 2 pcs PTFE 4505L feed-end packing. 3. SSLL-2305 speed low alarm, chain slack observed | Chain elongation with normal wear caused slip | Adjusted take-up, lubricated chain, checked sprocket wear."},{"id":"CHK-093","doc":"DOC-035","asset":"AST-003","page":9,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Worn gland packing lets powder and steam leak at the drum ends. This is the most frequent YD-2301 maintenance job and a (2) Respect the interlock SEQ-5500: e.g. TSHH-2301 trips at > 125 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-2301 before working on YD-2301. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Monday, 06 April 2026. Footer note: Cross-ref tag YD-2301 across Datasheet, GA, P&ID; Interlock and Maintenance History."},{"id":"CHK-094","doc":"DOC-036","asset":"AST-003","page":10,"sec":"OPL Header, Purpose & Hazard","text":"OPL-YD-2301-03 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Chain & Sprocket Lubrication and Tension (SCM440). Discipline: Mechanical. Equipment: YD-2301 - POLYMER FLUID BED DRYER. Area / Unit: 2300 - POWDER DRYING SYSTEM. Related Interlock: SEQ-5500 (SIL 2). P&ID Ref: TJC-LLD-PID-2301. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains chain & sprocket lubrication and tension (scm440) for YD-2301 (POLYMER FLUID BED DRYER) in the POWDER DRYING SYSTEM. A dry or slack drive chain slips and drops the drum speed, tripping SSLL-2305 and stopping drying. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task:"},{"id":"CHK-095","doc":"DOC-036","asset":"AST-003","page":10,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-096","doc":"DOC-036","asset":"AST-003","page":10,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Weekly apply the specified chain oil along the full drive chain | Isolation & LOTO verified. 2. Inspect the SCM440 sprocket teeth for hooking/wear | Parts match BOM / spec. 3. Check chain tension - mid-span sag should be 10-15 mm | Torque / clearance to spec. 4. Adjust the take-up if sag is excessive and re-lube | No leak / smooth operation. 5. Record chain elongation; replace the chain at 3 % stretch | Record in equipment history."},{"id":"CHK-097","doc":"DOC-036","asset":"AST-003","page":10,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Steam and powder leaking at YD-2301 discharge gland | PTFE 4526L gland packing worn beyond service limit | Replaced 8 pcs PTFE 4526L packing, staggered joints, re-nipped after . 2. Minor powder weep at feed-end gland | PTFE 4505L packing hardened and worn | Renewed 2 pcs PTFE 4505L feed-end packing. 3. SSLL-2305 speed low alarm, chain slack observed | Chain elongation with normal wear caused slip | Adjusted take-up, lubricated chain, checked sprocket wear."},{"id":"CHK-098","doc":"DOC-036","asset":"AST-003","page":10,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) A dry or slack drive chain slips and drops the drum speed, tripping SSLL-2305 and stopping drying. (2) Respect the interlock SEQ-5500: e.g. TSHH-2301 trips at > 125 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-2301 before working on YD-2301. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Friday, 10 April 2026. Footer note: Cross-ref tag YD-2301 across Datasheet, GA, P&ID; Interlock and Maintenance History."},{"id":"CHK-099","doc":"DOC-037","asset":"AST-003","page":11,"sec":"OPL Header, Purpose & Hazard","text":"OPL-YD-2301-04 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Controlled Temperature Ramp-Up Procedure. Discipline: Process / Operations. Equipment: YD-2301 - POLYMER FLUID BED DRYER. Area / Unit: 2300 - POWDER DRYING SYSTEM. Related Interlock: SEQ-5500 (SIL 2). P&ID Ref: TJC-LLD-PID-2301. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains controlled temperature ramp-up procedure for YD-2301 (POLYMER FLUID BED DRYER) in the POWDER DRYING SYSTEM. Heating the drum too quickly warps the shell and cracks the steam tubes, causing tube leaks and long downtime. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task:"},{"id":"CHK-100","doc":"DOC-037","asset":"AST-003","page":11,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-101","doc":"DOC-037","asset":"AST-003","page":11,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Ramp TIC-2301 at a maximum of 10 degC per 10 minutes | Permit valid & briefed. 2. Hold at 60 degC to let the drum warm through evenly | Parameter within limit. 3. Watch drum thermal growth at the trunnion supports | Interlock status confirmed. 4. Reach the 95-110 degC operating band slowly | Change logged on DCS. 5. If uneven expansion / rubbing is heard, pause the ramp | Handover to next shift."},{"id":"CHK-102","doc":"DOC-037","asset":"AST-003","page":11,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Steam and powder leaking at YD-2301 discharge gland | PTFE 4526L gland packing worn beyond service limit | Replaced 8 pcs PTFE 4526L packing, staggered joints, re-nipped after. 2. Minor powder weep at feed-end gland | PTFE 4505L packing hardened and worn | Renewed 2 pcs PTFE 4505L feed-end packing. 3. Scheduled proof test of dryer outlet high-high temperature trip | Set-point within tolerance, minor zero drift corrected | Recalibrated TSHH-2301 to 125 degC and function tested to logic."},{"id":"CHK-103","doc":"DOC-037","asset":"AST-003","page":11,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Heating the drum too quickly warps the shell and cracks the steam tubes, causing tube leaks and long downtime. (2) Respect the interlock SEQ-5500: e.g. TSHH-2301 trips at > 125 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-2301 before working on YD-2301. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Tuesday, 14 April 2026. Footer note: Cross-ref tag YD-2301 across Datasheet, GA, P&ID; Interlock and Maintenance History."},{"id":"CHK-104","doc":"DOC-038","asset":"AST-003","page":12,"sec":"OPL Header, Purpose & Hazard","text":"OPL-YD-2301-05 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Rotary Joint Steam Leak Handling (Kadant). Discipline: Mechanical. Equipment: YD-2301 - POLYMER FLUID BED DRYER. Area / Unit: 2300 - POWDER DRYING SYSTEM. Related Interlock: SEQ-5500 (SIL 2). P&ID Ref: TJC-LLD-PID-2301. Classification: Trouble Case (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains rotary joint steam leak handling (kadant) for YD-2301 (POLYMER FLUID BED DRYER) in the POWDER DRYING SYSTEM. The Kadant rotary joint seal wears and leaks live steam at the drum head, a burn hazard and steam loss. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task:"},{"id":"CHK-105","doc":"DOC-038","asset":"AST-003","page":12,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-106","doc":"DOC-038","asset":"AST-003","page":12,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Identify the leak at the rotary joint carbon seal face | Isolation & LOTO verified. 2. Reduce steam and plan an isolation window with operations | Parts match BOM / spec. 3. Replace the rotary joint seal kit and inspect the nipple | Torque / clearance to spec. 4. Check the O-ring (NBR) and the joint-to-shaft alignment | No leak / smooth operation. 5. Leak test on steam-up before returning the dryer to service | Record in equipment history."},{"id":"CHK-107","doc":"DOC-038","asset":"AST-003","page":12,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Steam and powder leaking at YD-2301 discharge gland | PTFE 4526L gland packing worn beyond service limit | Replaced 8 pcs PTFE 4526L packing, staggered joints, re-nipped after . 2. Minor powder weep at feed-end gland | PTFE 4505L packing hardened and worn | Renewed 2 pcs PTFE 4505L feed-end packing. 3. SSLL-2305 speed low alarm, chain slack observed | Chain elongation with normal wear caused slip | Adjusted take-up, lubricated chain, checked sprocket wear."},{"id":"CHK-108","doc":"DOC-038","asset":"AST-003","page":12,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The Kadant rotary joint seal wears and leaks live steam at the drum head, a burn hazard and steam loss. (2) Respect the interlock SEQ-5500: e.g. TSHH-2301 trips at > 125 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-2301 before working on YD-2301. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Saturday, 18 April 2026. Footer note: Cross-ref tag YD-2301 across Datasheet, GA, P&ID; Interlock and Maintenance History."},{"id":"CHK-109","doc":"DOC-039","asset":"AST-003","page":13,"sec":"OPL Header, Purpose & Hazard","text":"OPL-YD-2301-06 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Outlet Moisture Control & Retention Time (MT-2306). Discipline: Process / Operations. Equipment: YD-2301 - POLYMER FLUID BED DRYER. Area / Unit: 2300 - POWDER DRYING SYSTEM. Related Interlock: SEQ-5500 (SIL 2). P&ID Ref: TJC-LLD-PID-2301. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains outlet moisture control & retention time (mt-2306) for YD-2301 (POLYMER FLUID BED DRYER) in the POWDER DRYING SYSTEM. The product specification is below 300 ppm moisture. Rising outlet moisture means lost drying and off-spec powder. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task:"},{"id":"CHK-110","doc":"DOC-039","asset":"AST-003","page":13,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-111","doc":"DOC-039","asset":"AST-003","page":13,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Read the MT-2306 outlet moisture every shift | Permit valid & briefed. 2. If moisture rises above 300 ppm, check steam pressure PT-2304 first | Parameter within limit. 3. Verify drum speed and hence retention time is correct | Interlock status confirmed. 4. Cross-check against the daily lab moisture sample | Change logged on DCS. 5. Adjust feed rate or steam to bring moisture back in spec | Handover to next shift."},{"id":"CHK-112","doc":"DOC-039","asset":"AST-003","page":13,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Steam and powder leaking at YD-2301 discharge gland | PTFE 4526L gland packing worn beyond service limit | Replaced 8 pcs PTFE 4526L packing, staggered joints, re-nipped after. 2. Minor powder weep at feed-end gland | PTFE 4505L packing hardened and worn | Renewed 2 pcs PTFE 4505L feed-end packing. 3. Scheduled proof test of dryer outlet high-high temperature trip | Set-point within tolerance, minor zero drift corrected | Recalibrated TSHH-2301 to 125 degC and function tested to logic."},{"id":"CHK-113","doc":"DOC-039","asset":"AST-003","page":13,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The product specification is below 300 ppm moisture. Rising outlet moisture means lost drying and off-spec powder. (2) Respect the interlock SEQ-5500: e.g. TSHH-2301 trips at > 125 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-2301 before working on YD-2301. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Wednesday, 22 April 2026. Footer note: Cross-ref tag YD-2301 across Datasheet, GA, P&ID; Interlock and Maintenance History."},{"id":"CHK-114","doc":"DOC-040","asset":"AST-003","page":14,"sec":"OPL Header, Purpose & Hazard","text":"OPL-YD-2301-07 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Trunnion Bearing Inspection & Drum Float. Discipline: Mechanical. Equipment: YD-2301 - POLYMER FLUID BED DRYER. Area / Unit: 2300 - POWDER DRYING SYSTEM. Related Interlock: SEQ-5500 (SIL 2). P&ID Ref: TJC-LLD-PID-2301. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains trunnion bearing inspection & drum float for YD-2301 (POLYMER FLUID BED DRYER) in the POWDER DRYING SYSTEM. The support trunnions carry the full drum weight; worn rollers cause vibration and mis-tracking of the drum. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task:"},{"id":"CHK-115","doc":"DOC-040","asset":"AST-003","page":14,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Polymer powder / LP Steam at up to 6 barg (shell) / 150 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-116","doc":"DOC-040","asset":"AST-003","page":14,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Do a listening / vibration check on both trunnions each round | Isolation & LOTO verified. 2. Grease the trunnion bearings on the scheduled route | Parts match BOM / spec. 3. Check the drum axial float stays within 5 mm | Torque / clearance to spec. 4. Inspect the thrust roller for wear and correct tracking | No leak / smooth operation. 5. Report any drum wobble or unusual thrust to reliability | Record in equipment history."},{"id":"CHK-117","doc":"DOC-040","asset":"AST-003","page":14,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Steam and powder leaking at YD-2301 discharge gland | PTFE 4526L gland packing worn beyond service limit | Replaced 8 pcs PTFE 4526L packing, staggered joints, re-nipped after . 2. Minor powder weep at feed-end gland | PTFE 4505L packing hardened and worn | Renewed 2 pcs PTFE 4505L feed-end packing. 3. SSLL-2305 speed low alarm, chain slack observed | Chain elongation with normal wear caused slip | Adjusted take-up, lubricated chain, checked sprocket wear."},{"id":"CHK-118","doc":"DOC-040","asset":"AST-003","page":14,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The support trunnions carry the full drum weight; worn rollers cause vibration and mis-tracking of the drum. (2) Respect the interlock SEQ-5500: e.g. TSHH-2301 trips at > 125 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-2301 before working on YD-2301. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Sunday, 26 April 2026. Footer note: Cross-ref tag YD-2301 across Datasheet, GA, P&ID; Interlock and Maintenance History."},{"id":"CHK-119","doc":"DOC-041","asset":"AST-007","page":15,"sec":"OPL Header, Purpose & Hazard","text":"OPL-DC-3401A-01 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Reduction DC-3401A - 4-Step Overview. Discipline: Process / Operations. Equipment: DC-3401A - CATALYST REDUCTION REACTOR. Area / Unit: 3400 - CATALYST REDUCTION SYSTEM. Related Interlock: SEQ-3401 (SIL 2). P&ID Ref: TJC-LLD-PID-3401. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains reduction dc-3401a - 4-step overview for DC-3401A (CATALYST REDUCTION REACTOR) in the CATALYST REDUCTION SYSTEM. The catalyst reduction is done in four controlled steps: Inerting, Heating-Up, Reduction, then Cooling & Preservation. Skipping or rushing a step risks an H2/O2 explosion or ruined catalyst. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task:"},{"id":"CHK-120","doc":"DOC-041","asset":"AST-007","page":15,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-121","doc":"DOC-041","asset":"AST-007","page":15,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Inerting: purge with N2 via FV-17343 until O2 below 100 ppm | Permit valid & briefed. 2. Heating-Up: heater EA-3401 on, N2 at 275 kg/h, ramp TIC-17343 to 180-210 degC | Parameter within limit. 3. Reduction: introduce H2, hold about 12 hours (PdO + H2 -> Pd) | Interlock status confirmed. 4. Cooling: cool all bed below 29 degC, then hold under N2 at 2 kg/cm2 | Change logged on DCS. 5. Log every step transition and confirm permissives before the next step | Handover to next shift."},{"id":"CHK-122","doc":"DOC-041","asset":"AST-007","page":15,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Bed multipoint TC point 3 reading open circuit | Thermocouple element failed at the sheath junction | Replaced TC point 3 in the multipoint assembly, verified reading. 2. One heater bank drawing no current, slow heat-up | Electric heater element bank open circuit / element burnt | Replaced heater element bank, meggered, verified TIC-17343 response. 3. Inerting O2 analyzer drift vs portable reference | Analyzer zero drift and sample dryer saturated | Recalibrated AI-3401 on span gas, replaced sample dryer."},{"id":"CHK-123","doc":"DOC-041","asset":"AST-007","page":15,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The catalyst reduction is done in four controlled steps: Inerting, Heating-Up, Reduction, then Cooling & Preservation. Skipping or rushing a (2) Respect the interlock SEQ-3401: e.g. TSHH-3401 trips at > 230 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-3401 before working on DC-3401A. (4) R
