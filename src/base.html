ecord the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Monday, 13 April 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-124","doc":"DOC-042","asset":"AST-007","page":16,"sec":"OPL Header, Purpose & Hazard","text":"OPL-DC-3401A-02 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Inerting - O2 Freeing Below 100 ppm. Discipline: Process / Operations. Equipment: DC-3401A - CATALYST REDUCTION REACTOR. Area / Unit: 3400 - CATALYST REDUCTION SYSTEM. Related Interlock: SEQ-3401 (SIL 2). P&ID Ref: TJC-LLD-PID-3401. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains inerting - o2 freeing below 100 ppm for DC-3401A (CATALYST REDUCTION REACTOR) in the CATALYST REDUCTION SYSTEM. Hydrogen must never meet oxygen inside the reactor. Inerting is proven before any heating and again before hydrogen is admitted. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task:"},{"id":"CHK-125","doc":"DOC-042","asset":"AST-007","page":16,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-126","doc":"DOC-042","asset":"AST-007","page":16,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Inject nitrogen through FV-17343 into the reactor | Permit valid & briefed. 2. Purge until the outlet O2 analyzer AI-3401 reads below 100 ppm | Parameter within limit. 3. Confirm all vent and drain paths are correctly lined up | Interlock status confirmed. 4. Log the O2 value and time before proceeding to heat-up | Change logged on DCS. 5. If O2 will not fall, check for air ingress at manways/flanges | Handover to next shift."},{"id":"CHK-127","doc":"DOC-042","asset":"AST-007","page":16,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Bed multipoint TC point 3 reading open circuit | Thermocouple element failed at the sheath junction | Replaced TC point 3 in the multipoint assembly, verified reading. 2. One heater bank drawing no current, slow heat-up | Electric heater element bank open circuit / element burnt | Replaced heater element bank, meggered, verified TIC-17343 response. 3. Inerting O2 analyzer drift vs portable reference | Analyzer zero drift and sample dryer saturated | Recalibrated AI-3401 on span gas, replaced sample dryer."},{"id":"CHK-128","doc":"DOC-042","asset":"AST-007","page":16,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Hydrogen must never meet oxygen inside the reactor. Inerting is proven before any heating and again before hydrogen is admitted. (2) Respect the interlock SEQ-3401: e.g. TSHH-3401 trips at > 230 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-3401 before working on DC-3401A. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Friday, 17 April 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-129","doc":"DOC-043","asset":"AST-007","page":17,"sec":"OPL Header, Purpose & Hazard","text":"OPL-DC-3401A-03 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Heating-Up & Bed Homogenisation. Discipline: Process / Operations. Equipment: DC-3401A - CATALYST REDUCTION REACTOR. Area / Unit: 3400 - CATALYST REDUCTION SYSTEM. Related Interlock: SEQ-3401 (SIL 2). P&ID Ref: TJC-LLD-PID-3401. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains heating-up & bed homogenisation for DC-3401A (CATALYST REDUCTION REACTOR) in the CATALYST REDUCTION SYSTEM. The catalyst bed must be homogeneous at 120-135 degC before hydrogen is introduced, otherwise the reduction is uneven and can run away locally. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task:"},{"id":"CHK-130","doc":"DOC-043","asset":"AST-007","page":17,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-131","doc":"DOC-043","asset":"AST-007","page":17,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Energise heater EA-3401 (power on) after inerting is confirmed | Permit valid & briefed. 2. Set the nitrogen carrier flow to about 275 kg/h | Parameter within limit. 3. Raise TIC-17343 slowly to the 180-210 degC band | Interlock status confirmed. 4. Monitor all TE-3401-1..8 until the bed is homogeneous 120-135 degC (~16 h) | Change logged on DCS. 5. Do not admit H2 until every bed thermocouple is within 15 degC | Handover to next shift."},{"id":"CHK-132","doc":"DOC-043","asset":"AST-007","page":17,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Bed multipoint TC point 3 reading open circuit | Thermocouple element failed at the sheath junction | Replaced TC point 3 in the multipoint assembly, verified reading. 2. One heater bank drawing no current, slow heat-up | Electric heater element bank open circuit / element burnt | Replaced heater element bank, meggered, verified TIC-17343 response. 3. Inerting O2 analyzer drift vs portable reference | Analyzer zero drift and sample dryer saturated | Recalibrated AI-3401 on span gas, replaced sample dryer."},{"id":"CHK-133","doc":"DOC-043","asset":"AST-007","page":17,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The catalyst bed must be homogeneous at 120-135 degC before hydrogen is introduced, otherwise the reduction is uneven and can run (2) Respect the interlock SEQ-3401: e.g. TSHH-3401 trips at > 230 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-3401 before working on DC-3401A. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Tuesday, 21 April 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-134","doc":"DOC-044","asset":"AST-007","page":18,"sec":"OPL Header, Purpose & Hazard","text":"OPL-DC-3401A-04 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Hydrogen Reduction Safety & Exotherm Control. Discipline: Process / Operations. Equipment: DC-3401A - CATALYST REDUCTION REACTOR. Area / Unit: 3400 - CATALYST REDUCTION SYSTEM. Related Interlock: SEQ-3401 (SIL 2). P&ID Ref: TJC-LLD-PID-3401. Classification: Trouble Case (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains hydrogen reduction safety & exotherm control for DC-3401A (CATALYST REDUCTION REACTOR) in the CATALYST REDUCTION SYSTEM. Hydrogen is flammable over 4-75 % in air. During reduction the PdO->Pd reaction is exothermic and the bed temperature must be watched closely. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task:"},{"id":"CHK-135","doc":"DOC-044","asset":"AST-007","page":18,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-136","doc":"DOC-044","asset":"AST-007","page":18,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Introduce H2 only after inerting and bed homogeneity are confirmed | Permit valid & briefed. 2. Hold a constant N2+H2 flow for about 12 hours | Parameter within limit. 3. Watch TE-3401 for any exotherm approaching the TSHH-3401 limit | Interlock status confirmed. 4. If bed exceeds 230 degC the logic auto-trips heater and blocks H2 | Change logged on DCS. 5. Keep the reactor vent path (PV-3404) available at all times | Handover to next shift."},{"id":"CHK-137","doc":"DOC-044","asset":"AST-007","page":18,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Bed multipoint TC point 3 reading open circuit | Thermocouple element failed at the sheath junction | Replaced TC point 3 in the multipoint assembly, verified reading. 2. One heater bank drawing no current, slow heat-up | Electric heater element bank open circuit / element burnt | Replaced heater element bank, meggered, verified TIC-17343 response. 3. Inerting O2 analyzer drift vs portable reference | Analyzer zero drift and sample dryer saturated | Recalibrated AI-3401 on span gas, replaced sample dryer."},{"id":"CHK-138","doc":"DOC-044","asset":"AST-007","page":18,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Hydrogen is flammable over 4-75 % in air. During reduction the PdO->Pd reaction is exothermic and the bed temperature must be watched (2) Respect the interlock SEQ-3401: e.g. TSHH-3401 trips at > 230 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-3401 before working on DC-3401A. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Saturday, 25 April 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-139","doc":"DOC-045","asset":"AST-007","page":19,"sec":"OPL Header, Purpose & Hazard","text":"OPL-DC-3401A-05 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Cooling-Down & Catalyst Preservation. Discipline: Process / Operations. Equipment: DC-3401A - CATALYST REDUCTION REACTOR. Area / Unit: 3400 - CATALYST REDUCTION SYSTEM. Related Interlock: SEQ-3401 (SIL 2). P&ID Ref: TJC-LLD-PID-3401. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains cooling-down & catalyst preservation for DC-3401A (CATALYST REDUCTION REACTOR) in the CATALYST REDUCTION SYSTEM. After reduction the catalyst is pyrophoric; it must be cooled slowly and kept under a nitrogen blanket to prevent re-oxidation or fire. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task:"},{"id":"CHK-140","doc":"DOC-045","asset":"AST-007","page":19,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-141","doc":"DOC-045","asset":"AST-007","page":19,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Decrease TIC-17343 slowly, no faster than 0.5 degC/s | Permit valid & briefed. 2. Cool all bed thermocouples below 29 degC (ambient) | Parameter within limit. 3. Switch off heater EA-3401 (power off) once cool | Interlock status confirmed. 4. Isolate the reactor and hold nitrogen pressure at 2 kg/cm2 | Change logged on DCS. 5. Never open the reactor to air while the catalyst is active | Handover to next shift."},{"id":"CHK-142","doc":"DOC-045","asset":"AST-007","page":19,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Bed multipoint TC point 3 reading open circuit | Thermocouple element failed at the sheath junction | Replaced TC point 3 in the multipoint assembly, verified reading. 2. One heater bank drawing no current, slow heat-up | Electric heater element bank open circuit / element burnt | Replaced heater element bank, meggered, verified TIC-17343 response. 3. Inerting O2 analyzer drift vs portable reference | Analyzer zero drift and sample dryer saturated | Recalibrated AI-3401 on span gas, replaced sample dryer."},{"id":"CHK-143","doc":"DOC-045","asset":"AST-007","page":19,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) After reduction the catalyst is pyrophoric; it must be cooled slowly and kept under a nitrogen blanket to prevent re-oxidation or fire. (2) Respect the interlock SEQ-3401: e.g. TSHH-3401 trips at > 230 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-3401 before working on DC-3401A. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Wednesday, 29 April 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-144","doc":"DOC-046","asset":"AST-007","page":20,"sec":"OPL Header, Purpose & Hazard","text":"OPL-DC-3401A-06 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Multipoint Thermocouple TE-3401 Verification. Discipline: Instrument. Equipment: DC-3401A - CATALYST REDUCTION REACTOR. Area / Unit: 3400 - CATALYST REDUCTION SYSTEM. Related Interlock: SEQ-3401 (SIL 2). P&ID Ref: TJC-LLD-PID-3401. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains multipoint thermocouple te-3401 verification for DC-3401A (CATALYST REDUCTION REACTOR) in the CATALYST REDUCTION SYSTEM. The 8-point bed temperature profile drives the whole reduction; a failed or drifting thermocouple can hide a hot spot. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task:"},{"id":"CHK-145","doc":"DOC-046","asset":"AST-007","page":20,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task: (1) De-energise and isolate the loop; place the function to bypass/inhibit under permit. (2) Inform the panel operator before working on any trip, valve or transmitter. (3) Take care with instrument air / hydraulic pressure when disconnecting tubing. (4) Verify intrinsic-safety / Ex integrity is restored before returning to service. (5) Wear correct PPE and follow ESD/override control procedures. 3. TOOLS & MATERIALS REQUIRED: HART communicator / positioner software (e.g. ValveLink); Loop calibrator & decade box / pressure source; Digital multimeter and clamp meter; Span/zero test gas or reference standards; Torque screwdriver and small hand tools; Certified test/inhibit permit."},{"id":"CHK-146","doc":"DOC-046","asset":"AST-007","page":20,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Verify all 8 TE-3401 points are reading and note the spread | Loop isolated / under permit. 2. Flag any single TC more than 15 degC off its neighbours | Reference standard traceable. 3. Cross-check the profile against TIC-17343 heater outlet | As-found & as-left recorded. 4. Replace any open-circuit or drifting TC at the next opportunity | Trip / control action verified. 5. Confirm TSHH-3401 selects the highest bed temperature for the trip | Return to service confirmed."},{"id":"CHK-147","doc":"DOC-046","asset":"AST-007","page":20,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Bed multipoint TC point 3 reading open circuit | Thermocouple element failed at the sheath junction | Replaced TC point 3 in the multipoint assembly, verified reading. 2. Inerting O2 analyzer drift vs portable reference | Analyzer zero drift and sample dryer saturated | Recalibrated AI-3401 on span gas, replaced sample dryer. 3. N2 inert valve slow / sticking during inerting step | Actuator seals hardened, positioner out of calibration | Serviced actuator, replaced seals, recalibrated positioner."},{"id":"CHK-148","doc":"DOC-046","asset":"AST-007","page":20,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The 8-point bed temperature profile drives the whole reduction; a failed or drifting thermocouple can hide a hot spot. (2) Respect the interlock SEQ-3401: e.g. TSHH-3401 trips at > 230 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-3401 before working on DC-3401A. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Sunday, 03 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-149","doc":"DOC-047","asset":"AST-007","page":21,"sec":"OPL Header, Purpose & Hazard","text":"OPL-DC-3401A-07 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Manway Gasket & Box-Up After Catalyst Change. Discipline: Mechanical. Equipment: DC-3401A - CATALYST REDUCTION REACTOR. Area / Unit: 3400 - CATALYST REDUCTION SYSTEM. Related Interlock: SEQ-3401 (SIL 2). P&ID Ref: TJC-LLD-PID-3401. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains manway gasket & box-up after catalyst change for DC-3401A (CATALYST REDUCTION REACTOR) in the CATALYST REDUCTION SYSTEM. A leaking manway loses inert gas and risks air ingress that could ignite the fresh, active catalyst. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task:"},{"id":"CHK-150","doc":"DOC-047","asset":"AST-007","page":21,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling N2 / H2 / Pd catalyst at up to 6 barg / FV / 250 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-151","doc":"DOC-047","asset":"AST-007","page":21,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Always fit a new spiral-wound SS316/graphite gasket | Isolation & LOTO verified. 2. Torque the manway bolts in a star pattern to the specified value | Parts match BOM / spec. 3. Leak test the joint with nitrogen at 2 kg/cm2 | Torque / clearance to spec. 4. Record the catalyst batch number and the loaded volume (3.2 m3) | No leak / smooth operation. 5. Re-instate PSV-3401 and all instruments before start-up | Record in equipment history."},{"id":"CHK-152","doc":"DOC-047","asset":"AST-007","page":21,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Scheduled statutory PSV pop test | Set pressure drift +0.3 barg found | Overhauled PSV-3401, lapped seat, re-set to 6 barg, certified. 2. End-of-life catalyst replacement at turnaround | Spent Pd/Al2O3 catalyst at end of run | Vacuumed out spent catalyst, inspected grids, loaded 3.2 m3 fresh cat. 3. Nitrogen leak at bottom manway during leak test | Spiral-wound gasket unevenly seated | Renewed SW SS316/graphite gasket, re-torqued in star pattern, leak tested."},{"id":"CHK-153","doc":"DOC-047","asset":"AST-007","page":21,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) A leaking manway loses inert gas and risks air ingress that could ignite the fresh, active catalyst. (2) Respect the interlock SEQ-3401: e.g. TSHH-3401 trips at > 230 degC - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-3401 before working on DC-3401A. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Thursday, 07 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-154","doc":"DOC-048","asset":"AST-009","page":22,"sec":"OPL Header, Purpose & Hazard","text":"OPL-KC-4501-01 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Lube Oil System Pre-Start & Priming. Discipline: Mechanical. Equipment: KC-4501 - RECYCLE GAS COMPRESSOR. Area / Unit: 4500 - RECYCLE GAS SYSTEM. Related Interlock: SEQ-4501 (SIL 2). P&ID Ref: TJC-LLD-PID-4501. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains lube oil system pre-start & priming for KC-4501 (RECYCLE GAS COMPRESSOR) in the RECYCLE GAS SYSTEM. With no lube oil pressure the crankshaft bearings fail in seconds; the pre-lube pump must build pressure before the machine is cranked. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task:"},{"id":"CHK-155","doc":"DOC-048","asset":"AST-009","page":22,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-156","doc":"DOC-048","asset":"AST-009","page":22,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Run the auxiliary lube oil pump and build pressure above 2 barg | Isolation & LOTO verified. 2. Confirm PSLL-4504 shows healthy oil pressure | Parts match BOM / spec. 3. Check the frame oil level and the filter differential pressure | Torque / clearance to spec. 4. Verify no oil leaks and correct oil grade in the frame | No leak / smooth operation. 5. Only then give the start command to the main motor | Record in equipment history."},{"id":"CHK-157","doc":"DOC-048","asset":"AST-009","page":22,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. High discharge temperature trip TSHH-4503, capacity drop | 1st stage suction plate valve fractured | Replaced complete suction valve set, checked seat, leak tested. 2. KC-4501 tripped on PSLL-4504 low lube oil pressure | Lube oil pump gears worn, relief valve set low | Overhauled lube oil pump, reset relief valve, verified 2.5 barg. 3. High blow-by, low 2nd stage efficiency | PTFE piston rings worn beyond limit | Renewed 2nd stage PTFE piston and rider rings, honed cylinder."},{"id":"CHK-158","doc":"DOC-048","asset":"AST-009","page":22,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) With no lube oil pressure the crankshaft bearings fail in seconds; the pre-lube pump must build pressure before the machine is cranked. (2) Respect the interlock SEQ-4501: e.g. PSLL-4504 trips at < 1.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-4501 before working on KC-4501. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Friday, 24 April 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-159","doc":"DOC-049","asset":"AST-009","page":23,"sec":"OPL Header, Purpose & Hazard","text":"OPL-KC-4501-02 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Compressor Suction/Discharge Valve Inspection. Discipline: Mechanical. Equipment: KC-4501 - RECYCLE GAS COMPRESSOR. Area / Unit: 4500 - RECYCLE GAS SYSTEM. Related Interlock: SEQ-4501 (SIL 2). P&ID Ref: TJC-LLD-PID-4501. Classification: Trouble Case (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains compressor suction/discharge valve inspection for KC-4501 (RECYCLE GAS COMPRESSOR) in the RECYCLE GAS SYSTEM. Broken plate valves are the classic cause of high discharge temperature (TSHH-4503) and lost capacity on KC-4501. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task:"},{"id":"CHK-160","doc":"DOC-049","asset":"AST-009","page":23,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-161","doc":"DOC-049","asset":"AST-009","page":23,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Isolate, depressurise and purge the cylinder with nitrogen | Isolation & LOTO verified. 2. Remove the suction and discharge valve caps | Parts match BOM / spec. 3. Inspect valve plates, springs and seats; replace as a complete set | Torque / clearance to spec. 4. Check the valve gasket and seat for damage | No leak / smooth operation. 5. Torque the valve caps to spec and leak test before start | Record in equipment history."},{"id":"CHK-162","doc":"DOC-049","asset":"AST-009","page":23,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. High discharge temperature trip TSHH-4503, capacity drop | 1st stage suction plate valve fractured | Replaced complete suction valve set, checked seat, leak tested. 2. KC-4501 tripped on PSLL-4504 low lube oil pressure | Lube oil pump gears worn, relief valve set low | Overhauled lube oil pump, reset relief valve, verified 2.5 barg. 3. High blow-by, low 2nd stage efficiency | PTFE piston rings worn beyond limit | Renewed 2nd stage PTFE piston and rider rings, honed cylinder."},{"id":"CHK-163","doc":"DOC-049","asset":"AST-009","page":23,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Broken plate valves are the classic cause of high discharge temperature (TSHH-4503) and lost capacity on KC-4501. (2) Respect the interlock SEQ-4501: e.g. PSLL-4504 trips at < 1.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-4501 before working on KC-4501. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Tuesday, 28 April 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-164","doc":"DOC-050","asset":"AST-009","page":24,"sec":"OPL Header, Purpose & Hazard","text":"OPL-KC-4501-03 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Seal Gas (N2 Buffer) Management. Discipline: Process / Operations. Equipment: KC-4501 - RECYCLE GAS COMPRESSOR. Area / Unit: 4500 - RECYCLE GAS SYSTEM. Related Interlock: SEQ-4501 (SIL 2). P&ID Ref: TJC-LLD-PID-4501. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains seal gas (n2 buffer) management for KC-4501 (RECYCLE GAS COMPRESSOR) in the RECYCLE GAS SYSTEM. The nitrogen buffer keeps flammable process gas out of the crankcase; loss of seal gas is a fire/explosion risk. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task:"},{"id":"CHK-165","doc":"DOC-050","asset":"AST-009","page":24,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-166","doc":"DOC-050","asset":"AST-009","page":24,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Verify FT-4506 seal gas flow is established before start | Permit valid & briefed. 2. Maintain the buffer differential above process pressure | Parameter within limit. 3. Watch the distance-piece vent for signs of leakage | Interlock status confirmed. 4. Respond immediately to a seal-gas low alarm | Change logged on DCS. 5. Never run the compressor with seal gas lost | Handover to next shift."},{"id":"CHK-167","doc":"DOC-050","asset":"AST-009","page":24,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. High discharge temperature trip TSHH-4503, capacity drop | 1st stage suction plate valve fractured | Replaced complete suction valve set, checked seat, leak tested. 2. KC-4501 tripped on PSLL-4504 low lube oil pressure | Lube oil pump gears worn, relief valve set low | Overhauled lube oil pump, reset relief valve, verified 2.5 barg. 3. High blow-by, low 2nd stage efficiency | PTFE piston rings worn beyond limit | Renewed 2nd stage PTFE piston and rider rings, honed cylinder."},{"id":"CHK-168","doc":"DOC-050","asset":"AST-009","page":24,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The nitrogen buffer keeps flammable process gas out of the crankcase; loss of seal gas is a fire/explosion risk. (2) Respect the interlock SEQ-4501: e.g. PSLL-4504 trips at < 1.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-4501 before working on KC-4501. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Saturday, 02 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-169","doc":"DOC-051","asset":"AST-009","page":25,"sec":"OPL Header, Purpose & Hazard","text":"OPL-KC-4501-04 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Anti-Surge / Recycle Operation. Discipline: Process / Operations. Equipment: KC-4501 - RECYCLE GAS COMPRESSOR. Area / Unit: 4500 - RECYCLE GAS SYSTEM. Related Interlock: SEQ-4501 (SIL 2). P&ID Ref: TJC-LLD-PID-4501. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains anti-surge / recycle operation for KC-4501 (RECYCLE GAS COMPRESSOR) in the RECYCLE GAS SYSTEM. The recycle (spillback) valve protects the machine at low throughput and during start/stop; incorrect operation risks deadhead and rod overload. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task:"},{"id":"CHK-170","doc":"DOC-051","asset":"AST-009","page":25,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-171","doc":"DOC-051","asset":"AST-009","page":25,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Keep the anti-surge FV-4502 in auto during start-up | Permit valid & briefed. 2. Avoid deadheading against a high discharge pressure (PSHH-4502) | Parameter within limit. 3. Watch suction PSLL-4501 for gas starvation | Interlock status confirmed. 4. Return the machine to load slowly, closing recycle gradually | Change logged on DCS. 5. Investigate any repeated surge cycling with the vendor curve | Handover to next shift."},{"id":"CHK-172","doc":"DOC-051","asset":"AST-009","page":25,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. High discharge temperature trip TSHH-4503, capacity drop | 1st stage suction plate valve fractured | Replaced complete suction valve set, checked seat, leak tested. 2. KC-4501 tripped on PSLL-4504 low lube oil pressure | Lube oil pump gears worn, relief valve set low | Overhauled lube oil pump, reset relief valve, verified 2.5 barg. 3. High blow-by, low 2nd stage efficiency | PTFE piston rings worn beyond limit | Renewed 2nd stage PTFE piston and rider rings, honed cylinder."},{"id":"CHK-173","doc":"DOC-051","asset":"AST-009","page":25,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The recycle (spillback) valve protects the machine at low throughput and during start/stop; incorrect operation risks deadhead and rod (2) Respect the interlock SEQ-4501: e.g. PSLL-4504 trips at < 1.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-4501 before working on KC-4501. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Wednesday, 06 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-174","doc":"DOC-052","asset":"AST-009","page":26,"sec":"OPL Header, Purpose & Hazard","text":"OPL-KC-4501-05 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Crosshead Vibration Monitoring (VSHH-4505). Discipline: Instrument. Equipment: KC-4501 - RECYCLE GAS COMPRESSOR. Area / Unit: 4500 - RECYCLE GAS SYSTEM. Related Interlock: SEQ-4501 (SIL 2). P&ID Ref: TJC-LLD-PID-4501. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains crosshead vibration monitoring (vshh-4505) for KC-4501 (RECYCLE GAS COMPRESSOR) in the RECYCLE GAS SYSTEM. A rising crosshead vibration trend warns of loose running gear before it trips or fails. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task:"},{"id":"CHK-175","doc":"DOC-052","asset":"AST-009","page":26,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task: (1) De-energise and isolate the loop; place the function to bypass/inhibit under permit. (2) Inform the panel operator before working on any trip, valve or transmitter. (3) Take care with instrument air / hydraulic pressure when disconnecting tubing. (4) Verify intrinsic-safety / Ex integrity is restored before returning to service. (5) Wear correct PPE and follow ESD/override control procedures. 3. TOOLS & MATERIALS REQUIRED: HART communicator / positioner software (e.g. ValveLink); Loop calibrator & decade box / pressure source; Digital multimeter and clamp meter; Span/zero test gas or reference standards; Torque screwdriver and small hand tools; Certified test/inhibit permit."},{"id":"CHK-176","doc":"DOC-052","asset":"AST-009","page":26,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Trend VT-4501 crosshead vibration on the daily route | Loop isolated / under permit. 2. Alarm at 8 mm/s and trip at 11 mm/s (VSHH-4505) | Reference standard traceable. 3. Correlate any rise with TE-4507 main bearing temperature | As-found & as-left recorded. 4. Investigate rod-load reversals and crosshead pin clearance | Trip / control action verified. 5. Escalate a sudden step-change to reliability immediately | Return to service confirmed."},{"id":"CHK-177","doc":"DOC-052","asset":"AST-009","page":26,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Proof test of lube oil low-low trip | Set-point within tolerance | Recalibrated PSLL-4504 to 1.5 barg, function tested. 2. Seal gas flow FT-4506 low, buffer pressure unstable | N2 buffer regulator diaphragm failed | Replaced seal gas regulator, re-established buffer dP. 3. Proof test of KO drum high-high level trip | Float healthy, minor set-point trim | Verified LSHH-4510 float and trip action."},{"id":"CHK-178","doc":"DOC-052","asset":"AST-009","page":26,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) A rising crosshead vibration trend warns of loose running gear before it trips or fails. (2) Respect the interlock SEQ-4501: e.g. PSLL-4504 trips at < 1.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-4501 before working on KC-4501. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Sunday, 10 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-179","doc":"DOC-053","asset":"AST-009","page":27,"sec":"OPL Header, Purpose & Hazard","text":"OPL-KC-4501-06 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Suction KO Drum Draining (FA-4510). Discipline: Process / Operations. Equipment: KC-4501 - RECYCLE GAS COMPRESSOR. Area / Unit: 4500 - RECYCLE GAS SYSTEM. Related Interlock: SEQ-4501 (SIL 2). P&ID Ref: TJC-LLD-PID-4501. Classification: Trouble Case (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains suction ko drum draining (fa-4510) for KC-4501 (RECYCLE GAS COMPRESSOR) in the RECYCLE GAS SYSTEM. Liquid carried over from the KO drum destroys valves and can bend piston rods; the boot must be drained regularly. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task:"},{"id":"CHK-180","doc":"DOC-053","asset":"AST-009","page":27,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-181","doc":"DOC-053","asset":"AST-009","page":27,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Drain the FA-4510 boot every shift on the operator round | Permit valid & briefed. 2. Watch LT-4510 level and the LSHH-4510 high-high trip | Parameter within limit. 3. Never run the compressor with a high KO drum level | Interlock status confirmed. 4. Report frequent liquid carryover to process for investigation | Change logged on DCS. 5. Confirm the auto-drain (if fitted) is functioning | Handover to next shift."},{"id":"CHK-182","doc":"DOC-053","asset":"AST-009","page":27,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. High discharge temperature trip TSHH-4503, capacity drop | 1st stage suction plate valve fractured | Replaced complete suction valve set, checked seat, leak tested. 2. KC-4501 tripped on PSLL-4504 low lube oil pressure | Lube oil pump gears worn, relief valve set low | Overhauled lube oil pump, reset relief valve, verified 2.5 barg. 3. High blow-by, low 2nd stage efficiency | PTFE piston rings worn beyond limit | Renewed 2nd stage PTFE piston and rider rings, honed cylinder."},{"id":"CHK-183","doc":"DOC-053","asset":"AST-009","page":27,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Liquid carried over from the KO drum destroys valves and can bend piston rods; the boot must be drained regularly. (2) Respect the interlock SEQ-4501: e.g. PSLL-4504 trips at < 1.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-4501 before working on KC-4501. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Thursday, 14 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-184","doc":"DOC-054","asset":"AST-009","page":28,"sec":"OPL Header, Purpose & Hazard","text":"OPL-KC-4501-07 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Intercooler EA-4502 Performance Check. Discipline: Mechanical. Equipment: KC-4501 - RECYCLE GAS COMPRESSOR. Area / Unit: 4500 - RECYCLE GAS SYSTEM. Related Interlock: SEQ-4501 (SIL 2). P&ID Ref: TJC-LLD-PID-4501. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains intercooler ea-4502 performance check for KC-4501 (RECYCLE GAS COMPRESSOR) in the RECYCLE GAS SYSTEM. Poor intercooling raises the 2nd-stage suction temperature and hence the final discharge temperature towards the trip. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task:"},{"id":"CHK-185","doc":"DOC-054","asset":"AST-009","page":28,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Ethylene/Hexane/H2 at up to 16 barg / 150 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-186","doc":"DOC-054","asset":"AST-009","page":28,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Check the interstage temperature drop across EA-4502 | Isolation & LOTO verified. 2. Verify the jacket water flow FSL-4508 is adequate | Parts match BOM / spec. 3. Clean the intercooler tubes if the approach temperature rises | Torque / clearance to spec. 4. Log the interstage pressure and compare to datasheet | No leak / smooth operation. 5. Report fouling trends so cleaning can be planned | Record in equipment history."},{"id":"CHK-187","doc":"DOC-054","asset":"AST-009","page":28,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. High discharge temperature trip TSHH-4503, capacity drop | 1st stage suction plate valve fractured | Replaced complete suction valve set, checked seat, leak tested. 2. KC-4501 tripped on PSLL-4504 low lube oil pressure | Lube oil pump gears worn, relief valve set low | Overhauled lube oil pump, reset relief valve, verified 2.5 barg. 3. High blow-by, low 2nd stage efficiency | PTFE piston rings worn beyond limit | Renewed 2nd stage PTFE piston and rider rings, honed cylinder."},{"id":"CHK-188","doc":"DOC-054","asset":"AST-009","page":28,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Poor intercooling raises the 2nd-stage suction temperature and hence the final discharge temperature towards the trip. (2) Respect the interlock SEQ-4501: e.g. PSLL-4504 trips at < 1.5 barg - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-4501 before working on KC-4501. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Monday, 18 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-189","doc":"DOC-055","asset":"AST-012","page":29,"sec":"OPL Header, Purpose & Hazard","text":"OPL-EA-5601-01 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Tube-Side Cleaning (Hydrojetting). Discipline: Mechanical. Equipment: EA-5601 - SOLVENT HEATER. Area / Unit: 5600 - SOLVENT HEATING SYSTEM. Related Interlock: N/A (control loop only) (N/A). P&ID Ref: TJC-LLD-PID-5601. Classification: Trouble Case (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains tube-side cleaning (hydrojetting) for EA-5601 (SOLVENT HEATER) in the SOLVENT HEATING SYSTEM. Hexane fouling on the tube side raises the differential pressure (PDT-5605) and cuts the heat duty, leaving cold solvent downstream. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task:"},{"id":"CHK-190","doc":"DOC-055","asset":"AST-012","page":29,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-191","doc":"DOC-055","asset":"AST-012","page":29,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Isolate and drain both sides, then purge with nitrogen | Isolation & LOTO verified. 2. Open the channel cover and remove the old gasket | Parts match BOM / spec. 3. Hydrojet the tube bores and inspect for pitting/erosion | Torque / clearance to spec. 4. Verify tube-side dP restored and no residual blockage | No leak / smooth operation. 5. Re-gasket with new SW SS316 gasket and box up to torque | Record in equipment history."},{"id":"CHK-192","doc":"DOC-055","asset":"AST-012","page":29,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. High tube dP PDT-5605, low solvent outlet temperature | Hexane fouling / polymer fines deposit on tube bores | Hydrojetted 246 tubes, restored dP and duty, re-gasketed. 2. Hexane weep at channel flange | Spiral-wound channel gasket relaxed / damaged | Renewed channel gasket, re-torqued in cross pattern. 3. Continuous steam at condensate, high steam use | Steam trap element failed open | Replaced steam trap element, verified condensate temperature."},{"id":"CHK-193","doc":"DOC-055","asset":"AST-012","page":29,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Hexane fouling on the tube side raises the differential pressure (PDT-5605) and cuts the heat duty, leaving cold solvent downstream. (2) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-5601 before working on EA-5601. (3) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Tuesday, 05 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-194","doc":"DOC-056","asset":"AST-012","page":30,"sec":"OPL Header, Purpose & Hazard","text":"OPL-EA-5601-02 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Gasket Replacement & Flange Box-Up. Discipline: Mechanical. Equipment: EA-5601 - SOLVENT HEATER. Area / Unit: 5600 - SOLVENT HEATING SYSTEM. Related Interlock: N/A (control loop only) (N/A). P&ID Ref: TJC-LLD-PID-5601. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains gasket replacement & flange box-up for EA-5601 (SOLVENT HEATER) in the SOLVENT HEATING SYSTEM. Spiral-wound gaskets are single-use; reusing one causes hexane leaks at the channel and shell flanges. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task:"},{"id":"CHK-195","doc":"DOC-056","asset":"AST-012","page":30,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-196","doc":"DOC-056","asset":"AST-012","page":30,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Remove the old shell and channel gaskets completely | Isolation & LOTO verified. 2. Clean and inspect the gasket seating faces for damage | Parts match BOM / spec. 3. Fit new SW SS316/graphite gaskets, correctly centred | Torque / clearance to spec. 4. Torque the flange bolts in a cross pattern in passes | No leak / smooth operation. 5. Leak test on start-up and re-torque hot if permitted | Record in equipment history."},{"id":"CHK-197","doc":"DOC-056","asset":"AST-012","page":30,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. High tube dP PDT-5605, low solvent outlet temperature | Hexane fouling / polymer fines deposit on tube bores | Hydrojetted 246 tubes, restored dP and duty, re-gasketed. 2. Hexane weep at channel flange | Spiral-wound channel gasket relaxed / damaged | Renewed channel gasket, re-torqued in cross pattern. 3. Continuous steam at condensate, high steam use | Steam trap element failed open | Replaced steam trap element, verified condensate temperature."},{"id":"CHK-198","doc":"DOC-056","asset":"AST-012","page":30,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Spiral-wound gaskets are single-use; reusing one causes hexane leaks at the channel and shell flanges. (2) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-5601 before working on EA-5601. (3) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Saturday, 09 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-199","doc":"DOC-057","asset":"AST-012","page":31,"sec":"OPL Header, Purpose & Hazard","text":"OPL-EA-5601-03 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Steam Trap Health Check. Discipline: Process / Operations. Equipment: EA-5601 - SOLVENT HEATER. Area / Unit: 5600 - SOLVENT HEATING SYSTEM. Related Interlock: N/A (control loop only) (N/A). P&ID Ref: TJC-LLD-PID-5601. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains steam trap health check for EA-5601 (SOLVENT HEATER) in the SOLVENT HEATING SYSTEM. A failed steam trap either floods the shell (killing duty) or blows live steam (wasting energy); regular checks catch both. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task:"},{"id":"CHK-200","doc":"DOC-057","asset":"AST-012","page":31,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-201","doc":"DOC-057","asset":"AST-012","page":31,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Compare the condensate temperature TI-5604 to steam temperature | Permit valid & briefed. 2. Use ultrasonic or a listening stick to check trap operation | Parameter within limit. 3. A cold trap means flooding; a continuously hot blow means leak-through | Interlock status confirmed. 4. Check the condensate pot level gauge LG-5606 | Change logged on DCS. 5. Replace the trap element or trap as required | Handover to next shift."},{"id":"CHK-202","doc":"DOC-057","asset":"AST-012","page":31,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. High tube dP PDT-5605, low solvent outlet temperature | Hexane fouling / polymer fines deposit on tube bores | Hydrojetted 246 tubes, restored dP and duty, re-gasketed. 2. Hexane weep at channel flange | Spiral-wound channel gasket relaxed / damaged | Renewed channel gasket, re-torqued in cross pattern. 3. Continuous steam at condensate, high steam use | Steam trap element failed open | Replaced steam trap element, verified condensate temperature."},{"id":"CHK-203","doc":"DOC-057","asset":"AST-012","page":31,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) A failed steam trap either floods the shell (killing duty) or blows live steam (wasting energy); regular checks catch both. (2) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-5601 before working on EA-5601. (3) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Wednesday, 13 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-204","doc":"DOC-058","asset":"AST-012","page":32,"sec":"OPL Header, Purpose & Hazard","text":"OPL-EA-5601-04 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Thermal-Shock Avoidance on Start-Up. Discipline: Process / Operations. Equipment: EA-5601 - SOLVENT HEATER. Area / Unit: 5600 - SOLVENT HEATING SYSTEM. Related Interlock: N/A (control loop only) (N/A). P&ID Ref: TJC-LLD-PID-5601. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains thermal-shock avoidance on start-up for EA-5601 (SOLVENT HEATER) in the SOLVENT HEATING SYSTEM. Admitting steam onto a cold tube bundle too fast cracks the tube-to-tubesheet joints, causing internal leaks. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task:"},{"id":"CHK-205","doc":"DOC-058","asset":"AST-012","page":32,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-206","doc":"DOC-058","asset":"AST-012","page":32,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Establish solvent (tube-side) flow first | Permit valid & briefed. 2. Admit steam slowly by ramping the TV-5602 / TIC-5602 set-point | Parameter within limit. 3. Warm the exchanger through gradually | Interlock status confirmed. 4. Avoid sudden large steps in the outlet temperature set-point | Change logged on DCS. 5. Watch for knocking that indicates condensate hammer | Handover to next shift."},{"id":"CHK-207","doc":"DOC-058","asset":"AST-012","page":32,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. High tube dP PDT-5605, low solvent outlet temperature | Hexane fouling / polymer fines deposit on tube bores | Hydrojetted 246 tubes, restored dP and duty, re-gasketed. 2. Hexane weep at channel flange | Spiral-wound channel gasket relaxed / damaged | Renewed channel gasket, re-torqued in cross pattern. 3. Continuous steam at condensate, high steam use | Steam trap element failed open | Replaced steam trap element, verified condensate temperature."},{"id":"CHK-208","doc":"DOC-058","asset":"AST-012","page":32,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Admitting steam onto a cold tube bundle too fast cracks the tube-to-tubesheet joints, causing internal leaks. (2) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-5601 before working on EA-5601. (3) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Sunday, 17 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-209","doc":"DOC-059","asset":"AST-012","page":33,"sec":"OPL Header, Purpose & Hazard","text":"OPL-EA-5601-05 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Tube Leak Detection & Plugging. Discipline: Mechanical. Equipment: EA-5601 - SOLVENT HEATER. Area / Unit: 5600 - SOLVENT HEATING SYSTEM. Related Interlock: N/A (control loop only) (N/A). P&ID Ref: TJC-LLD-PID-5601. Classification: Trouble Case (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains tube leak detection & plugging for EA-5601 (SOLVENT HEATER) in the SOLVENT HEATING SYSTEM. A tube leak lets steam into the solvent (rising outlet temperature and water in the solvent); the leaking tube must be found and plugged. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task:"},{"id":"CHK-210","doc":"DOC-059","asset":"AST-012","page":33,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-211","doc":"DOC-059","asset":"AST-012","page":33,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Isolate and hydrotest the shell side to find the leak | Isolation & LOTO verified. 2. Bubble-test to identify the specific leaking tube | Parts match BOM / spec. 3. Plug both ends of the tube with tapered plugs | Torque / clearance to spec. 4. Record the plugged-tube count (maximum 5 % of tubes) | No leak / smooth operation. 5. Plan bundle replacement if the plugging limit is reached | Record in equipment history."},{"id":"CHK-212","doc":"DOC-059","asset":"AST-012","page":33,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. High tube dP PDT-5605, low solvent outlet temperature | Hexane fouling / polymer fines deposit on tube bores | Hydrojetted 246 tubes, restored dP and duty, re-gasketed. 2. Hexane weep at channel flange | Spiral-wound channel gasket relaxed / damaged | Renewed channel gasket, re-torqued in cross pattern. 3. Continuous steam at condensate, high steam use | Steam trap element failed open | Replaced steam trap element, verified condensate temperature."},{"id":"CHK-213","doc":"DOC-059","asset":"AST-012","page":33,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) A tube leak lets steam into the solvent (rising outlet temperature and water in the solvent); the leaking tube must be found and plugged. (2) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-5601 before working on EA-5601. (3) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Thursday, 21 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-214","doc":"DOC-060","asset":"AST-012","page":34,"sec":"OPL Header, Purpose & Hazard","text":"OPL-EA-5601-06 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Fouling Trend & Cleaning Schedule (PDT-5605). Discipline: Instrument. Equipment: EA-5601 - SOLVENT HEATER. Area / Unit: 5600 - SOLVENT HEATING SYSTEM. Related Interlock: N/A (control loop only) (N/A). P&ID Ref: TJC-LLD-PID-5601. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains fouling trend & cleaning schedule (pdt-5605) for EA-5601 (SOLVENT HEATER) in the SOLVENT HEATING SYSTEM. Trending the tube-side differential pressure predicts when cleaning is due before the duty is lost. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task:"},{"id":"CHK-215","doc":"DOC-060","asset":"AST-012","page":34,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task: (1) De-energise and isolate the loop; place the function to bypass/inhibit under permit. (2) Inform the panel operator before working on any trip, valve or transmitter. (3) Take care with instrument air / hydraulic pressure when disconnecting tubing. (4) Verify intrinsic-safety / Ex integrity is restored before returning to service. (5) Wear correct PPE and follow ESD/override control procedures. 3. TOOLS & MATERIALS REQUIRED: HART communicator / positioner software (e.g. ValveLink); Loop calibrator & decade box / pressure source; Digital multimeter and clamp meter; Span/zero test gas or reference standards; Torque screwdriver and small hand tools; Certified test/inhibit permit."},{"id":"CHK-216","doc":"DOC-060","asset":"AST-012","page":34,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Log PDT-5605 differential pressure weekly | Loop isolated / under permit. 2. Note the PDAH-5605 fouling alarm at 0.7 bar dP | Reference standard traceable. 3. Correlate rising dP with any outlet-temperature shortfall | As-found & as-left recorded. 4. Plan cleaning before the duty loss becomes critical | Trip / control action verified. 5. Feed the trend into the exchanger cleaning program | Return to service confirmed."},{"id":"CHK-217","doc":"DOC-060","asset":"AST-012","page":34,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Outlet temperature hunting around set-point | Steam valve TV-5602 loop poorly tuned | Retuned TIC-5602 PID, verified stable control. 2. Erratic tube dP reading | Impulse lines plugged with fines | Cleaned and re-zeroed PDT-5605 transmitter. 3. Cracked gauge glass on condensate pot | Thermal/mechanical stress on glass | Replaced LG-5606 gauge glass and seals."},{"id":"CHK-218","doc":"DOC-060","asset":"AST-012","page":34,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Trending the tube-side differential pressure predicts when cleaning is due before the duty is lost. (2) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-5601 before working on EA-5601. (3) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Monday, 25 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-219","doc":"DOC-061","asset":"AST-012","page":35,"sec":"OPL Header, Purpose & Hazard","text":"OPL-EA-5601-07 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: PSV-5607 Testing & Car-Seal Management. Discipline: Mechanical. Equipment: EA-5601 - SOLVENT HEATER. Area / Unit: 5600 - SOLVENT HEATING SYSTEM. Related Interlock: N/A (control loop only) (N/A). P&ID Ref: TJC-LLD-PID-5601. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains psv-5607 testing & car-seal management for EA-5601 (SOLVENT HEATER) in the SOLVENT HEATING SYSTEM. The tube-side relief valve is the exchanger's overpressure protection and must be proven and never isolated in service. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task:"},{"id":"CHK-220","doc":"DOC-061","asset":"AST-012","page":35,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane / MP Steam at up to 16 barg (tube) / 200 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-221","doc":"D
