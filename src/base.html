<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Manufacturing Knowledge Hub</title>
<style>
@@BASE_CSS@@
</style>
</head>
<body>
<aside>
  <div class="brand">⚙️ Knowledge Hub<small>CALIBER 2026 · Case 1</small></div>
  <div class="nav active" data-page="dashboard">▦ Dashboard</div>
  <div class="nav" data-page="equipment">🏭 Equipment Sets</div>
  <div class="nav" data-page="assistant">🤖 AI Assistant</div>
  <div class="nav" data-page="documents">📄 Documents</div>
  <div class="nav" data-page="opl">🧩 OPL Library</div>
  <div class="nav" data-page="quality">⚠️ Data Quality</div>
  <div class="foot"><span class="dot" id="apiDot" style="background:var(--warn)"></span><span id="apiStatus">Local KB · 8 sets loaded</span></div>
</aside>
<main id="app"></main>
<script>window.CASE=@@CASE:meta@@;window.FIN=@@CASE:fin@@;window.NW=n=>["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"][n]||String(n);window.KB=@@CASE:kb@@;</script>

<style>
.cx{border-collapse:collapse;width:100%;font-size:12.5px}.cx th,.cx td{border:1px solid var(--line);padding:6px 7px;text-align:center;vertical-align:middle}.cx th{background:var(--panel2);font-weight:600;font-size:11px}.cx td.l{text-align:left}
.cx tr.r{cursor:pointer}.cx tr.r:hover td{background:#1c2a3d}.cx tr.sel td{background:#14304f}.cx td.d{color:var(--muted)}.cx td.d.on{color:var(--acc);font-size:15px}
.cx.trip tr.sel td.d.on{background:#5b1d22;color:#ff7b72;font-weight:700}
.vb{display:inline-flex;width:54px;height:54px;border:2px solid var(--ok);border-radius:10px;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;margin:4px 8px 4px 0;font-size:11px;color:var(--ok);background:#0f2a18;user-select:none}
.vb.f{border-color:var(--bad);color:var(--bad);background:#3a1417}.vb b{font-size:17px}
.lamp{display:inline-block;padding:7px 14px;border-radius:8px;font-weight:700;letter-spacing:.5px}.lamp.g{background:#0f2a18;color:var(--ok);border:1px solid var(--ok)}.lamp.r{background:#3a1417;color:var(--bad);border:1px solid var(--bad)}.lamp.y{background:#2e2410;color:var(--warn);border:1px solid var(--warn)}
.gate{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel2)}.gate.ok{border-color:#2d6b3c}.gate.no{border-color:var(--bad);background:#2a1618}
@keyframes fl{to{stroke-dashoffset:-18}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes pl{50%{stroke-width:7}}@keyframes b2{50%{opacity:.2}}.fl{animation:fl .8s linear infinite}.sp{transform-origin:450px 78px;animation:sp 2.4s linear infinite}.sp.ps{animation-play-state:paused}.pl{animation:pl 1.6s ease-in-out infinite}.bl2{animation:b2 .6s steps(2) infinite}.ots{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ots h3{text-transform:uppercase;letter-spacing:.6px;font-size:12.5px;color:#9fb3c8}.otsh{display:flex;justify-content:space-between;align-items:center;background:#0a1220;border:1px solid #27405f;border-radius:10px 10px 0 0;padding:10px 14px;font-size:13px;color:#cfe3ff}.otsb{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:#0f1a2b;border:1px solid #27405f;border-top:0;padding:8px 14px;font-size:12px;color:#9fb3c8}.otsb b{color:#e6edf3}
.ban{padding:10px 14px;font-weight:700;letter-spacing:.4px;border:1px solid;border-top:0;border-radius:0 0 10px 10px;display:flex;justify-content:space-between}.ban.g{background:#0d2016;color:var(--ok);border-color:#2d6b3c}.ban.y{background:#2e2410;color:var(--warn);border-color:var(--warn)}.ban.r{background:#4a1519;color:#ff9b94;border-color:var(--bad);animation:bl 1s steps(2) infinite}@keyframes bl{50%{background:#2a0c0f}}
.fps{display:flex;gap:10px;flex-wrap:wrap}.fp{min-width:112px;padding:8px 10px;border:1px solid #2d6b3c;border-radius:6px;background:#08140d;cursor:pointer;display:flex;flex-direction:column;gap:2px}.fp i{font-style:normal;font-size:11px;color:var(--muted)}.fp b{font-size:18px;color:#7ee787}.fp em{font-style:normal;font-size:10.5px;color:var(--ok)}.fp.f{border-color:var(--bad);background:#2a1012}.fp.f b,.fp.f em{color:#ff7b72}
.ann{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.ann>div{border:1px solid var(--line);background:#111923;border-radius:6px;padding:7px 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px}.ann>div span{color:#6f8196}.ann em{font-style:normal;font-weight:700}.ann>div.on{background:#4a1519;border-color:var(--bad);color:#ffd2ce}.ann>div.on em{color:#ff7b72}
.soe td{font-size:12px}.soe .cALM{color:#ff7b72;font-weight:700}.soe .cOPR{color:var(--acc)}.soe .cINS{color:var(--warn)}.soe .cPRM{color:var(--vio)}.soe .cSYS{color:var(--muted)}
.cx .tag{white-space:nowrap}.chip{cursor:pointer}.chip:hover{filter:brightness(1.3)}
</style>
<script>
(()=>{const X=@@CASE:dsil@@;const SETS=KB.sets;KB.DS={};KB.IL={};
SETS.forEach(s=>{const d=X.DS[s.tag],il=X.IL[s.tag];KB.DS[s.n]=d;KB.IL[s.n]=il;
 KB.docs.push({id:"DS-"+s.n,asset:s.asset,name:`Equipment Datasheet · ${s.tag} – ${d.title.replace(/ DATA SHEET/i,"")} (${d.no})`,type:"Datasheet",rev:3,status:"Issued for Operation",date:"—",src:"equipmentdatasheet_merged.pdf, page "+s.n,set:s.n},
  {id:"IL-"+s.n,asset:s.asset,name:`Interlock Logic · ${il.logic} – ${il.desc} (${il.no})`,type:"Interlock Logic",rev:3,status:"Issued for Operation",date:"—",src:"interlocklogic_merged.pdf, page "+s.n,set:s.n});
 d.secs.forEach(([nm,r],i)=>KB.chunks.push({id:`CHK-DS-${s.n}-${i}`,doc:"DS-"+s.n,asset:s.asset,page:1,sec:"Datasheet – "+nm,text:`${s.tag} ${d.title}. `+r.map(x=>x.join(": ")).join("; ")}));
 KB.chunks.push({id:`CHK-IL-${s.n}-h`,doc:"IL-"+s.n,asset:s.asset,page:1,sec:"Interlock – overview & effects",text:`${il.logic} ${il.desc}, ${il.sil}, ${s.tag}. Final elements: `+il.eff.map((e,i)=>`EFF-${i+1} ${e}`).join("; ")+". "+il.notes});
 il.trig.forEach(t=>KB.chunks.push({id:`CHK-IL-${s.n}-${t.id}`,doc:"IL-"+s.n,asset:s.asset,page:1,sec:`Interlock – cause ${t.id} ${t.tag}`,text:`${il.logic} cause ${t.id}: ${t.c} (${t.tag}) set point ${t.sp}, voting ${t.vote}. Trip effects: `+t.fx.map((x,i)=>x?il.eff[i]:null).filter(Boolean).join("; ")+"."}));
 KB.chunks.push({id:`CHK-IL-${s.n}-p`,doc:"IL-"+s.n,asset:s.asset,page:1,sec:"Interlock – start permissive",text:`${il.logic} start permissive (AND-gate) for ${s.tag}: `+il.perm.map(p=>`${p[0]}. ${p[1]} [${p[2]}]`).join("; ")+". All must be true and trip reset for START ENABLED."})});
const IS={};window.ILS=IS;window.KDS=n=>KB.DS[n];window.KIL=KB.IL;
const st=n=>IS[n]||(IS[n]={sel:0,fail:[],lat:false,perm:null});
const kn=v=>{const m=/(\d)oo(\d)/.exec(v);return m?[+m[1],+m[2]]:[1,1]};
const nums=a=>String(a??"").match(/\d+(\.\d+)?/g)||[];
const rec=(n,t)=>{const i=KB.inst.find(i=>i.set===n&&i.tag.split(/[\s\/()]+/).includes(t.tag));if(!i)return`<span class="tag warn" title="Tag not found in P&ID instrument list">not on list</span>`;
 if(!nums(i.sp).length)return`<span class="tag acc" title="P&ID list says: ${esc(i.sp)}">fills gap</span>`;
 return nums(t.sp).some(x=>nums(i.sp).includes(x))?`<span class="tag ok" title="P&ID list: ${esc(i.sp)}">matches</span>`:`<span class="tag bad" title="P&ID list: ${esc(i.sp)}">differs</span>`};
window.tagGo=(n,t)=>{const i=D[n].n.findIndex(x=>x[0]===t);i>=0?pidGo(n,i):go("equipment",{set:n,tab:"seq",wo:null})};
const chip=(n,t)=>`<span class="tag acc chip" onclick="tagGo(${n},'${t}')" title="Open on P&ID">${t}</span>`;
const TAGRE=/\b[A-Z]{1,4}-\d{3,5}[A-Z]?(?:-\d)?\b/g;
const now=()=>new Date().toTimeString().slice(0,8);
const lg=(s,c,m)=>{s.log.unshift([now(),c,m]);s.log=s.log.slice(0,40)};
const S0=n=>{const s=st(n);s.log=s.log||[];s.ack=s.ack||false;return s};
window.ilT=(n,i)=>{const s=S0(n),t=KIL[n].trig[i];s.sel=i;s.fail=[];s.lat=false;s.ack=false;lg(s,"SYS",`Scenario loaded: ${t.id} ${t.c} (${t.tag})`);render()};
window.ilF=(n,j)=>{const s=S0(n),t=KIL[n].trig[s.sel],[k,N]=kn(t.vote),a=s.fail.indexOf(j);if(a<0){s.fail.push(j);lg(s,"INS",`${t.tag}-${j+1} beyond set point ${t.sp}  [${s.fail.length}/${N}, trip at ${k}]`)}else{s.fail.splice(a,1);lg(s,"INS",`${t.tag}-${j+1} returned to normal`)}
 if(s.fail.length>=k&&!s.lat){s.lat=true;s.ack=false;lg(s,"ALM",`${KIL[n].logic} TRIP — ${t.c}. Safety PLC actuating ${t.fx.filter(Boolean).length} final elements`)}render()};
window.ilP=(n,j)=>{const s=S0(n);s.perm=s.perm||KIL[n].perm.map(_=>1);s.perm[j]^=1;lg(s,"PRM",`Permissive ${j+1} ${s.perm[j]?"HEALTHY":"LOST"}: ${KIL[n].perm[j][1]}`);render()};
window.ilA=n=>{const s=S0(n);s.ack=true;lg(s,"OPR","Operator acknowledged trip alarm");render()};
window.ilR=n=>{const s=S0(n);s.fail=[];s.lat=false;s.ack=false;lg(s,"OPR","Manual trip reset executed — logic re-armed");render()};
window.ilX=n=>{IS[n]={sel:0,fail:[],lat:false,perm:null,log:[],ack:false};render()};
const pv=(t,bad)=>{const m=/([<>])\s*([\d.]+)\s*(.*)/.exec(t.sp);if(!m)return bad?"ACTIVE":"NORMAL";const v=+m[2],lo=m[1]==="<",u=m[3].replace(/ for .*/,"");return((bad?(lo?v*.85:v*1.08):(lo?v*1.6:v*.8)).toFixed(v<20?1:0))+" "+u};
const hdr=(n,k)=>{const s=SETS[n-1],d=KB.DS[n],il=KB.IL[n];return`<div class="card" style="margin-bottom:12px"><div class="row between"><div><span class="tag acc">${k==="ds"?d.no:il.no}</span> ${tg("Rev 3 · Issued for Operation","ok")} <span class="tag">Sample data for CALIBER</span></div><div class="row" style="gap:8px"><button class="ghost" onclick="st.tab='${k==="ds"?"seq":"ds"}';render()">${k==="ds"?"⚡ Open OTS interlock simulator":"📋 Open equipment data sheet"}</button><button class="ghost" onclick="go('assistant',{scope:${n}})">✨ Ask instructor AI</button></div></div></div>`};
window.dsView=n=>{const s=SETS[n-1],d=KB.DS[n],il=KB.IL[n],all=d.secs.flatMap(x=>x[1]).map(x=>x[1]).join(" "),tags=[...new Set(all.match(TAGRE)||[])].filter(t=>t!==s.tag);
 const crit=(d.secs[0][1].find(r=>/criticality/i.test(r[0]))||[,""])[1];
 return hdr(n,"ds")+`<div class="card" style="margin-bottom:12px"><h3>${esc(d.title)} · ${s.tag}</h3><p class="muted" style="margin:4px 0 8px">Criticality ${tg(crit,/HIGH/.test(crit)?"bad":/LOW/.test(crit)?"":"warn")} · Safety function: ${il.logic==="N/A (control loop only)"?"<b>control loop only (no ESD)</b>":`<b>${il.logic}</b> ${tg(il.sil,"warn")}`} · ${il.trig.length} ${il.logic.startsWith("N/A")?"loop functions":"initiating causes"}</p>
 <div class="row" style="gap:6px;flex-wrap:wrap">${tags.length?`<span class="muted">Tag cross-reference:</span>`+tags.map(t=>chip(n,t)).join(""):""}</div></div>
 <div class="grid g2">${d.secs.map(([nm,r])=>`<div class="card"><h3 style="margin-bottom:6px">${nm}</h3>${kv(r.map(x=>[esc(x[0]),esc(x[1])]))}</div>`).join("")}
 <div class="card"><h3 style="margin-bottom:6px">Operating envelope &amp; protection limits</h3><p class="muted" style="margin-bottom:8px">Design basis from the data sheet shown beside the set points that protect it (${il.no}).</p>${il.trig.map(t=>`<div class="row between" style="padding:5px 0;border-bottom:1px solid var(--line)"><span>${esc(t.c)}</span><span>${chip(n,t.tag)} <b>${esc(t.sp)}</b></span></div>`).join("")}</div>
 <div class="card"><h3 style="margin-bottom:6px">Document cross-references</h3>${d.notes.map(x=>`<p class="muted" style="margin-bottom:6px">${esc(x)}</p>`).join("")}${lnk("📐 P&ID "+s.pid.ref,`st.tab='pid';render()`)}${lnk("🛠 Equipment drawing "+s.ga.dwg_no,`st.tab='ga';render()`)}${lnk("⚡ Interlock "+il.logic,`st.tab='seq';render()`)}${lnk("🧩 One-point lessons",`st.tab='opl';render()`)}${lnk("🔧 Maintenance history",`st.tab='maint';render()`)}</div></div>`};
window.otsDiag=n=>{const s=S0(n),il=KB.IL[n],tag=SETS[n-1].tag,T=il.trig,E=il.eff,t=T[s.sel],[k,N]=kn(t.vote),perm=s.perm||il.perm.map(_=>1),ok=perm.every(x=>x),lat=s.lat,pre=s.fail.length&&!lat,run=!lat&&ok,C=lat?"#ff5d55":pre?"#e3b341":"#3fb950";
 const rot=/^(GA|KC|CT|YD)/.test(tag);
 const kind=e=>/ANNUNC/i.test(e)?"bell":/TRIP/i.test(e)?"mot":/START|REQUEST/i.test(e)?"st":"vlv";
 const stt=(e,on)=>!on?"STANDBY":/CLOSE/i.test(e)?"CLOSED":/OPEN|VENT|RELIEF/i.test(e)?"OPEN":/TRIP/i.test(e)?"TRIPPED":"ACTUATED";
 const sh=e=>(e.match(/[A-Z]{1,4}-\d{3,5}[A-Z]?(?:-\d)?/)||[e.split(" ").slice(0,2).join(" ")])[0];
 const m=E.length,gx=i=>(i+.5)*900/m;
 let a=`<svg viewBox="0 0 900 215" style="width:100%;background:#070d16;border:1px solid #27405f;border-radius:8px"><text x="12" y="18" fill="#7f93a8" font-size="11">PROCESS MIMIC · ${tag} · ${esc(il.desc)}</text>
 <path d="M20 78H395M505 78H880" stroke="${run?"#2f6fbf":"#444c56"}" stroke-width="7" fill="none"/><path class="${run?"fl":""}" d="M20 78H395M505 78H880" stroke="${run?"#9cc8ff":"#2a3038"}" stroke-width="2" stroke-dasharray="9 9" fill="none"/>
 <text x="22" y="64" fill="#7f93a8" font-size="10">FEED IN</text><text x="840" y="64" fill="#7f93a8" font-size="10">OUT</text>
 <circle cx="450" cy="78" r="52" fill="#0c1726" stroke="${lat?"#ff5d55":run?"#3fb950":"#e3b341"}" stroke-width="3" ${run&&!rot?`class="pl"`:""}/>
 ${rot?`<g class="sp ${run?"":"ps"}"><line x1="450" y1="38" x2="450" y2="118" stroke="#6fa8ff" stroke-width="5"/><line x1="410" y1="78" x2="490" y2="78" stroke="#6fa8ff" stroke-width="5"/><line x1="422" y1="50" x2="478" y2="106" stroke="#4a78b8" stroke-width="3"/><line x1="478" y1="50" x2="422" y2="106" stroke="#4a78b8" stroke-width="3"/></g>`:`<rect x="425" y="55" width="50" height="46" rx="6" fill="none" stroke="#6fa8ff" stroke-width="3"/><path d="M425 82q12-9 25 0t25 0" stroke="#6fa8ff" stroke-width="3" fill="none"/>`}
 <text x="450" y="152" text-anchor="middle" fill="${C}" font-size="13" font-weight="700">${tag} · ${lat?"TRIPPED":run?"RUNNING":"STOPPED – NOT READY"}</text>
 <path d="M450 130V168M${gx(0)} 168H${gx(m-1)}" stroke="#35506d" stroke-width="2" fill="none"/>`;
 E.forEach((e,i)=>{const on=lat&&t.fx[i],x=gx(i),c=on?"#ff5d55":"#6f8196",fl=on?"#4a1519":"#16202c",ty=kind(e);
  a+=`<path d="M${x} 168V176" stroke="#35506d" stroke-width="2"/><g transform="translate(${x},188)">${ty==="vlv"?`<path d="M-13-9L13 9V-9L-13 9Z" fill="${fl}" stroke="${c}" stroke-width="2"/>`:ty==="mot"?`<circle r="11" fill="${fl}" stroke="${c}" stroke-width="2"/><text y="4" text-anchor="middle" fill="${c}" font-size="11" font-weight="700">M</text>`:ty==="bell"?`<text y="6" text-anchor="middle" font-size="17" ${on?`class="bl2"`:""}>🔔</text>`:`<rect x="-11" y="-9" width="22" height="18" rx="4" fill="${fl}" stroke="${c}" stroke-width="2"/><text y="4" text-anchor="middle" fill="${c}" font-size="11">↻</text>`}</g><text x="${x}" y="207" text-anchor="middle" fill="${c}" font-size="9.5">${sh(e)} · ${stt(e,on)}</text>`});
 a+="</svg>";
 const nr=Math.max(T.length,m),H=50+nr*44,ty=i=>40+i*(T.length<m?(nr-1)/Math.max(T.length-1,1):1)*44,ey=j=>40+j*(m<nr?(nr-1)/Math.max(m-1,1):1)*44;
 let b=`<svg viewBox="0 0 900 ${H}" style="width:100%;background:#070d16;border:1px solid #27405f;border-radius:8px"><text x="12" y="18" fill="#7f93a8" font-size="11">LOGIC DIAGRAM · ${il.logic} · click an initiator to arm it</text>
 <rect x="415" y="28" width="70" height="${H-40}" rx="8" fill="${lat?"#3a1417":"#0f1a2b"}" stroke="${C}" stroke-width="2"/><text transform="translate(455 ${H/2}) rotate(-90)" text-anchor="middle" fill="${C}" font-size="12" font-weight="700">${il.logic.startsWith("N/A")?"CONTROL SYSTEM":"SAFETY PLC · "+il.sil}</text>`;
 T.forEach((r,i)=>r.fx.forEach((x,j)=>{if(!x)return;const on=i===s.sel;b+=`<path d="M265 ${ty(i)}C 380 ${ty(i)},520 ${ey(j)},640 ${ey(j)}" fill="none" stroke="${on?C:"#1e2b3b"}" stroke-width="${on?2.5:1.2}" ${on?`class="${lat||!pre?"fl":"fl"}" stroke-dasharray="7 7"`:""}/>`}));
 T.forEach((r,i)=>{const on=i===s.sel,y=ty(i);b+=`<g style="cursor:pointer" onclick="ilT(${n},${i})"><rect x="10" y="${y-17}" width="255" height="34" rx="6" fill="${on?(lat?"#4a1519":pre?"#2e2410":"#12304f"):"#0f1a2b"}" stroke="${on?C:"#2b3a4c"}" stroke-width="${on?2:1}"/><text x="18" y="${y-3}" fill="#e6edf3" font-size="11" font-weight="700">${r.id} · ${r.tag}</text><text x="18" y="${y+11}" fill="#8b98a5" font-size="10">${esc(r.c).slice(0,30)} · ${r.vote}</text>${on&&!/control|alarm|mech/.test(r.vote)?Array.from({length:N},(_,q)=>`<circle cx="${215+q*14}" cy="${y}" r="5" fill="${s.fail.includes(q)?"#ff5d55":"#3fb950"}"/>`).join(""):""}</g>`});
 E.forEach((e,j)=>{const on=lat&&t.fx[j],y=ey(j);b+=`<rect x="640" y="${y-17}" width="250" height="34" rx="6" fill="${on?"#4a1519":"#0f1a2b"}" stroke="${on?"#ff5d55":"#2b3a4c"}"/><text x="648" y="${y-3}" fill="${on?"#ffb4ae":"#e6edf3"}" font-size="11" font-weight="700">FE-${j+1} · ${on?stt(e,1):"STANDBY"}</text><text x="648" y="${y+11}" fill="#8b98a5" font-size="10">${esc(e).slice(0,36)}</text>`});
 return`<div class="card" style="margin:12px 0"><h3>Dynamic process mimic &amp; logic diagram</h3><p class="muted" style="margin:4px 0 8px">Live view of the selected scenario: flow stops, the rotor halts and final elements change state when the trip latches.</p>${a}<div style="height:10px"></div>${b+"</svg>"}</div>`};
window.ilView=n=>{const s=S0(n),il=KB.IL[n],tg0=SETS[n-1].tag,t=il.trig[s.sel],[k,N]=kn(t.vote),ctl=/control|alarm|mech/.test(t.vote),perm=s.perm=s.perm||il.perm.map(_=>1),ok=perm.every(x=>x),cleared=s.fail.length<k,loop=il.logic.startsWith("N/A"),pre=s.fail.length&&!s.lat;
 const ban=s.lat?`<div class="ban r">${s.ack?"■":"▲"} ${il.logic} · TRIP ACTIVE · ${esc(t.c)} · ${t.tag} ${esc(t.sp)} <span>${s.ack?"ACKNOWLEDGED":"UNACKNOWLEDGED"}</span></div>`:pre?`<div class="ban y">▲ PRE-TRIP · ${s.fail.length} of ${N} voters in alarm · ${t.tag} · ${k-s.fail.length} more to trip</div>`:`<div class="ban g">● NO ACTIVE ALARMS · ${il.logic.startsWith("N/A")?"CONTROL LOOP MODE":"SAFETY LOGIC ARMED"}</div>`;
 const stp=[["Acknowledge trip alarm",s.ack],["Verify final elements in safe state",s.ack],["Identify and clear the initiating cause",s.lat&&cleared],["Confirm all start permissives healthy",ok],["Execute manual trip reset",!s.lat]];
 return`<div class="ots"><div class="otsh"><div><b>OPERATOR TRAINING SIMULATOR</b> &nbsp;·&nbsp; ${tg0} &nbsp;·&nbsp; ${il.logic}</div><div><span class="lamp y" style="padding:3px 9px">SIMULATION MODE</span> <span class="muted">Not connected to live plant · Sample data</span></div></div>
 <div class="otsb"><span>DOC <b>${il.no}</b></span><span>REV <b>3</b></span><span>${il.sil.replace("N/A","NON-SIS")}</span><span>FLOC <b>${il.floc}</b></span><span>${esc(il.desc)}</span><span style="margin-left:auto"><button class="ghost" onclick="st.tab='ds';render()">📋 Equipment data sheet</button> <button class="ghost" onclick="go('assistant',{scope:${n}})">✨ Instructor AI</button> <button class="ghost" onclick="ilX(${n})">⟲ Reset simulator</button></span></div>${ban}${otsDiag(n)}

 <div class="fps">${ctl?`<div class="fp"><i>${t.tag}</i><b>${esc(t.sp)}</b><em>${t.fx[0]?"ACTING":"MONITOR"}</em></div>`:Array.from({length:N},(_,j)=>{const b=s.fail.includes(j);return`<div class="fp ${b?"f":""}" onclick="ilF(${n},${j})"><i>${t.tag}-${j+1}</i><b>${pv(t,b)}</b><em>${b?"TRIP ▲":"NORMAL"}</em></div>`}).join("")}</div>
 <h3 style="margin:14px 0 6px">Final elements</h3><div class="ann">${il.eff.map((e,i)=>{const on=s.lat&&t.fx[i];return`<div class="${on?"on":""}"><span>FE-${i+1}</span>${esc(e)}<em>${on?"ACTUATED":"STANDBY"}</em></div>`}).join("")}</div></div>
 <div class="card"><h3>Operator response procedure</h3><p class="muted" style="margin:4px 0 8px">Follow in order — a latched trip cannot be reset until the cause has cleared.</p>
 ${stp.map((x,i)=>`<div class="gate ${x[1]?"ok":""}" style="cursor:default"><span>${x[1]?"✔":i+1}</span><span style="flex:1">${x[0]}</span></div>`).join("")}

 <h3 style="margin:14px 0 6px">Start permissive interlock</h3>${il.perm.map((p,j)=>`<div class="gate ${perm[j]?"ok":"no"}" onclick="ilP(${n},${j})"><span>${perm[j]?"✔":"✘"}</span><span style="flex:1">P${j+1} · ${esc(p[1])}</span>${chip(n,p[2])}</div>`).join("")}
 <div style="margin-top:8px"><span class="lamp ${ok&&!s.lat?"g":ok?"y":"r"}">${ok&&!s.lat?`START ${tg0} — PERMITTED`:s.lat?"START INHIBITED — TRIP LATCHED":"START INHIBITED — PERMISSIVE LOST"}</span></div></div></div>
 <div class="card" style="margin-top:12px"><h3>Sequence of Events (SOE)</h3><table class="cx soe"><tr><th style="width:90px">Time</th><th style="width:60px">Class</th><th>Event</th></tr>${s.log.length?s.log.map(l=>`<tr><td>${l[0]}</td><td class="c${l[1]}">${l[1]}</td><td class="l">${esc(l[2])}</td></tr>`).join(""):`<tr><td colspan="3" class="muted">No events yet. Pick a scenario and start it.</td></tr>`}</table></div>
 <p class="muted" style="margin-top:10px;font-size:12px">${esc(il.notes)}</p></div>`};
window.ilSum=n=>{const il=KB.IL[n];return il.logic.startsWith("N/A")?"control loop":il.sil+" · "+il.trig.length+" trips"}})();
</script>
<script>
const $=s=>document.querySelector(s),app=$("#app"),K=KB,API="/.netlify/functions";

const tg=(s,c)=>`<span class="tag ${c??TC[s]??""}">${esc(s)}</span>`,ds=d=>d.status||"Not stated",fmt=n=>Math.round(n).toLocaleString();

const tbl=(h,r,on)=>`<div class="card" style="padding:4px 8px;overflow:auto"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map((c,i)=>`<tr class="${on?"click":""}" ${on?`onclick="${on(i)}"`:""}>${c.map(x=>`<td>${x??"—"}</td>`).join("")}</tr>`).join("")}</table></div>`;
const kv=(r)=>`<table>${r.map(([a,b])=>`<tr><td class="muted" style="width:42%">${a}</td><td>${b??"—"}</td></tr>`).join("")}</table>`;
const filt=(k,l,opts,all)=>`<select onchange="st.f.${k}=this.value;render()"><option value="">${all}</option>${opts.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return`<option value="${v}" ${st.f[k]==v?"selected":""}>${t}</option>`}).join("")}</select>`;
const setOpts=K.sets.map(s=>[s.n,`Set ${s.n} · ${s.tag}`]);
const stats=(a)=>`<div class="grid g4">${a.map(([b,l])=>`<div class="card stat"><b>${b}</b><span>${l}</span></div>`).join("")}</div>`;
const woOf=n=>K.mnt.filter(m=>m.set===n),docsOf=n=>K.docs.filter(d=>d.set===n);

/* Plot-plan map: positions from plot_plan_drawings (E/N metres); click a node to open its set */
const POS={1:[124,132],2:[160,132],3:[196,132],4:[232,132],5:[124,204],6:[160,204],7:[196,204],8:[232,204]};
const MODES={dt:["Breakdown downtime (h)",n=>sum(woOf(n),m=>m.dt)],cm:["Corrective work orders",n=>cnt(woOf(n),m=>m.type==="Corrective")],rv:["Instruments flagged REVIEW",n=>cnt(K.inst,i=>i.set===n&&i.flag)]};

  const X=e=>(e-100)*3.6+50,Y=n=>(n-110)*3.6+30,col=x=>x>t2?"#f85149":x>t1?"#d29922":"#3fb950";

  const nodes=K.sets.map((s,i)=>{const[e,n]=POS[s.n],x=X(e),y=Y(n),on=sel===s.n,c=col(v[i]);
    return `<g style="cursor:pointer" onclick="go('equipment',{set:${s.n},tab:'overview'})"><title>${s.tag} · ${s.name} · ${MODES[mode][0]}: ${Math.round(v[i])} · E${e}/N${n} approx</title>
    <rect x="${x-60}" y="${y-28}" width="120" height="56" rx="10" fill="${on?"rgba(47,129,247,.25)":"#1f2630"}" stroke="${on?"#2f81f7":c}" stroke-width="${on?3:2}"/>
    <text x="${x}" y="${y-10}" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">${s.tag}</text>
    <text x="${x}" y="${y+4}" fill="#8b98a5" font-size="9.5" text-anchor="middle">${s.name.length>20?s.name.slice(0,19)+"…":s.name}</text>
    <text x="${x}" y="${y+19}" fill="#8b98a5" font-size="9" text-anchor="middle">A${s.area} · ${s.pp.elevation_label}</text>
    <circle cx="${x+52}" cy="${y-20}" r="4" fill="${c}"/></g>`}).join("");
  return `<svg viewBox="0 0 700 560" style="width:100%;height:auto">${ticks}
  <rect x="30" y="${Y(168)-14}" width="640" height="28" fill="rgba(163,113,247,.12)" stroke="#a371f7" stroke-dasharray="5 4"/><text x="350" y="${Y(168)+4}" fill="#a371f7" font-size="11" text-anchor="middle">MAIN PIPE RACK</text>
  <rect x="30" y="${Y(238)}" width="640" height="22" fill="#161b22" stroke="#2b3440"/><text x="350" y="${Y(238)+15}" fill="#8b98a5" font-size="10" text-anchor="middle">ROAD (6 m)</text>
  <rect x="30" y="30" width="640" height="${Y(238)-30}" fill="none" stroke="#2b3440" stroke-dasharray="2 3"/><text x="38" y="44" fill="#8b98a5" font-size="9">BATTERY LIMIT</text>
  ${nodes}<line x1="50" y1="${Y(238)+44}" x2="122" y2="${Y(238)+44}" stroke="#8b98a5" stroke-width="2"/><text x="50" y="${Y(238)+58}" fill="#8b98a5" font-size="9">0 — 20 m</text>
  <text x="640" y="${Y(238)+50}" fill="#8b98a5" font-size="11" text-anchor="end">▲ N</text></svg>
  <div class="row" style="font-size:12px;color:var(--muted)"><span><span class="dot" style="background:#3fb950"></span>low</span><span><span class="dot" style="background:#d29922"></span>mid</span><span><span class="dot" style="background:#f85149"></span>high</span><span>· relative tiers across the 8 sets · positions approx ±1 m from plot plan sheets</span></div>`}
const modeSel=()=>`<select onchange="st.f.mm=this.value;render()">${Object.entries(MODES).map(([k,[l]])=>`<option value="${k}" ${(st.f.mm||"dt")===k?"selected":""}>Colour by: ${l}</option>`).join("")}</select>`;

/* Dashboard */
function dashboard(){
  const hi=K.issues.filter(i=>i.severity==="High"),noApp=cnt(K.docs,d=>!d.status),maxD=Math.max(...K.sets.map(s=>sum(woOf(s.n),m=>m.dt)));

  <table><tr><th>Set</th><th>Equipment</th><th>P&ID</th><th>GA</th><th>Datasheet</th><th>Plot plan</th><th>Interlock</th><th>OPL</th></tr>
  ${K.sets.map(s=>`<tr class="click" onclick="go('equipment',{set:${s.n},tab:'overview'})"><td>${s.n}</td><td><b>${s.tag}</b><br><span class="muted">${s.name}</span></td><td>${cell(1)}</td><td>${cell(1)}</td><td>${cell(1,"Rev 3")}</td><td>${cell(1)}</td><td>${cell(1,KIL[s.n].logic.startsWith("N/A")?"loop only":KIL[s.n].logic)}</td><td>${cnt(K.opl,o=>o.set===s.n)}</td></tr>`).join("")}</table></div>

/* Equipment sets */
function setList(){return `<h1>Equipment Knowledge Sets</h1><p class="sub">Each set = P&ID + GA drawing + datasheet + plot plan + interlock logic + OPLs + maintenance history, for one main equipment item</p>
<div class="grid g3">${K.sets.map(s=>`<div class="card click" onclick="go('equipment',{set:${s.n},tab:'overview'})"><div class="row between"><span class="tag acc">SET ${s.n} · ${s.tag}</span>${tg(s.crit,"bad")}</div>
<h3 style="margin-top:10px">${s.name}</h3><p class="muted">Area ${s.area} · ${s.unit}</p>
<div class="row" style="margin-top:12px"><span class="tag">📄 ${docsOf(s.n).length} documents</span><span class="tag">🧩 ${cnt(K.opl,o=>o.set===s.n)} lessons</span><span class="tag">🔧 ${woOf(s.n).length} work orders</span><span class="tag">⚡ ${cnt(K.inst,i=>i.set===s.n)} instruments</span></div></div>`).join("")}</div>`}

   <div class="card"><h3>GA drawing <span class="tag">${g.dwg_no}</span></h3>${kv([["Length × height",`${g.overall_length_mm} × ${g.height_mm} mm`],["CL elevation",g.cl_elevation_mm+" mm"],["Dry weight",g.dry_weight_kg&&g.dry_weight_kg+" kg"],["Motor",g.motor_power],["Interlock ref",g.assoc_interlock_ref],["P&ID ref",s.pid.ref]])}</div>

  return `<span class="back" onclick="go('equipment',{set:null})">← All equipment sets</span><div class="row between"><div><h1>${s.name}</h1><p class="sub">Set ${n} · ${s.tag} · Area ${s.area} ${s.unit} · ${s.pid.ref}</p></div><button onclick="go('assistant',{scope:${n}})">🤖 Ask AI about ${s.tag}</button></div>

function retrieve(q,scope){const T=q.toLowerCase().replace(/[^a-z0-9\- ]/g," ").split(/\s+/).filter(t=>t&&!STOP.has(t));

  return `<div class="osh">

/* ------------------------------------------------------------------ simulation engine */
let SIM=null;
const cmp=(v,c)=>c&&(c[0]===">"?v>c[1]:v<c[1]);
const vstate=(d,v)=>cmp(v,d.tr)?"tr":(cmp(v,d.al)||cmp(v,d.al2))?"al":"ok";
const vs=(S,d)=>((d.rz||d.na)&&S.E.armed&&!S.E.armed(S))?"ok":vstate(d,S.V[d.k]);
const tfmt=t=>{t=Math.max(0,t);const d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60),p=x=>String(x).padStart(2,"0");return d?`Day ${d+1}  ${p(h)}:${p(m)}`:h?`${p(h)}:${p(m)}:${p(s)}`:`${p(m)}:${p(s)}`};
function lg(c,m){if(!SIM)return;SIM.log.unshift([tfmt(SIM.t),c,m]);SIM.log=SIM.log.slice(0,80)}
window.OPLH.lg=lg;
function fb(c,m){SIM.fb={c,m}}

function simInit(no,i){
  const o=OPL[no],n=o.set,E=EQ[n],list=SC[no]||[];if(!E||!list.length)return null;
  i=CL(i|0,0,list.length-1);const s=list[i];
  const P=Object.assign({},E.P0,s.p||{}),V={};E.V.forEach(d=>V[d.k]=d.lo);
  SIM={no,i,n,o,E,s,P,V,R:{},t:0,ph:{},hist:[],log:[],steps:{},done:{},bad:0,trips:0,trip:null,tt:{},alm:{},run:false,spd:1,ts:s.ts||E.ts||1,out:null,hold:0,fl:{},dmg:null,fb:null,hint:false,sample:0,dr:0};
  if(s.r)for(const k in s.r)SIM.R[k]=s.r[k].slice();
  E.init&&E.init(SIM);
  for(let j=0;j<4;j++){const T=E.model(SIM,0);Object.assign(V,T)}  /* settle at equilibrium */
  if(s.v)Object.assign(V,s.v);
  s.init&&s.init(SIM);
  SIM.dmg=null;
  lg("SYS",`Scenario loaded: ${s.n}`);
  return SIM;
}
function step(dt){
  const S=SIM,E=S.E;
  for(const k in S.R){const [g,r]=S.R[k],d=g-S.P[k],q=r*dt;if(Math.abs(d)<=q){S.P[k]=g;delete S.R[k]}else S.P[k]+=Math.sign(d)*q}
  const T=E.model(S,dt);
  E.V.forEach(d=>{if(T[d.k]!==undefined&&isFinite(T[d.k]))S.V[d.k]+=(T[d.k]-S.V[d.k])*Math.min(1,dt/(d.tau||1))});
  S.t+=dt;
  const armed=E.armed?E.armed(S):true;
  E.V.forEach(d=>{const v=S.V[d.k],st=vs(S,d);
    if(st!=="ok"&&!S.alm[d.k]){S.alm[d.k]=1;lg(st==="tr"?"ALM":"AL",`${d.tag} ${d.l} ${st==="tr"?"HIGH-HIGH / LOW-LOW":"alarm"}: ${F(v,d.d)} ${d.u}`)}
    if(st==="ok")S.alm[d.k]=0;
    const ar=d.arm?d.arm(S):armed;if(!d.tr||!ar||S.trip){S.tt[d.k]=0;return}
    if(cmp(v,d.tr)){S.tt[d.k]=(S.tt[d.k]||0)+dt;if(S.tt[d.k]>=(d.dly||0)){
      if(S.P.byp&&d.byp!==false){if(!S.fl["bw"+d.k]){S.fl["bw"+d.k]=1;lg("ALM",`${d.tag} beyond trip set point (${d.tr[0]} ${d.tr[1]} ${d.u}) — interlock BYPASSED, no protective action taken`)}}
      else{S.trip={k:d.k,tag:d.tag,t:S.t,l:d.l};S.trips++;E.onTrip&&E.onTrip(S,d);lg("ALM",`${KIL[S.n].logic} TRIP — ${d.tag} ${d.l} ${d.tr[0]} ${d.tr[1]} ${d.u}. Final elements actuated.`)}}}
    else S.tt[d.k]=0});
}
function finish(ok,msg){
  const S=SIM;if(S.out)return;S.run=false;
  let sc=100-S.bad*20-(S.s.k==="bad"?0:Math.min(3,S.trips)*12);const stp=Object.keys(S.steps).length;sc=CL(sc+Math.min(10,stp*2),0,100);
  if(!ok)sc=Math.min(sc,35);
  S.out={ok,msg,sc:Math.round(sc)};lg(ok?"OK":"ALM",ok?`Scenario complete: ${msg}`:`Scenario not completed: ${msg}`);
}
function tick(dr){
  const S=SIM;if(!S||!S.run||S.out)return;
  S.dr=dr;const dt=dr*S.ts*S.spd,h=S.E.h||1,nn=Math.min(40,Math.max(1,Math.ceil(dt/h)));
  for(let j=0;j<nn;j++){step(dt/nn);if(S.dmg)break}
  if(S.dmg){finish(false,S.dmg);return}
  if(S.s.g&&S.good>0&&S.s.g[1](S)){S.hold+=dr;if(S.hold>=(S.s.g[2]||2.5))finish(true,S.s.g[0])}else S.hold=0;
  if(S.s.fail){const m=S.s.fail(S);if(m)finish(false,m)}
}

/* ------------------------------------------------------------------ simulator UI */
const KS=["fault","proc","trend","bad"];
function simView(o){
  const sc=SC[o.no]||[];
  if(!sc.length)return `<div class="card"><h3>No scenario defined</h3></div>`;
  let i=CL(st.si|0,0,sc.length-1);if(!SIM||SIM.no!==o.no||SIM.i!==i)simInit(o.no,i);
  const S=SIM;
  return `<div class="sim"><div class="scn">${sc.map((x,j)=>`<button class="${j===S.i?"on":""}" onclick="go('opl',{om:'sim',si:${j}});"><span class="k ${x.k}">${KIND[x.k][0]}</span><span>${esc(x.n)}<small>${KIND[x.k][1]}${x.row!=null?" · troubleshooting row "+(x.row+1):""}</small></span></button>`).join("")}</div>
  <div id="simWrap">${simBody()}</div></div>`;
}
function simBody(){
  const S=SIM,s=S.s,o=S.o;
  return `<div class="sbrief"><div><p>${s.d}</p><p class="lsn"><b>OPL says:</b> ${esc(o.obj)}</p><p class="goal">Goal: ${esc(s.g[0])}</p></div>
   <div class="sctl"><div class="clock" id="simClk">${tfmt(S.t)}<small>simulated time · ${S.ts>=3600?"≈"+F(S.ts/3600,S.ts>=36000?0:1)+" h":S.ts>=60?F(S.ts/60,0)+" min":S.ts+" s"} per second at 1×</small></div>
    <div class="row"><button id="simRun" onclick="oplRun()">${S.out?"Repeat":S.run?"Pause":"Run"}</button><button class="ghost" onclick="oplReset()">Reset</button></div>
