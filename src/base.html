OC-061","asset":"AST-012","page":35,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Confirm PSV-5607 is set to 16 barg on the nameplate | Isolation & LOTO verified. 2. Carry out an off-line pop test per the statutory schedule | Parts match BOM / spec. 3. Keep the PSV inlet/outlet isolation car-sealed open in service | Torque / clearance to spec. 4. Record the test certificate and next due date | No leak / smooth operation. 5. Never block-in a live PSV without an authorised spare | Record in equipment history."},{"id":"CHK-222","doc":"DOC-061","asset":"AST-012","page":35,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. High tube dP PDT-5605, low solvent outlet temperature | Hexane fouling / polymer fines deposit on tube bores | Hydrojetted 246 tubes, restored dP and duty, re-gasketed. 2. Hexane weep at channel flange | Spiral-wound channel gasket relaxed / damaged | Renewed channel gasket, re-torqued in cross pattern. 3. Continuous steam at condensate, high steam use | Steam trap element failed open | Replaced steam trap element, verified condensate temperature."},{"id":"CHK-223","doc":"DOC-061","asset":"AST-012","page":35,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The tube-side relief valve is the exchanger's overpressure protection and must be proven and never isolated in service. (2) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-5601 before working on EA-5601. (3) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Friday, 29 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-224","doc":"DOC-062","asset":"AST-016","page":36,"sec":"OPL Header, Purpose & Hazard","text":"OPL-LV-6701-01 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Control Valve Stroke Calibration (DVC6200). Discipline: Instrument. Equipment: LV-6701 - SEPARATOR LEVEL CONTROL VALVE. Area / Unit: 6700 - LP SEPARATOR SYSTEM. Related Interlock: SEQ-6701 (SIL 1). P&ID Ref: TJC-LLD-PID-6701. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains control valve stroke calibration (dvc6200) for LV-6701 (SEPARATOR LEVEL CONTROL VALVE) in the LP SEPARATOR SYSTEM. Correct mapping of the 4-20 mA signal to 0-100 % valve stroke is essential for stable separator level control. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task:"},{"id":"CHK-225","doc":"DOC-062","asset":"AST-016","page":36,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task: (1) De-energise and isolate the loop; place the function to bypass/inhibit under permit. (2) Inform the panel operator before working on any trip, valve or transmitter. (3) Take care with instrument air / hydraulic pressure when disconnecting tubing. (4) Verify intrinsic-safety / Ex integrity is restored before returning to service. (5) Wear correct PPE and follow ESD/override control procedures. 3. TOOLS & MATERIALS REQUIRED: HART communicator / positioner software (e.g. ValveLink); Loop calibrator & decade box / pressure source; Digital multimeter and clamp meter; Span/zero test gas or reference standards; Torque screwdriver and small hand tools; Certified test/inhibit permit."},{"id":"CHK-226","doc":"DOC-062","asset":"AST-016","page":36,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Connect ValveLink to the DVC6200 positioner | Loop isolated / under permit. 2. Run the auto-calibration over the full stroke | Reference standard traceable. 3. Verify 4 mA = closed and 20 mA = 38 mm fully open | As-found & as-left recorded. 4. Check hysteresis and dead-band are within 1 % | Trip / control action verified. 5. Save the calibration and record the as-left data | Return to service confirmed."},{"id":"CHK-227","doc":"DOC-062","asset":"AST-016","page":36,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. LV-6701 not responding to LIC-6701, level control lost | Stem seized in PTFE packing (over-tightened + fines) | Freed stem, renewed packing, lubricated, re-stroked and calibrated. 2. Positioner giving position error after drift | Positioner feedback out of calibration | Recalibrated DVC6200, updated firmware, verified travel. 3. Hexane weeping at LV-6701 stem packing | PTFE V-ring packing worn | Renewed PTFE V-ring packing set, re-torqued gland."},{"id":"CHK-228","doc":"DOC-062","asset":"AST-016","page":36,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Correct mapping of the 4-20 mA signal to 0-100 % valve stroke is essential for stable separator level control. (2) Respect the interlock SEQ-6701: e.g. LSHH-6710 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-6701 before working on LV-6701. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Saturday, 16 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-229","doc":"DOC-063","asset":"AST-016","page":37,"sec":"OPL Header, Purpose & Hazard","text":"OPL-LV-6701-02 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Instrument Air Supply & Filter Regulator. Discipline: Instrument. Equipment: LV-6701 - SEPARATOR LEVEL CONTROL VALVE. Area / Unit: 6700 - LP SEPARATOR SYSTEM. Related Interlock: SEQ-6701 (SIL 1). P&ID Ref: TJC-LLD-PID-6701. Classification: Trouble Case (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains instrument air supply & filter regulator for LV-6701 (SEPARATOR LEVEL CONTROL VALVE) in the LP SEPARATOR SYSTEM. Dirty or low instrument air makes the valve sluggish or fail closed, upsetting FA-6710 level and tripping PSL-6702. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task:"},{"id":"CHK-230","doc":"DOC-063","asset":"AST-016","page":37,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task: (1) De-energise and isolate the loop; place the function to bypass/inhibit under permit. (2) Inform the panel operator before working on any trip, valve or transmitter. (3) Take care with instrument air / hydraulic pressure when disconnecting tubing. (4) Verify intrinsic-safety / Ex integrity is restored before returning to service. (5) Wear correct PPE and follow ESD/override control procedures. 3. TOOLS & MATERIALS REQUIRED: HART communicator / positioner software (e.g. ValveLink); Loop calibrator & decade box / pressure source; Digital multimeter and clamp meter; Span/zero test gas or reference standards; Torque screwdriver and small hand tools; Certified test/inhibit permit."},{"id":"CHK-231","doc":"DOC-063","asset":"AST-016","page":37,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Check the PI-6702 air supply is at 1.4 barg | Loop isolated / under permit. 2. Drain the filter regulator bowl of condensate | Reference standard traceable. 3. Replace a clogged air filter element | As-found & as-left recorded. 4. Confirm there are no air leaks on the tubing/fittings | Trip / control action verified. 5. Verify PSL-6702 low-air alarm set-point | Return to service confirmed."},{"id":"CHK-232","doc":"DOC-063","asset":"AST-016","page":37,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. LV-6701 not responding to LIC-6701, level control lost | Stem seized in PTFE packing (over-tightened + fines) | Freed stem, renewed packing, lubricated, re-stroked and calibrated. 2. Positioner giving position error after drift | Positioner feedback out of calibration | Recalibrated DVC6200, updated firmware, verified travel. 3. Hexane weeping at LV-6701 stem packing | PTFE V-ring packing worn | Renewed PTFE V-ring packing set, re-torqued gland."},{"id":"CHK-233","doc":"DOC-063","asset":"AST-016","page":37,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Dirty or low instrument air makes the valve sluggish or fail closed, upsetting FA-6710 level and tripping PSL-6702. (2) Respect the interlock SEQ-6701: e.g. LSHH-6710 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-6701 before working on LV-6701. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Wednesday, 20 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-234","doc":"DOC-064","asset":"AST-016","page":38,"sec":"OPL Header, Purpose & Hazard","text":"OPL-LV-6701-03 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Packing Adjustment (PTFE V-Ring). Discipline: Mechanical. Equipment: LV-6701 - SEPARATOR LEVEL CONTROL VALVE. Area / Unit: 6700 - LP SEPARATOR SYSTEM. Related Interlock: SEQ-6701 (SIL 1). P&ID Ref: TJC-LLD-PID-6701. Classification: Trouble Case (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains packing adjustment (ptfe v-ring) for LV-6701 (SEPARATOR LEVEL CONTROL VALVE) in the LP SEPARATOR SYSTEM. Loose packing leaks hexane at the stem; over-tight packing makes the stem stick and the valve hunt. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task:"},{"id":"CHK-235","doc":"DOC-064","asset":"AST-016","page":38,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-236","doc":"DOC-064","asset":"AST-016","page":38,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Isolate the line and depressurise before touching packing | Isolation & LOTO verified. 2. Snug the packing nuts evenly in small increments | Parts match BOM / spec. 3. Stroke the valve and check for a leak-free, smooth travel | Torque / clearance to spec. 4. Do not over-torque - excessive friction degrades control | No leak / smooth operation. 5. Record the packing adjustment in the valve history | Record in equipment history."},{"id":"CHK-237","doc":"DOC-064","asset":"AST-016","page":38,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Manual handwheel jack on LV-6701 seized | Corrosion in handwheel thread | Overhauled handwheel assembly, greased thread. 2. LV-6701 passing when closed (Class IV exceeded) | Seat/plug erosion from polymer bottoms | Lapped seat and plug, restored Class IV shut-off. 3. Minor weep at body/bonnet joint | Spiral-wound body gasket relaxed | Renewed body gasket, torqued bonnet bolts."},{"id":"CHK-238","doc":"DOC-064","asset":"AST-016","page":38,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Loose packing leaks hexane at the stem; over-tight packing makes the stem stick and the valve hunt. (2) Respect the interlock SEQ-6701: e.g. LSHH-6710 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-6701 before working on LV-6701. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Sunday, 24 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-239","doc":"DOC-065","asset":"AST-016","page":39,"sec":"OPL Header, Purpose & Hazard","text":"OPL-LV-6701-04 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Positioner Response & Loop Check. Discipline: Instrument. Equipment: LV-6701 - SEPARATOR LEVEL CONTROL VALVE. Area / Unit: 6700 - LP SEPARATOR SYSTEM. Related Interlock: SEQ-6701 (SIL 1). P&ID Ref: TJC-LLD-PID-6701. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains positioner response & loop check for LV-6701 (SEPARATOR LEVEL CONTROL VALVE) in the LP SEPARATOR SYSTEM. Poor positioner tuning makes the level controller LIC-6701 hunt and the separator level cycle. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task:"},{"id":"CHK-240","doc":"DOC-065","asset":"AST-016","page":39,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task: (1) De-energise and isolate the loop; place the function to bypass/inhibit under permit. (2) Inform the panel operator before working on any trip, valve or transmitter. (3) Take care with instrument air / hydraulic pressure when disconnecting tubing. (4) Verify intrinsic-safety / Ex integrity is restored before returning to service. (5) Wear correct PPE and follow ESD/override control procedures. 3. TOOLS & MATERIALS REQUIRED: HART communicator / positioner software (e.g. ValveLink); Loop calibrator & decade box / pressure source; Digital multimeter and clamp meter; Span/zero test gas or reference standards; Torque screwdriver and small hand tools; Certified test/inhibit permit."},{"id":"CHK-241","doc":"DOC-065","asset":"AST-016","page":39,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Step the LIC-6701 output and watch the valve response | Loop isolated / under permit. 2. Check the ZSL/ZSH-6701 limit-switch feedback | Reference standard traceable. 3. Tune the positioner gain for a stable, prompt travel | As-found & as-left recorded. 4. Confirm there is no overshoot or stiction step | Trip / control action verified. 5. Verify the valve seats fully at 4 mA (Class IV) | Return to service confirmed."},{"id":"CHK-242","doc":"DOC-065","asset":"AST-016","page":39,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. LV-6701 not responding to LIC-6701, level control lost | Stem seized in PTFE packing (over-tightened + fines) | Freed stem, renewed packing, lubricated, re-stroked and calibrated. 2. Positioner giving position error after drift | Positioner feedback out of calibration | Recalibrated DVC6200, updated firmware, verified travel. 3. Hexane weeping at LV-6701 stem packing | PTFE V-ring packing worn | Renewed PTFE V-ring packing set, re-torqued gland."},{"id":"CHK-243","doc":"DOC-065","asset":"AST-016","page":39,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Poor positioner tuning makes the level controller LIC-6701 hunt and the separator level cycle. (2) Respect the interlock SEQ-6701: e.g. LSHH-6710 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-6701 before working on LV-6701. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Thursday, 28 May 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-244","doc":"DOC-066","asset":"AST-016","page":40,"sec":"OPL Header, Purpose & Hazard","text":"OPL-LV-6701-05 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Manual Bypass (HV-6701) Operation. Discipline: Process / Operations. Equipment: LV-6701 - SEPARATOR LEVEL CONTROL VALVE. Area / Unit: 6700 - LP SEPARATOR SYSTEM. Related Interlock: SEQ-6701 (SIL 1). P&ID Ref: TJC-LLD-PID-6701. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains manual bypass (hv-6701) operation for LV-6701 (SEPARATOR LEVEL CONTROL VALVE) in the LP SEPARATOR SYSTEM. The manual bypass lets operators keep the separator level safely while LV-6701 is isolated for maintenance. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task:"},{"id":"CHK-245","doc":"DOC-066","asset":"AST-016","page":40,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-246","doc":"DOC-066","asset":"AST-016","page":40,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Notify the panel and take LIC-6701 to manual | Permit valid & briefed. 2. Crack open the bypass HV-6701 slowly | Parameter within limit. 3. Throttle HV-6701 to hold FA-6710 level using LT-6710 | Interlock status confirmed. 4. Isolate LV-6701 (close block valves) for the work | Change logged on DCS. 5. Reverse the steps and re-establish auto control afterwards | Handover to next shift."},{"id":"CHK-247","doc":"DOC-066","asset":"AST-016","page":40,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. LV-6701 isolation for planned maintenance | Planned - bypass used to hold level | Lined up HV-6701 manual bypass, isolated LV-6701 safely. 2. LV-6701 not responding to LIC-6701, level control lost | Stem seized in PTFE packing (over-tightened + fines) | Freed stem, renewed packing, lubricated, re-stroked and calibrated. 3. Manual handwheel jack on LV-6701 seized | Corrosion in handwheel thread | Overhauled handwheel assembly, greased thread."},{"id":"CHK-248","doc":"DOC-066","asset":"AST-016","page":40,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The manual bypass lets operators keep the separator level safely while LV-6701 is isolated for maintenance. (2) Respect the interlock SEQ-6701: e.g. LSHH-6710 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-6701 before working on LV-6701. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Monday, 01 June 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-249","doc":"DOC-067","asset":"AST-016","page":41,"sec":"OPL Header, Purpose & Hazard","text":"OPL-LV-6701-06 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Fail-Closed & ESD Action Verification. Discipline: Instrument. Equipment: LV-6701 - SEPARATOR LEVEL CONTROL VALVE. Area / Unit: 6700 - LP SEPARATOR SYSTEM. Related Interlock: SEQ-6701 (SIL 1). P&ID Ref: TJC-LLD-PID-6701. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains fail-closed & esd action verification for LV-6701 (SEPARATOR LEVEL CONTROL VALVE) in the LP SEPARATOR SYSTEM. On air failure or ESD (XV-6701), the valve must drive closed to prevent gas blow-by from the separator. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task:"},{"id":"CHK-250","doc":"DOC-067","asset":"AST-016","page":41,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task: (1) De-energise and isolate the loop; place the function to bypass/inhibit under permit. (2) Inform the panel operator before working on any trip, valve or transmitter. (3) Take care with instrument air / hydraulic pressure when disconnecting tubing. (4) Verify intrinsic-safety / Ex integrity is restored before returning to service. (5) Wear correct PPE and follow ESD/override control procedures. 3. TOOLS & MATERIALS REQUIRED: HART communicator / positioner software (e.g. ValveLink); Loop calibrator & decade box / pressure source; Digital multimeter and clamp meter; Span/zero test gas or reference standards; Torque screwdriver and small hand tools; Certified test/inhibit permit."},{"id":"CHK-251","doc":"DOC-067","asset":"AST-016","page":41,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Trip the XV-6701 ESD solenoid during the test | Loop isolated / under permit. 2. Confirm the actuator vents and the valve closes | Reference standard traceable. 3. Time the full closure - it must be within 5 seconds | As-found & as-left recorded. 4. Check the ZSL-6701 closed limit confirms on the DCS | Trip / control action verified. 5. Reset the ESD and return the valve to auto | Return to service confirmed."},{"id":"CHK-252","doc":"DOC-067","asset":"AST-016","page":41,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. LV-6701 not responding to LIC-6701, level control lost | Stem seized in PTFE packing (over-tightened + fines) | Freed stem, renewed packing, lubricated, re-stroked and calibrated. 2. Positioner giving position error after drift | Positioner feedback out of calibration | Recalibrated DVC6200, updated firmware, verified travel. 3. Hexane weeping at LV-6701 stem packing | PTFE V-ring packing worn | Renewed PTFE V-ring packing set, re-torqued gland."},{"id":"CHK-253","doc":"DOC-067","asset":"AST-016","page":41,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) On air failure or ESD (XV-6701), the valve must drive closed to prevent gas blow-by from the separator. (2) Respect the interlock SEQ-6701: e.g. LSHH-6710 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-6701 before working on LV-6701. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Friday, 05 June 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-254","doc":"DOC-068","asset":"AST-016","page":42,"sec":"OPL Header, Purpose & Hazard","text":"OPL-LV-6701-07 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Actuator Diaphragm Inspection (Fisher 667). Discipline: Instrument. Equipment: LV-6701 - SEPARATOR LEVEL CONTROL VALVE. Area / Unit: 6700 - LP SEPARATOR SYSTEM. Related Interlock: SEQ-6701 (SIL 1). P&ID Ref: TJC-LLD-PID-6701. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains actuator diaphragm inspection (fisher 667) for LV-6701 (SEPARATOR LEVEL CONTROL VALVE) in the LP SEPARATOR SYSTEM. A ruptured actuator diaphragm causes loss of control and a continuous air leak; periodic inspection prevents surprise failures. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task:"},{"id":"CHK-255","doc":"DOC-068","asset":"AST-016","page":42,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is LOW CRITICAL handling Hexane + polymer bottoms at up to ASME 300# / 120 degC. Observe the following before and during the task: (1) De-energise and isolate the loop; place the function to bypass/inhibit under permit. (2) Inform the panel operator before working on any trip, valve or transmitter. (3) Take care with instrument air / hydraulic pressure when disconnecting tubing. (4) Verify intrinsic-safety / Ex integrity is restored before returning to service. (5) Wear correct PPE and follow ESD/override control procedures. 3. TOOLS & MATERIALS REQUIRED: HART communicator / positioner software (e.g. ValveLink); Loop calibrator & decade box / pressure source; Digital multimeter and clamp meter; Span/zero test gas or reference standards; Torque screwdriver and small hand tools; Certified test/inhibit permit."},{"id":"CHK-256","doc":"DOC-068","asset":"AST-016","page":42,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Inspect the Fisher 667 diaphragm for cracks or perishing | Loop isolated / under permit. 2. Check the bench set is 0.2-1.0 barg | Reference standard traceable. 3. Replace the NBR/fabric diaphragm if hardened | As-found & as-left recorded. 4. Re-stroke and recalibrate after any diaphragm work | Trip / control action verified. 5. Confirm the spring range still gives full 38 mm travel | Return to service confirmed."},{"id":"CHK-257","doc":"DOC-068","asset":"AST-016","page":42,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. LV-6701 not responding to LIC-6701, level control lost | Stem seized in PTFE packing (over-tightened + fines) | Freed stem, renewed packing, lubricated, re-stroked and calibrated. 2. Positioner giving position error after drift | Positioner feedback out of calibration | Recalibrated DVC6200, updated firmware, verified travel. 3. Hexane weeping at LV-6701 stem packing | PTFE V-ring packing worn | Renewed PTFE V-ring packing set, re-torqued gland."},{"id":"CHK-258","doc":"DOC-068","asset":"AST-016","page":42,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) A ruptured actuator diaphragm causes loss of control and a continuous air leak; periodic inspection prevents surprise failures. (2) Respect the interlock SEQ-6701: e.g. LSHH-6710 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-6701 before working on LV-6701. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Vino Ardiansyah (EMP-1102); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Tuesday, 09 June 2026. Footer note: Cross-ref tag GA-1201A across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-259","doc":"DOC-069","asset":"AST-018","page":43,"sec":"OPL Header, Purpose & Hazard","text":"OPL-CT-7801-01 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Barscreen Cleaning (Suction Screen). Discipline: Process / Operations. Equipment: CT-7801 - COOLING TOWER CELL FAN. Area / Unit: 7800 - COOLING TOWER SYSTEM. Related Interlock: SEQ-7801 (SIL 1). P&ID Ref: TJC-LLD-PID-7801. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains barscreen cleaning (suction screen) for CT-7801 (COOLING TOWER CELL FAN) in the COOLING TOWER SYSTEM. A clogged barscreen starves the circulating water pumps and fouls the fill, reducing cooling for the whole unit. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task:"},{"id":"CHK-260","doc":"DOC-069","asset":"AST-018","page":43,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-261","doc":"DOC-069","asset":"AST-018","page":43,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Rake the SS304 barscreen every shift on the round | Permit valid & briefed. 2. Remove leaves, debris and biological growth | Parameter within limit. 3. Check the differential level across the screen | Interlock status confirmed. 4. Dispose of debris correctly and log the cleaning | Change logged on DCS. 5. Report rapid re-fouling to water treatment | Handover to next shift."},{"id":"CHK-262","doc":"DOC-069","asset":"AST-018","page":43,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Routine barscreen cleaning on operator round | Normal debris accumulation | Raked barscreen clear, checked differential level. 2. Scheduled fan gearbox oil change | Routine - oil sample acceptable | Drained and refilled ISO VG 220, replaced breather. 3. VSHH-7802 vibration alarm on CT-7801 fan | Leading-edge erosion on one FRP blade caused imbalance | Inspected blades, re-balanced fan, vibration normalised."},{"id":"CHK-263","doc":"DOC-069","asset":"AST-018","page":43,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) A clogged barscreen starves the circulating water pumps and fouls the fill, reducing cooling for the whole unit. (2) Respect the interlock SEQ-7801: e.g. VSHH-7802 trips at > 9 mm/s - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-7801 before working on CT-7801. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Wednesday, 27 May 2026. Footer note: Cross-ref tag CT-7801 across Datasheet, GA, P&ID, Interlock and Maintenance History"},{"id":"CHK-264","doc":"DOC-070","asset":"AST-018","page":44,"sec":"OPL Header, Purpose & Hazard","text":"OPL-CT-7801-02 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Gearbox Oil Level & Change (ISO VG 220). Discipline: Mechanical. Equipment: CT-7801 - COOLING TOWER CELL FAN. Area / Unit: 7800 - COOLING TOWER SYSTEM. Related Interlock: SEQ-7801 (SIL 1). P&ID Ref: TJC-LLD-PID-7801. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains gearbox oil level & change (iso vg 220) for CT-7801 (COOLING TOWER CELL FAN) in the COOLING TOWER SYSTEM. Low or degraded gearbox oil causes overheating (TSHH-7803) and gear failure high up on the fan deck. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task:"},{"id":"CHK-265","doc":"DOC-070","asset":"AST-018","page":44,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-266","doc":"DOC-070","asset":"AST-018","page":44,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Check the gearbox sight-glass oil level | Isolation & LOTO verified. 2. Sample the oil for water contamination and metal | Parts match BOM / spec. 3. Change the ISO VG 220 (4.5 L) per the schedule | Torque / clearance to spec. 4. Verify the oil pressure PSL-7807 after refill | No leak / smooth operation. 5. Record the oil change and next due date | Record in equipment history."},{"id":"CHK-267","doc":"DOC-070","asset":"AST-018","page":44,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Scheduled fan gearbox oil change | Routine - oil sample acceptable | Drained and refilled ISO VG 220, replaced breather. 2. VSHH-7802 vibration alarm on CT-7801 fan | Leading-edge erosion on one FRP blade caused imbalance | Inspected blades, re-balanced fan, vibration normalised. 3. TSHH-7803 gearbox oil temperature rising | Degraded oil and fouled oil cooler | Changed oil, cleaned oil cooler, verified temperature."},{"id":"CHK-268","doc":"DOC-070","asset":"AST-018","page":44,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Low or degraded gearbox oil causes overheating (TSHH-7803) and gear failure high up on the fan deck. (2) Respect the interlock SEQ-7801: e.g. VSHH-7802 trips at > 9 mm/s - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-7801 before working on CT-7801. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Sunday, 31 May 2026. Footer note: Cross-ref tag CT-7801 across Datasheet, GA, P&ID, Interlock and Maintenance History"},{"id":"CHK-269","doc":"DOC-071","asset":"AST-018","page":45,"sec":"OPL Header, Purpose & Hazard","text":"OPL-CT-7801-03 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Fan Blade Inspection & Balance (FRP). Discipline: Mechanical. Equipment: CT-7801 - COOLING TOWER CELL FAN. Area / Unit: 7800 - COOLING TOWER SYSTEM. Related Interlock: SEQ-7801 (SIL 1). P&ID Ref: TJC-LLD-PID-7801. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains fan blade inspection & balance (frp) for CT-7801 (COOLING TOWER CELL FAN) in the COOLING TOWER SYSTEM. A cracked or eroded FRP blade unbalances the fan and causes the VSHH-7802 vibration trip. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task:"},{"id":"CHK-270","doc":"DOC-071","asset":"AST-018","page":45,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-271","doc":"DOC-071","asset":"AST-018","page":45,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Lock out the fan and inspect all 6 FRP blades | Isolation & LOTO verified. 2. Check for cracks, leading-edge erosion and tip clearance | Parts match BOM / spec. 3. Verify the blade pitch angle is uniform on all blades | Torque / clearance to spec. 4. Re-balance the fan if vibration is high | No leak / smooth operation. 5. Torque the blade root bolts to specification | Record in equipment history."},{"id":"CHK-272","doc":"DOC-071","asset":"AST-018","page":45,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Scheduled fan gearbox oil change | Routine - oil sample acceptable | Drained and refilled ISO VG 220, replaced breather. 2. VSHH-7802 vibration alarm on CT-7801 fan | Leading-edge erosion on one FRP blade caused imbalance | Inspected blades, re-balanced fan, vibration normalised. 3. TSHH-7803 gearbox oil temperature rising | Degraded oil and fouled oil cooler | Changed oil, cleaned oil cooler, verified temperature."},{"id":"CHK-273","doc":"DOC-071","asset":"AST-018","page":45,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) A cracked or eroded FRP blade unbalances the fan and causes the VSHH-7802 vibration trip. (2) Respect the interlock SEQ-7801: e.g. VSHH-7802 trips at > 9 mm/s - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-7801 before working on CT-7801. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Thursday, 04 June 2026. Footer note: Cross-ref tag CT-7801 across Datasheet, GA, P&ID, Interlock and Maintenance History"},{"id":"CHK-274","doc":"DOC-072","asset":"AST-018","page":46,"sec":"OPL Header, Purpose & Hazard","text":"OPL-CT-7801-04 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Circulating Water pH Control (AI-7805). Discipline: Process / Operations. Equipment: CT-7801 - COOLING TOWER CELL FAN. Area / Unit: 7800 - COOLING TOWER SYSTEM. Related Interlock: SEQ-7801 (SIL 1). P&ID Ref: TJC-LLD-PID-7801. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains circulating water ph control (ai-7805) for CT-7801 (COOLING TOWER CELL FAN) in the COOLING TOWER SYSTEM. Wrong pH causes scaling or corrosion across the entire cooling water loop, not just this cell. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task:"},{"id":"CHK-275","doc":"DOC-072","asset":"AST-018","page":46,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-276","doc":"DOC-072","asset":"AST-018","page":46,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Read the AI-7805 pH each shift (target 7.0-8.5) | Permit valid & briefed. 2. Check the acid / caustic dosing pumps are running | Parameter within limit. 3. Cross-check against a manual lab titration | Interlock status confirmed. 4. Adjust the dosing set-point as needed | Change logged on DCS. 5. Report large pH swings to water treatment | Handover to next shift."},{"id":"CHK-277","doc":"DOC-072","asset":"AST-018","page":46,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Routine barscreen cleaning on operator round | Normal debris accumulation | Raked barscreen clear, checked differential level. 2. Scheduled fan gearbox oil change | Routine - oil sample acceptable | Drained and refilled ISO VG 220, replaced breather. 3. VSHH-7802 vibration alarm on CT-7801 fan | Leading-edge erosion on one FRP blade caused imbalance | Inspected blades, re-balanced fan, vibration normalised."},{"id":"CHK-278","doc":"DOC-072","asset":"AST-018","page":46,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Wrong pH causes scaling or corrosion across the entire cooling water loop, not just this cell. (2) Respect the interlock SEQ-7801: e.g. VSHH-7802 trips at > 9 mm/s - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-7801 before working on CT-7801. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Monday, 08 June 2026. Footer note: Cross-ref tag CT-7801 across Datasheet, GA, P&ID, Interlock and Maintenance History"},{"id":"CHK-279","doc":"DOC-073","asset":"AST-018","page":47,"sec":"OPL Header, Purpose & Hazard","text":"OPL-CT-7801-05 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Drift Eliminator & Fill Inspection. Discipline: Mechanical. Equipment: CT-7801 - COOLING TOWER CELL FAN. Area / Unit: 7800 - COOLING TOWER SYSTEM. Related Interlock: SEQ-7801 (SIL 1). P&ID Ref: TJC-LLD-PID-7801. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains drift eliminator & fill inspection for CT-7801 (COOLING TOWER CELL FAN) in the COOLING TOWER SYSTEM. Fouled or collapsed fill and drift eliminators cut the cooling performance and raise the basin temperature. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task:"},{"id":"CHK-280","doc":"DOC-073","asset":"AST-018","page":47,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-281","doc":"DOC-073","asset":"AST-018","page":47,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Inspect the PVC fill for scaling and collapse | Isolation & LOTO verified. 2. Check the drift eliminator packs are aligned | Parts match BOM / spec. 3. Hose down fouled sections during a cell outage | Torque / clearance to spec. 4. Report a thermal performance drop via TT-7801 | No leak / smooth operation. 5. Plan fill replacement if degradation is widespread | Record in equipment history."},{"id":"CHK-282","doc":"DOC-073","asset":"AST-018","page":47,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Scheduled fan gearbox oil change | Routine - oil sample acceptable | Drained and refilled ISO VG 220, replaced breather. 2. VSHH-7802 vibration alarm on CT-7801 fan | Leading-edge erosion on one FRP blade caused imbalance | Inspected blades, re-balanced fan, vibration normalised. 3. TSHH-7803 gearbox oil temperature rising | Degraded oil and fouled oil cooler | Changed oil, cleaned oil cooler, verified temperature."},{"id":"CHK-283","doc":"DOC-073","asset":"AST-018","page":47,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Fouled or collapsed fill and drift eliminators cut the cooling performance and raise the basin temperature. (2) Respect the interlock SEQ-7801: e.g. VSHH-7802 trips at > 9 mm/s - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-7801 before working on CT-7801. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Friday, 12 June 2026. Footer note: Cross-ref tag CT-7801 across Datasheet, GA, P&ID, Interlock and Maintenance History"},{"id":"CHK-284","doc":"DOC-074","asset":"AST-018","page":48,"sec":"OPL Header, Purpose & Hazard","text":"OPL-CT-7801-06 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Gearbox Vibration Monitoring (VSHH-7802). Discipline: Instrument. Equipment: CT-7801 - COOLING TOWER CELL FAN. Area / Unit: 7800 - COOLING TOWER SYSTEM. Related Interlock: SEQ-7801 (SIL 1). P&ID Ref: TJC-LLD-PID-7801. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains gearbox vibration monitoring (vshh-7802) for CT-7801 (COOLING TOWER CELL FAN) in the COOLING TOWER SYSTEM. A rising vibration trend warns of gear or bearing wear before the fan trips or throws a blade. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task:"},{"id":"CHK-285","doc":"DOC-074","asset":"AST-018","page":48,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task: (1) De-energise and isolate the loop; place the function to bypass/inhibit under permit. (2) Inform the panel operator before working on any trip, valve or transmitter. (3) Take care with instrument air / hydraulic pressure when disconnecting tubing. (4) Verify intrinsic-safety / Ex integrity is restored before returning to service. (5) Wear correct PPE and follow ESD/override control procedures. 3. TOOLS & MATERIALS REQUIRED: HART communicator / positioner software (e.g. ValveLink); Loop calibrator & decade box / pressure source; Digital multimeter and clamp meter; Span/zero test gas or reference standards; Torque screwdriver and small hand tools; Certified test/inhibit permit."},{"id":"CHK-286","doc":"DOC-074","asset":"AST-018","page":48,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Trend the VS-7802 reading on the PdM route | Loop isolated / under permit. 2. Alarm at 6 mm/s and trip at 9 mm/s (VSHH-7802) | Reference standard traceable. 3. Correlate the rise with gearbox oil temperature TE-7803 | As-found & as-left recorded. 4. Inspect the floating drive-shaft couplings | Trip / control action verified. 5. Escalate a step-change to reliability | Return to service confirmed."},{"id":"CHK-287","doc":"DOC-074","asset":"AST-018","page":48,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Scheduled pH analyzer calibration | Electrode drift | Recalibrated AI-7805 on buffer solutions, replaced electrode. 2. Blowdown conductivity reading unreliable | Conductivity cell fouled with scale | Cleaned and recalibrated AI-7806 conductivity cell. 3. Routine barscreen cleaning on operator round | Normal debris accumulation | Raked barscreen clear, checked differential level."},{"id":"CHK-288","doc":"DOC-074","asset":"AST-018","page":48,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) A rising vibration trend warns of gear or bearing wear before the fan trips or throws a blade. (2) Respect the interlock SEQ-7801: e.g. VSHH-7802 trips at > 9 mm/s - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-7801 before working on CT-7801. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Tuesday, 16 June 2026. Footer note: Cross-ref tag CT-7801 across Datasheet, GA, P&ID, Interlock and Maintenance History"},{"id":"CHK-289","doc":"DOC-075","asset":"AST-018","page":49,"sec":"OPL Header, Purpose & Hazard","text":"OPL-CT-7801-07 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Conductivity / Blowdown Control (AI-7806). Discipline: Process / Operations. Equipment: CT-7801 - COOLING TOWER CELL FAN. Area / Unit: 7800 - COOLING TOWER SYSTEM. Related Interlock: SEQ-7801 (SIL 1). P&ID Ref: TJC-LLD-PID-7801. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains conductivity / blowdown control (ai-7806) for CT-7801 (COOLING TOWER CELL FAN) in the COOLING TOWER SYSTEM. High conductivity means the water is over-concentrated; automatic blowdown keeps the cycles of concentration in range. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task:"},{"id":"CHK-290","doc":"DOC-075","asset":"AST-018","page":49,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is NON CRITICAL handling Circulating water / air at up to atm / 50 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-291","doc":"DOC-075","asset":"AST-018","page":49,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Read the AI-7806 conductivity value | Permit valid & briefed. 2. Verify the automatic blowdown valve XV-7806 operates | Parameter within limit. 3. Maintain the target cycles of concentration | Interlock status confirmed. 4. Log make-up versus blowdown volumes | Change logged on DCS. 5. Coordinate chemical dosing with water treatment | Handover to next shift."},{"id":"CHK-292","doc":"DOC-075","asset":"AST-018","page":49,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Routine barscreen cleaning on operator round | Normal debris accumulation | Raked barscreen clear, checked differential level. 2. Scheduled fan gearbox oil change | Routine - oil sample acceptable | Drained and refilled ISO VG 220, replaced breather. 3. VSHH-7802 vibration alarm on CT-7801 fan | Leading-edge erosion on one FRP blade caused imbalance | Inspected blades, re-balanced fan, vibration normalised."},{"id":"CHK-293","doc":"DOC-075","asset":"AST-018","page":49,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) High conductivity means the water is over-concentrated; automatic blowdown keeps the cycles of concentration in range. (2) Respect the interlock SEQ-7801: e.g. VSHH-7802 trips at > 9 mm/s - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-7801 before working on CT-7801. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Wahyu Setiadi (EMP-1113); Approved by (Manager) Arya Wibisono (EMP-0912); Date of Sharing Saturday, 20 June 2026. Footer note: Cross-ref tag CT-7801 across Datasheet, GA, P&ID, Interlock and Maintenance History"},{"id":"CHK-294","doc":"DOC-076","asset":"AST-021","page":50,"sec":"OPL Header, Purpose & Hazard","text":"OPL-FA-8901-01 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Level Gauge / Bridle Verification (LT-8901). Discipline: Instrument. Equipment: FA-8901 - REFLUX ACCUMULATOR DRUM. Area / Unit: 8900 - HEXANE COLUMN OVERHEAD SYSTEM. Related Interlock: SEQ-8901 (SIL 1). P&ID Ref: TJC-LLD-PID-8901. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains level gauge / bridle verification (lt-8901) for FA-8901 (REFLUX ACCUMULATOR DRUM) in the HEXANE COLUMN OVERHEAD SYSTEM. A false level reading causes reflux pump cavitation (low) or column flooding (high); the transmitter must agree with the gauge. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task:"},{"id":"CHK-295","doc":"DOC-076","asset":"AST-021","page":50,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task: (1) De-energise and isolate the loop; place the function to bypass/inhibit under permit. (2) Inform the panel operator before working on any trip, valve or transmitter. (3) Take care with instrument air / hydraulic pressure when disconnecting tubing. (4) Verify intrinsic-safety / Ex integrity is restored before returning to service. (5) Wear correct PPE and follow ESD/override control procedures. 3. TOOLS & MATERIALS REQUIRED: HART communicator / positioner software (e.g. ValveLink); Loop calibrator & decade box / pressure source; Digital multimeter and clamp meter; Span/zero test gas or reference standards; Torque screwdriver and small hand tools; Certified test/inhibit permit."},{"id":"CHK-296","doc":"DOC-076","asset":"AST-021","page":50,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Cross-check LT-8901 against the level bridle gauge | Loop isolated / under permit. 2. Blow down the bridle to clear any plugging | Reference standard traceable. 3. Confirm the LSHH-8901 and LSLL-8901 switch actions | As-found & as-left recorded. 4. Verify the level tracks correctly through a level change | Trip / control action verified. 5. Log any deviation and recalibrate if needed | Return to service confirmed."},{"id":"CHK-297","doc":"DOC-076","asset":"AST-021","page":50,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Reflux drum level transmitter drifting vs gauge | Transmitter zero drift | Recalibrated LT-8901 against the bridle gauge. 2. Blanket / vent split-range valve hunting | Split-range calibration overlap incorrect | Re-tuned PCV-8905 split-range, verified PT-8902 hold. 3. Proof test of drum high-high level trip | Within tolerance | Recalibrated LSHH-8901 and verified EFF-1 column feed trip."},{"id":"CHK-298","doc":"DOC-076","asset":"AST-021","page":50,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) A false level reading causes reflux pump cavitation (low) or column flooding (high); the transmitter must agree with the gauge. (2) Respect the interlock SEQ-8901: e.g. LSHH-8901 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-8901 before working on FA-8901. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Sunday, 07 June 2026. Footer note: Cross-ref tag FA-8901 across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-299","doc":"DOC-077","asset":"AST-021","page":51,"sec":"OPL Header, Purpose & Hazard","text":"OPL-FA-8901-02 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: PSV-8901 Testing & Car-Seal Management. Discipline: Mechanical. Equipment: FA-8901 - REFLUX ACCUMULATOR DRUM. Area / Unit: 8900 - HEXANE COLUMN OVERHEAD SYSTEM. Related Interlock: SEQ-8901 (SIL 1). P&ID Ref: TJC-LLD-PID-8901. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains psv-8901 testing & car-seal management for FA-8901 (REFLUX ACCUMULATOR DRUM) in the HEXANE COLUMN OVERHEAD SYSTEM. The relief valve is the drum's last line of overpressure defence and must be proven and never isolated in service. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task:"},{"id":"CHK-300","doc":"DOC-077","asset":"AST-021","page":51,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-301","doc":"DOC-077","asset":"AST-021","page":51,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Confirm PSV-8901 is set to 10 barg | Isolation & LOTO verified. 2. Carry out the off-line pop test per the statutory schedule | Parts match BOM / spec. 3. Keep the PSV isolation car-sealed open in service | Torque / clearance to spec. 4. Tag and file the test certificate | No leak / smooth operation. 5. Never block-in a live PSV without an authorised spare | Record in equipment history."},{"id":"CHK-302","doc":"DOC-077","asset":"AST-021","page":51,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Statutory relief valve test | Set pressure drift found | Overhauled PSV-8901, lapped seat, re-set 10 barg, certified. 2. Boot drain valve N4 passing / leaking | Seat eroded by water/solids | Reseated / replaced boot drain valve HV-8904. 3. Scheduled corrosion monitoring of boot | Wall thickness within corrosion allowance | UT survey of boot and shell bottom, logged in RBI file."},{"id":"CHK-303","doc":"DOC-077","asset":"AST-021","page":51,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The relief valve is the drum's last line of overpressure defence and must be proven and never isolated in service. (2) Respect the interlock SEQ-8901: e.g. LSHH-8901 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-8901 before working on FA-8901. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Thursday, 11 June 2026. Footer note: Cross-ref tag FA-8901 across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-304","doc":"DOC-078","asset":"AST-021","page":52,"sec":"OPL Header, Purpose & Hazard","text":"OPL-FA-8901-03 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Water Boot Draining (LT-8903). Discipline: Process / Operations. Equipment: FA-8901 - REFLUX ACCUMULATOR DRUM. Area / Unit: 8900 - HEXANE COLUMN OVERHEAD SYSTEM. Related Interlock: SEQ-8901 (SIL 1). P&ID Ref: TJC-LLD-PID-8901. Classification: Trouble Case (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains water boot draining (lt-8903) for FA-8901 (REFLUX ACCUMULATOR DRUM) in the HEXANE COLUMN OVERHEAD SYSTEM. Water accumulating in the boot upsets reflux quality and can slug the reflux pump; regular draining keeps the interface controlled. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task:"},{"id":"CHK-305","doc":"DOC-078","asset":"AST-021","page":52,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-306","doc":"DOC-078","asset":"AST-021","page":52,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Monitor the boot interface level LT-8903 | Permit valid & briefed. 2. Drain the boot N4 to the oily-water sewer via HV-8904 | Parameter within limit. 3. Stop draining before hydrocarbon breaks through (watch interface) | Interlock status confirmed. 4. Log the drain volume each shift | Change logged on DCS. 5. Report a rising water make to process | Handover to next shift."},{"id":"CHK-307","doc":"DOC-078","asset":"AST-021","page":52,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Reflux drum level transmitter drifting vs gauge | Transmitter zero drift | Recalibrated LT-8901 against the bridle gauge. 2. Statutory relief valve test | Set pressure drift found | Overhauled PSV-8901, lapped seat, re-set 10 barg, certified. 3. Boot drain valve N4 passing / leaking | Seat eroded by water/solids | Reseated / replaced boot drain valve HV-8904."},{"id":"CHK-308","doc":"DOC-078","asset":"AST-021","page":52,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Water accumulating in the boot upsets reflux quality and can slug the reflux pump; regular draining keeps the interface controlled. (2) Respect the interlock SEQ-8901: e.g. LSHH-8901 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-8901 before working on FA-8901. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Monday, 15 June 2026. Footer note: Cross-ref tag FA-8901 across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-309","doc":"DOC-079","asset":"AST-021","page":53,"sec":"OPL Header, Purpose & Hazard","text":"OPL-FA-8901-04 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Nitrogen Blanketing (PCV-8905). Discipline: Process / Operations. Equipment: FA-8901 - REFLUX ACCUMULATOR DRUM. Area / Unit: 8900 - HEXANE COLUMN OVERHEAD SYSTEM. Related Interlock: SEQ-8901 (SIL 1). P&ID Ref: TJC-LLD-PID-8901. Classification: Basic Knowledge (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains nitrogen blanketing (pcv-8905) for FA-8901 (REFLUX ACCUMULATOR DRUM) in the HEXANE COLUMN OVERHEAD SYSTEM. The nitrogen blanket keeps air out of the hexane drum and holds a stable pressure; loss of blanket risks an explosive atmosphere. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task:"},{"id":"CHK-310","doc":"DOC-079","asset":"AST-021","page":53,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task: (1) Obtain the correct operating permit and brief the shift team before the task. (2) Confirm hazardous fluids are isolated / inerted as required by procedure. (3) Beware of flammable, hot, or high-pressure fluids; wear the correct PPE. (4) Never defeat a safety interlock or trip without an authorised override permit. (5) Have emergency actions and communications ready before starting. 3. TOOLS & MATERIALS REQUIRED: Operating procedure & P&ID; Radio / communication with panel; Gas detector (O2 / LEL) as required; Correct PPE for the fluid handled; Sample containers & PPE for sampling; Permit-to-work documentation."},{"id":"CHK-311","doc":"DOC-079","asset":"AST-021","page":53,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Verify the PCV-8905 split-range holds PT-8902 pressure | Permit valid & briefed. 2. Confirm the blanket makes up on falling pressure | Parameter within limit. 3. Confirm the vent relieves on rising pressure | Interlock status confirmed. 4. Respond immediately to a blanket-loss alarm | Change logged on DCS. 5. Check the N2 supply header pressure is adequate | Handover to next shift."},{"id":"CHK-312","doc":"DOC-079","asset":"AST-021","page":53,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Reflux drum level transmitter drifting vs gauge | Transmitter zero drift | Recalibrated LT-8901 against the bridle gauge. 2. Statutory relief valve test | Set pressure drift found | Overhauled PSV-8901, lapped seat, re-set 10 barg, certified. 3. Boot drain valve N4 passing / leaking | Seat eroded by water/solids | Reseated / replaced boot drain valve HV-8904."},{"id":"CHK-313","doc":"DOC-079","asset":"AST-021","page":53,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The nitrogen blanket keeps air out of the hexane drum and holds a stable pressure; loss of blanket risks an explosive atmosphere. (2) Respect the interlock SEQ-8901: e.g. LSHH-8901 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-8901 before working on FA-8901. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Friday, 19 June 2026. Footer note: Cross-ref tag FA-8901 across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-314","doc":"DOC-080","asset":"AST-021","page":54,"sec":"OPL Header, Purpose & Hazard","text":"OPL-FA-8901-05 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Reflux Pump Low-Level Protection (LSLL-8901). Discipline: Instrument. Equipment: FA-8901 - REFLUX ACCUMULATOR DRUM. Area / Unit: 8900 - HEXANE COLUMN OVERHEAD SYSTEM. Related Interlock: SEQ-8901 (SIL 1). P&ID Ref: TJC-LLD-PID-8901. Classification: Trouble Case (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains reflux pump low-level protection (lsll-8901) for FA-8901 (REFLUX ACCUMULATOR DRUM) in the HEXANE COLUMN OVERHEAD SYSTEM. A low drum level cavitates and damages the GA-8920 reflux pump; the LSLL trip must be proven and never casually bypassed. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task:"},{"id":"CHK-315","doc":"DOC-080","asset":"AST-021","page":54,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task: (1) De-energise and isolate the loop; place the function to bypass/inhibit under permit. (2) Inform the panel operator before working on any trip, valve or transmitter. (3) Take care with instrument air / hydraulic pressure when disconnecting tubing. (4) Verify intrinsic-safety / Ex integrity is restored before returning to service. (5) Wear correct PPE and follow ESD/override control procedures. 3. TOOLS & MATERIALS REQUIRED: HART communicator / positioner software (e.g. ValveLink); Loop calibrator & decade box / pressure source; Digital multimeter and clamp meter; Span/zero test gas or reference standards; Torque screwdriver and small hand tools; Certified test/inhibit permit."},{"id":"CHK-316","doc":"DOC-080","asset":"AST-021","page":54,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Confirm the LSLL-8901 trip stops GA-8920 | Loop isolated / under permit. 2. Test the trip during commissioning and proof tests | Reference standard traceable. 3. Never bypass the trip without an authorised permit | As-found & as-left recorded. 4. Investigate any repeated low-level events | Trip / control action verified. 5. Verify the pump restarts only after level recovers | Return to service confirmed."},{"id":"CHK-317","doc":"DOC-080","asset":"AST-021","page":54,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Reflux drum level transmitter drifting vs gauge | Transmitter zero drift | Recalibrated LT-8901 against the bridle gauge. 2. Blanket / vent split-range valve hunting | Split-range calibration overlap incorrect | Re-tuned PCV-8905 split-range, verified PT-8902 hold. 3. Proof test of drum high-high level trip | Within tolerance | Recalibrated LSHH-8901 and verified EFF-1 column feed trip."},{"id":"CHK-318","doc":"DOC-080","asset":"AST-021","page":54,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) A low drum level cavitates and damages the GA-8920 reflux pump; the LSLL trip must be proven and never casually bypassed. (2) Respect the interlock SEQ-8901: e.g. LSHH-8901 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-8901 before working on FA-8901. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Tuesday, 23 June 2026. Footer note: Cross-ref tag FA-8901 across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-319","doc":"DOC-081","asset":"AST-021","page":55,"sec":"OPL Header, Purpose & Hazard","text":"OPL-FA-8901-06 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Corrosion / Thickness Inspection. Discipline: Mechanical. Equipment: FA-8901 - REFLUX ACCUMULATOR DRUM. Area / Unit: 8900 - HEXANE COLUMN OVERHEAD SYSTEM. Related Interlock: SEQ-8901 (SIL 1). P&ID Ref: TJC-LLD-PID-8901. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains corrosion / thickness inspection for FA-8901 (REFLUX ACCUMULATOR DRUM) in the HEXANE COLUMN OVERHEAD SYSTEM. The boot and shell bottom see the water phase and are corrosion-prone; periodic thickness checks catch wall loss early. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task:"},{"id":"CHK-320","doc":"DOC-081","asset":"AST-021","page":55,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrate
