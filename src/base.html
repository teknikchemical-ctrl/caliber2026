d torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-321","doc":"DOC-081","asset":"AST-021","page":55,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Take UT thickness readings on the shell bottom and boot | Isolation & LOTO verified. 2. Compare readings to the 3.0 mm corrosion allowance | Parts match BOM / spec. 3. Inspect the mist pad and vortex breaker at turnaround | Torque / clearance to spec. 4. Record the readings in the RBI / inspection file | No leak / smooth operation. 5. Flag any accelerated wall loss to inspection engineering | Record in equipment history."},{"id":"CHK-322","doc":"DOC-081","asset":"AST-021","page":55,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Statutory relief valve test | Set pressure drift found | Overhauled PSV-8901, lapped seat, re-set 10 barg, certified. 2. Boot drain valve N4 passing / leaking | Seat eroded by water/solids | Reseated / replaced boot drain valve HV-8904. 3. Scheduled corrosion monitoring of boot | Wall thickness within corrosion allowance | UT survey of boot and shell bottom, logged in RBI file."},{"id":"CHK-323","doc":"DOC-081","asset":"AST-021","page":55,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) The boot and shell bottom see the water phase and are corrosion-prone; periodic thickness checks catch wall loss early. (2) Respect the interlock SEQ-8901: e.g. LSHH-8901 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-8901 before working on FA-8901. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supervisor) Yudha Permana (EMP-1124); Approved by (Manager) Zulkarnain Hasan (EMP-0901); Date of Sharing Saturday, 27 June 2026. Footer note: Cross-ref tag FA-8901 across Datasheet, GA, P&ID, Interlock and Maintenance History."},{"id":"CHK-324","doc":"DOC-082","asset":"AST-021","page":56,"sec":"OPL Header, Purpose & Hazard","text":"OPL-FA-8901-07 - ONE POINT LESSON (OPL), Sheet 1 of 1. Title: Manway Box-Up After Internal Inspection. Discipline: Mechanical. Equipment: FA-8901 - REFLUX ACCUMULATOR DRUM. Area / Unit: 8900 - HEXANE COLUMN OVERHEAD SYSTEM. Related Interlock: SEQ-8901 (SIL 1). P&ID Ref: TJC-LLD-PID-8901. Classification: Improvement (Aspect: P-Q-C-D-S-M-E). 1. PURPOSE / OBJECTIVE: This One Point Lesson explains manway box-up after internal inspection for FA-8901 (REFLUX ACCUMULATOR DRUM) in the HEXANE COLUMN OVERHEAD SYSTEM. Correct gasket selection and bolt torque after inspection prevent a hexane leak from the manway. The lesson gives operators and technicians the key knowledge and the correct step-by-step method so the task is done safely, correctly and consistently every time. Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task:"},{"id":"CHK-325","doc":"DOC-082","asset":"AST-021","page":56,"sec":"Safety Precautions, Tools & Materials","text":"2. SAFETY PRECAUTIONS: Hazard note: this equipment is HIGH CRITICAL handling Hexane / water at up to 10 barg / FV / 120 degC. Observe the following before and during the task: (1) Apply LOTO (Lock-Out Tag-Out) and prove zero energy before starting work. (2) Isolate, depressurise, drain and purge the equipment; obtain a valid work permit. (3) Wear the correct PPE: coverall, safety shoes, gloves, goggles and hearing protection. (4) Beware of stored mechanical energy (springs, rotating inertia) and pinch points. (5) Use certified lifting gear and correct manual-handling technique for heavy parts. 3. TOOLS & MATERIALS REQUIRED: Standard mechanical hand tools & calibrated torque wrench; LOTO padlocks and permit; Laser/dial alignment kit (as applicable); Feeler gauges, dial indicator, seal/bearing pullers; Correct spare parts and gaskets per the BOM; Lifting gear and slings (certified)."},{"id":"CHK-326","doc":"DOC-082","asset":"AST-021","page":56,"sec":"Procedure Steps","text":"4. DETAILED PROCEDURE / STEPS (Step | Action | Check / Acceptance): 1. Fit a new SW SS316/graphite manway gasket | Isolation & LOTO verified. 2. Torque the manway bolts in a star pattern in passes | Parts match BOM / spec. 3. Leak test with the nitrogen blanket | Torque / clearance to spec. 4. Re-instate the PSV and all instruments | No leak / smooth operation. 5. Confirm the drum is ready before re-introducing hydrocarbon | Record in equipment history."},{"id":"CHK-327","doc":"DOC-082","asset":"AST-021","page":56,"sec":"Common Problems & Troubleshooting","text":"5. COMMON PROBLEMS & TROUBLESHOOTING (Symptom | Likely Cause | Action): 1. Statutory relief valve test | Set pressure drift found | Overhauled PSV-8901, lapped seat, re-set 10 barg, certified. 2. Boot drain valve N4 passing / leaking | Seat eroded by water/solids | Reseated / replaced boot drain valve HV-8904. 3. Scheduled corrosion monitoring of boot | Wall thickness within corrosion allowance | UT survey of boot and shell bottom, logged in RBI file."},{"id":"CHK-328","doc":"DOC-082","asset":"AST-021","page":56,"sec":"Key Learning Points & Sign-off","text":"6. KEY LEARNING POINTS: (1) Correct gasket selection and bolt torque after inspection prevent a hexane leak from the manway. (2) Respect the interlock SEQ-8901: e.g. LSHH-8901 trips at > 85 % - never defeat it without a permit. (3) Always cross-check the Datasheet limits and the P&ID TJC-LLD-PID-8901 before working on FA-8901. (4) Record the work in the equipment history so the Knowledge Hub stays the single source of truth. SIGN-OFF: Prepared by Panel Operator / Technician; Reviewed by (Supe _action":"Reconcile the equipment_type 'Fluid Bed Dryer' (assets/equipment) against the GA drawing's own title 'Rotary Steam-Tube Dryer'."},{"source":"nozzle_schedule NZ-018/NZ-021","issue":"GA-KC-4501 gives per-stage sizes (1st stage suction 6\"-150#, final discharge 3\"-300#) that don't match the single suction/discharge figures in equipment (Suction 3\"->4\", discharge 4\").","severity":"Medium","suggested_action":"Treat GA per-stage figures as the more granular/authoritative source; update equipment notes to show both stages."},{"source":"nozzle_schedule NZ-019 / bill_of_materials BOM-011","issue":"GA-KC-4501 BOM labels item 12 'INTERCOOLER EA-4502', implying EA-4502 sits between the compressor's two stages; existing KB (AST-010/EQP-010) places EA-4502 after the compressor discharge, i.e. an aftercooler.","severity":"High","suggested_action":"Confirm true position of EA-4502 (inter-stage vs after compressor) before relying on either source for the recycle gas loop."},{"source":"nozzle_schedule NZ-024..NZ-026 / document_chunks CHK-012","issue":"GA-EA-5601 labels solvent (hexane) on the TUBE side and steam on the SHELL side; document_chunks CHK-012 and equipment EQP-012 describe hexane on the SHELL side and steam on the TUBE side.","severity":"High","suggested_action":"Direct shell/tube contradiction between the GA drawing and the P&ID chunk text - confirm true configuration with the vendor datasheet before use."},{"source":"nozzle_schedule NZ-031 / assets AST-024","issue":"GA-LV-6701 outlet nozzle N2 references a downstream vessel 'FA-6720' that does not appear anywhere else in the knowledge base.","severity":"High","suggested_action":"Added as placeholder AST-024/EQP-024. Obtain a P&ID or datasheet for FA-6720, or confirm the tag is a drafting error, before treating it as a real asset."},{"source":"ga_drawings GA-D-007","issue":"GA-CT-7801 dry-weight cell is garbled/illegible on the source drawing (reads as the word 'past').","severity":"Low","suggested_action": ets","issue":"Title blocks are inconsistent across the set: only the CT-7801 sheet carries company / project / engineering text (PT Wangsa Petrokimia Nusantara, NIPPO ENGINEERING CORPORATION) and a 'DUMMY / TRAINING' marker; sheets 3-4 add 'SDK Polyolefin Expansion Project'; the rest carry only the CALIBER sample-data stamp.","severity":"Low","suggested_action":"No action for retrieval; keep all values as printed and treat every sheet as sample/fictional data."},{"source":"documents DOC-011..018 vs DOC-019..026","issue":"Source filename collision: ilovepdf_merged__3_.pdf is cited by the GA documents (DOC-011..018) but the file supplied under that name for this update contains the Plot Plan set (8 pages, one per asset).","severity":"Low","suggested_action":"New plot plan rows are labelled ilovepdf_merged__3_.pdf (plot plan set), page N. Confirm which file holds the GA set and rename source files to avoid ambiguous page citations."},{"source":"plot_plan_drawings YD-2301 name","issue":"Plot plan names YD-2301 'POLYMER FLUID BED DRYER' (as the P&ID), while the GA drawing describes a rotary steam-tube dryer (existing flag on nozzle_schedule NZ-008).","severity":"Low","suggested_action":"No new action; resolve together with the existing equipment_type conflict."},{"source":"plot_plan_drawings / maintenance","issue":"All 8 plot plan functional locations (TJC-LLD-<area>-01), area codes and area names match maintenance.functional_location / area_code / area_name for the same tags.","severity":"Info","suggested_action":"None - confirms equipment tag as join key between plot plan, GA, P&ID and maintenance data."},{"source":"plot_plan_drawings / ga_drawings","issue":"Plot plan elevations agree with GA centreline elevations for the elevated assets (YD-2301 EL +6.00 vs 6000 mm; LV-6701 EL +3.00 vs 3000 mm; CT-7801 EL +12.00 vs 12000 mm; FA-8901 EL +4.50 vs 4500 mm). Ground-level assets show EL +0.00 (GA C/L 375 / 600 / 550 mm above grade for GA-1201A / KC-4501 / EA-5601; none given for DC-3401A).","severity":"Info","suggested_action":"None - consistent."},{"source":"plot_plan_drawings / pid_sheets","issue":"Area codes on the plot plan match the unit numbers on pid_sheets (1200, 2300, 3400, 4500, 5600, 6700, 7800, 8900); area wording differs in places (e.g. plot plan 3400 'CATALYST PREPARATION' vs pid_sheets 'Reaction (Unit 3400)'; 4500 'GAS RECOVERY & COMPRESSION' vs 'Gas Recovery / Recycle').","severity":"Info","suggested_action":"Use the plot plan / maintenance area names as the canonical area labels; keep pid_sheets wording as an alias."},{"source":"plot_plan_drawings / assets","issue":"The plot plan locates only the 8 GA-covered assets (GA-1201A, YD-2301, DC-3401A, KC-4501, EA-5601, LV-6701, CT-7801, FA-8901). The other 16 assets (e.g. 12-T-01, GF-2210, EA-4502, FA-6710, FA-6720, GA-8920A/B) have no plot plan location.","severity":"Info","suggested_action":"Obtain plot plan locations for the remaining assets if location queries are expected."},{"source":"opl_troubleshooting (all 8 assets)","issue":"The Common Problems & Troubleshooting table is asset-level, not lesson-specific: of 168 rows only 51 are distinct and 150 rows repeat on sibling OPLs of the same asset (e.g. the seal-flush / misalignment / bearing table also appears on the minimum-flow OPL, OPL-GA-1201A-04). Each OPL carries exactly 3 rows.","severity":"Medium","suggested_action":"Treat the table as a failure-mode catalogue per asset. Use opl_troubleshooting.opl_count_same_asset_same_row to de-duplicate before counting 'cases'; do not present a repeated row as that OPL's own root cause without confirming with the author. Not loaded into incidents/tacit_knowledge for this reason."},{"source":"opl_troubleshooting OPL-GA-1201A-01..06","issue":"12 troubleshooting rows on 6 OPLs are cut off mid-phrase in the PDF ('...seal dr', '...causing seal face', '...cleaned flush orifice, v', '...vibration back to'); punctuation of the cut-off also differs from page to page.","severity":"Low","suggested_action":"Kept verbatim and shaded orange. Do not paraphrase the missing words into the knowledge base; obtain the full OPL text if needed."},{"source":"opl_steps (all 56 OPLs)","issue":"The Check / Acceptance column is a fixed 5-line template per discipline (Mechanical, Process / Operations, Instrument) repeated by step number regardless of the action, e.g. step 3 'Torque / clearance to spec' on a flow-check step, or 'Parts match BOM / spec' on a lube-level check. Real acceptance values live in the Action text (see opl_quant_values).","severity":"Low","suggested_action":"Use the Action text and opl_quant_values for acceptance criteria; treat check_acceptance as a generic checklist label (check_acceptance_origin states the template)."},{"source":"opl_lessons footer_note","issue":"The footer line 'Cross-ref tag <tag> across Datasheet, GA, P&ID, Interlock and Maintenance History' names the wrong asset on 28 of 56 OPL pages (GA-1201A is printed on DC-3401A, KC-4501, EA-5601 and LV-6701 sheets) and is missing on 5. OPL-DC-3401A pages also hold a hidden 'DUMMY / TRAINING DOCUMENT - Knowledge Hub exercise. Fictional data' note under an overlay. One page (OPL-GA-1201A-04) prints it as 'Notes:' beside the sign-off block.","severity":"Medium","suggested_action":"Use the Equipment field in the OPL header (asset_tag) as the canonical tag; ignore the footer for joins. footer_tag_matches_equipment shows which pages are affected."},{"source":"opl_merged.pdf text layer","issue":"Text extraction of the PDF is unreliable: a stray ';' after 'P&ID', blank bullets (tools bullet 1 on OPL-EA-5601-03/04, key point 2 on all 7 EA-5601 OPLs), 'Operating procedure &' cut off on OPL-LV-6701-05, 'the P&ID' missing from the LV-6701 cross-check line, and a garbled Likely Cause cell on OPL-DC-3401A-07 are patched on screen by white overlay boxes.","severity":"Info","suggested_action":"All values in the opl_* sheets were taken from the rendered page, not the raw text layer. Re-ingesting this PDF by plain text extraction will reproduce the defects."},{"source":"opl_quant_values / instruments PI-6702","issue":"OPL-LV-6701 (instrument air supply check) states PI-6702 air supply at 1.4 barg; instruments INST-056 defines PI-6702 as separator pressure > 1.2 barg (Permissive 1, PID-6).","severity":"Medium","suggested_action":"Confirm which tag is the instrument-air supply gauge on LV-6701 (check P&ID set 6 / GA-1201A-style datasheet); fix the tag or the description. Not edited in instruments."},{"source":"opl_quant_values / instruments PSV-8901","issue":"OPL-FA-8901 sets PSV-8901 at 10 barg (procedure step and troubleshooting row of the PSV testing OPLs); instruments INST-075 gives PSV-8901 as 'Suction pressure 0.5 barg' and is already flagged REVIEW (it duplicates the PSLL-1201 value).","severity":"High","suggested_action":"Take 10 barg for PSV-8901 (matches the OPL hazard note and design pressure 10 barg); correct INST-075 after checking the P&ID 8 / datasheet. Not edited in instruments."},{"source":"opl_quant_values / instruments (gaps)","issue":"OPL supplies set points the instruments sheet lists as N/A: TSHH-2301 = 125 degC (INST-021, also REVIEW), PSLL-4504 = 1.5 barg (INST-045), VSHH-1201 alarm 4.5 / trip 7.1 mm/s (INST-010). Alarm/trip values for VSHH-4505 (8 / 11 mm/s) and VSHH-7802 alarm (6 mm/s) are also new.","severity":"Info","suggested_action":"Backfill instruments.setpoint_or_range once confirmed against the datasheets/C&E (safety-critical, so verify first). kb_crosscheck = Fills KB gap marks each item."},{"source":"opl_quant_values / instruments (agreement)","issue":"OPL set points that agree with the instruments sheet: PSLL-1201 0.5 barg, FSLL-1201 9 m3/h (OPL cites FIC-1201), PDI-1201 > 1.5 bar, TSHH-3401 230 degC, AI-3401 100 ppm, PSV-3401 6 barg, PSV-5607 16 barg, PDAH-5605 0.7 bar, LSHH-6710 85 %, VSHH-7802 9 mm/s.","severity":"Info","suggested_action":"None - consistent. See kb_crosscheck = Consistent."},{"source":"opl_lessons / maintenance, ga_drawings","issue":"For all 8 assets the OPL interlock reference (SEQ-1201, 5500, 3401, 4501, 6701, 7801, 8901; EA-5601 'control loop only'), P&ID ref (TJC-LLD-PID-xxxx), unit/area code and criticality label (HIGH / LOW / NON) match ga_drawings and maintenance. The OPLs also print real P&ID numbers for sets 1, 3, 6, 7 and 8, which pid_sheets still shows as placeholder / not stated. The area names differ from maintenance.area_name (e.g. '1200 - HEXANE FEED SYSTEM' vs 'FEED PREPARATION & PURIFICATION').","severity":"Info","suggested_action":"Keep using the plot plan / maintenance area names as canonical; the OPL area names are kept as printed in opl_lessons.area_unit."},{"source":"opl_lessons sign-off / maintenance","issue":"Reviewed-by supervisors Wahyu Setiadi (EMP-1113), Yudha Permana (EMP-1124) and Vino Ardiansyah (EMP-1102) also appear in maintenance reported_by/executed_by/approved_by; approvers Arya Wibisono (EMP-0912) and Zulkarnain Hasan (EMP-0901) do not appear in maintenance. 'Prepared by' gives only the role 'Panel Operator / Technician' (no person). Names are masked/fictional per the sample-data banner.","severity":"Info","suggested_action":"documents.approval_status left blank on purpose (a named approver is not a stated approval status). Use the sign-off columns in opl_lessons if approver lookups are needed."},{"source":"documents DOC-027..082 / opl_lessons","issue":"OPL documents carry no revision number; Sheet is always '1 of 1'. effective_date uses the printed Date of Sharing (2026-03-22 to 2026-07-01); all 56 weekday names agree with their dates.","severity":"Info","suggested_action":"None. Revision stays blank rather than invented."}]};</script>

/* AI Assistant: retrieval over chunks + work orders + instruments (stands in for pgvector search) */
const CORP=[...K.chunks.map(c=>{const d=DOC[c.doc];return{k:"doc",id:c.doc,cid:c.id,title:d.name,set:d.set,page:c.page,sec:c.sec,text:c.text,ver:"Rev "+(d.rev??"—"),status:ds(d),who:d.type}}),
 ...K.mnt.map(m=>({k:"wo",id:m.id,title:`Work order ${m.wo} · ${m.type}`,set:m.set,sec:m.date,text:`${m.failure}. Root cause: ${m.cause}. Action: ${m.action}. Parts: ${m.parts}`,ver:m.date,status:"Completed",who:"Maintenance history"})),
 ...K.inst.map(i=>({k:"inst",id:i.id,title:`Instrument ${i.tag}`,set:i.set,sec:"Instrument list",text:`${i.tag} ${i.type} – ${i.var}. Setpoint: ${i.sp}. On trip: ${i.act}. ${i.notes||""}`,ver:"—",status:i.flag?"REVIEW":"Listed",who:"Interlock / instruments"}))];
const STOP=new Set("the a an is are what do i how of to for on in and or why we should be does with my our need can this that it at when which".split(" "));
function retrieve(q,scope){const T=q.toLowerCase().replace(/[^a-z0-9\- ]/g," ").split(/\s+/).filter(t=>t&&!STOP.has(t));
  const hit=new Set(scope?[scope]:K.sets.filter(s=>T.some(t=>t.length>2&&(s.tag.toLowerCase()===t||(s.name+" "+s.pid.tags).toLowerCase().includes(t)&&/\d/.test(t)||s.name.toLowerCase().split(" ").includes(t)))).map(s=>s.n));
  return CORP.map(c=>{const h=(c.title+" "+c.sec+" "+c.text).toLowerCase();let s=0;const sc=c.sec.toLowerCase();T.forEach(t=>{const w=/\d/.test(t)?4:t.length>3?2:1,r=t.length>5?t.slice(0,5):t;if(h.includes(t))s+=w;else if(t.length>5&&h.includes(r))s+=1;if(sc.includes(r)&&t.length>3)s+=3});
    if(hit.has(c.set))s+=3;if(scope&&c.set!==scope)s=0;if(c.k==="inst")s*=.8;if(c.k==="doc"&&c.sec==="Data Quality Note")s*=.7;return{...c,score:s}}).filter(c=>c.score>=4).sort((a,b)=>b.score-a.score).slice(0,5)}
function assistant(){const sugg=["What is the start permissive for the recycle gas compressor KC-4501?","How do I fix a mechanical seal leak on the hexane feed pump?","Why does the polymer dryer YD-2301 trip on high vibration?","Where is the cooling tower fan CT-7801 located?"];
  return `<h1>AI Assistant</h1><p class="sub">Answers grounded in P&IDs, GA drawings, plot plans, OPLs, instrument/interlock data and ${K.mnt.length} work orders — with sources and approval status</p>
  <div class="chat card"><div class="row" style="margin-bottom:10px"><span class="muted">Scope:</span><select onchange="st.scope=+this.value"><option value="0">All ${K.sets.length} equipment sets</option>${K.sets.map(s=>`<option value="${s.n}" ${st.scope===s.n?"selected":""}>Set ${s.n} · ${s.tag} ${s.name}</option>`).join("")}</select></div>
  <div class="msgs" id="msgs">${st.chat.length?st.chat.map(msgHtml).join(""):`<div class="muted" style="margin:auto;text-align:center">Ask about procedures, interlocks, troubleshooting, location or maintenance history.</div>`}</div>
  ${st.chat.length?"":`<div class="chips">${sugg.map(s=>`<span class="chip" onclick="ask(this.textContent)">${s}</span>`).join("")}</div>`}
  <div class="composer"><input id="q" placeholder="Ask a question…" onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">Send</button></div></div>`}
function msgHtml(m,i){if(m.role==="u")return`<div class="msg u">${esc(m.text)}</div>`;
  return `<div class="msg a">${m.text}${m.conf?`<div class="muted" style="margin-top:10px;font-size:12px">Retrieval confidence: <b style="color:var(--${m.conf>70?"ok":"warn"})">${m.conf}%</b></div>`:""}${m.sources?.length?`<div class="src"><b>Sources</b>${m.sources.map((s,j)=>`<div onclick="openSrc(${i},${j})"><b>${esc(s.k==="doc"?s.id:s.k==="wo"?s.title.split(" · ")[0]:s.title)}</b> · ${esc(s.k==="doc"?s.title:s.who)} ${s.k==="doc"?`<span class="tag">p.${s.page}</span>`:""} <span class="tag">${esc(s.ver)}</span> ${tg(s.status)} <span class="muted">· ${esc(s.sec)}</span></div>`).join("")}</div>`:""}</div>`}
function openSrc(i,j){const s=st.chat[i].sources[j];if(s.k==="doc")return go("documents",{doc:s.id,hl:s.cid});go("equipment",{set:s.set,tab:s.k==="wo"?"maint":"seq",wo:s.k==="wo"?s.id:null})}
async function ask(text){const q=(text||$("#q").value).trim();if(!q)return;st.chat.push({role:"u",text:q},{role:"a",text:"<span class='muted'>Searching knowledge base…</span>"});render();
  const h=retrieve(q,st.scope),conf=h.length?Math.min(95,Math.round(40+h[0].score*3)):0;let a;
  try{const r=await fetch(API+"/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,context:h.map(c=>({id:c.id,title:c.title,sec:c.sec,text:c.text,ver:c.ver,status:c.status}))})});if(!r.ok)throw 0;const j=await r.json();a={text:esc(j.answer).replace(/\n/g,"<br>"),sources:h,conf};$("#apiDot").style.background="var(--ok)";$("#apiStatus").textContent="Connected · Gemini"}catch(e){a=local(h,conf)}
  st.chat[st.chat.length-1]={role:"a",...a};render()}
function local(h,conf){if(!h.length)return{text:"I couldn't find this in the knowledge base. Try naming the equipment tag (e.g. KC-4501) or browse the Document Library.",sources:[]};
  const sets=[...new Set(h.map(c=>c.set).filter(Boolean))].map(S),open=h.some(c=>c.status==="Not stated"||c.status==="REVIEW");
  return{text:`<b>${sets.map(s=>s.tag+" "+s.name).join(", ")||"Site-wide"}</b><br><br>${h.map((c,i)=>`${i+1}. ${esc(c.text.slice(0,260))}${c.text.length>260?"…":""} <span class="muted">[${esc(c.id)}]</span>`).join("<br>")}${open?"<br><br>⚠ Some sources have no stated approval status or are flagged REVIEW — verify safety-critical values before acting.":""}`,sources:h,conf}}

/* ===== P&ID Viewer v2: sheets redrawn 1:1 from the P&ID pack, digital-twin overlay (flow, rotation, interlock trips) ===== */

/* ---------- drawing primitives ---------- */
const tx=(x,y,s,fs=9,a="middle",b=0,rot=0,c=0)=>{const L=String(s).split("|").filter((l,i,ar)=>i===0||l!==ar[i-1]),lh=fs*1.18,y0=c?y-(L.length-1)*lh/2:y;return `<text x="${x}" y="${y0}" font-size="${fs}" ${b?'font-weight="700"':""} text-anchor="${a}" ${rot?`transform="rotate(${rot} ${x} ${y})"`:""}>${L.map((l,i)=>`<tspan x="${x}" dy="${i?lh:0}">${esc(l)}</tspan>`).join("")}</text>`};

const ln=(p,k="d")=>{const a=[];for(let i=0;i<p.length;i+=2)a.push(p[i]+","+p[i+1]);return `<polyline class="${k==="d"?"sig":"pipe th"}" points="${a.join(" ")}"/>`};
const ah=(x1,y1,x2,y2,s=8)=>{const d=Math.atan2(y2-y1,x2-x1),c=Math.cos(d),n=Math.sin(d),p=(k,w)=>`${(x2-c*k-n*w).toFixed(1)},${(y2-n*k+c*w).toFixed(1)}`;return `<polygon points="${x2.toFixed(1)},${y2.toFixed(1)} ${p(s,s/2.4)} ${p(s,-s/2.4)}" fill="#111"/>`};
const arr=(p)=>ln(p,"s")+ah(p[p.length-4],p[p.length-3],p[p.length-2],p[p.length-1]);
const ptbl=(x,y,cw,rh,rows,fs=8,hdr=1)=>{let o="",yy=y;rows.forEach((r,ri)=>{let xx=x;if(r.length===1){const W=cw.reduce((a,b)=>a+b,0);o+=`<rect x="${x}" y="${yy}" width="${W}" height="${rh}" fill="#eceef1" stroke="#111" stroke-width=".9"/>`+tx(x+W/2,yy+rh/2+fs*.35,r[0],fs,"middle",1,0,1);yy+=rh;return}r.forEach((c,ci)=>{o+=`<rect x="${xx}" y="${yy}" width="${cw[ci]}" height="${rh}" fill="${ri<hdr?"#eceef1":"#fff"}" stroke="#111" stroke-width=".9"/>`+(c!==""?tx(ci?xx+cw[ci]/2:xx+4,yy+rh/2+fs*.35,c,fs,ci?"middle":"start",ri<hdr,0,1):"");xx+=cw[ci]});yy+=rh});return o};
const legend=(x,y,w=120)=>bx(x,y,w,64,"",8,"#fff",0,1)+tx(x+w/2,y+11,"LEGEND",8,"middle",1)+ci(x+14,y+25,5)+tx(x+26,y+28,"LOGIC hmi",6.5,"start")+`<path d="M${x+9} ${y+39}h10M${x+14} ${y+39}v-4" stroke="#111" fill="none"/><path d="M${x+9} ${y+35}a5 5 0 0 1 10 0z" fill="#fff" stroke="#111"/>`+tx(x+26,y+40,"START PERMISSIVE",6.5,"start")+`<path d="M${x+8} ${y+47}l12 8v-8l-12 8z" fill="#fff" stroke="#111"/>`+tx(x+26,y+53,"TRIP",6.5,"start")+`<path d="M${x+14} ${y+57}l3 3-3 3-3-3z" fill="#fff" stroke="#111"/>`+tx(x+26,y+61,"Cause/Effect",6.5,"start");

/* ------------------------------------------------------------------ OPL sheet (document replica) */
function sheet(o){
  const n=o.set,s=S(n),sil=o.sil&&o.sil!=="N/A"?`SIL ${o.sil}`:"N/A";
  const ilk=o.seq&&o.seq.startsWith("N/A")?`${o.seq} (N/A)`:`${o.seq} (${sil})`;

  const hz=esc(o.safety[0]||"").replace(/is (.*?) handling (.*?) at/,(m,a,b)=>`is <b>${a}</b> handling <b>${b}</b> at`);
  const sc=SC[o.no]||[],tsLink=i=>{const j=sc.findIndex(x=>x.row===i);return j<0?"":`<span class="simgo" onclick="event.stopPropagation();oplSim('${o.no}',${j})" title="Run this case in the simulator">▶ simulate</span>`};
  const stepLink=i=>{const j=sc.findIndex(x=>(x.a||[]).some(a=>[].concat(a[1]).includes(i+1)));return j<0?"":` onclick="oplSim('${o.no}',${j})" class="lk" title="Practise this step in the simulator"`};
  const ft=footOf(o);
  return `<div class="osh">
  <table class="oh"><tr><td class="stamp">This is sample data provided for<br>CALIBER purposes only</td><td class="ttl">ONE POINT LESSON (OPL)</td><td class="no">OPL No: <b>${o.no}</b><br>Sheet 1 of 1</td></tr></table>
  <table class="oi">
   <tr><th>OPL Title</th><td class="v"><b>${esc(o.title)}</b></td><th>Discipline</th><td class="v">${esc(o.disc)}</td></tr>
   <tr><th>Equipment</th><td class="v">${o.tag} - ${EQN[n]}</td><th>Area / Unit</th><td class="v">${esc(areaOf(n))}</td></tr>
   <tr><th>Related Interlock</th><td class="v">${esc(ilk)}</td><th>P&amp;ID Ref</th><td class="v"><span class="otag" onclick="pidGo(${n},0)">${esc(s.pid.ref)}</span></td></tr>
   <tr><th>Classification:</th><td colspan="3"><div class="ocl">${CLS.map(c=>`<span><i class="bx">${c===o.cls?"✕":""}</i>${c}</span>`).join("")}<span style="margin-left:auto">Aspect: P-Q-C-D-S-M-E</span></div></td></tr>
  </table>
  <div class="osec nv">1. PURPOSE / OBJECTIVE</div><p>${pur}</p>
  <div class="osec rd">2. SAFETY PRECAUTIONS</div><p>${hz}</p><ul class="ob rd">${o.safety.slice(1).map(x=>`<li>${tagify(n,x)}</li>`).join("")}</ul>
  <div class="osec bl">3. TOOLS &amp; MATERIALS REQUIRED</div><ul class="ob bl two">${o.tools.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <div class="osec nv">4. DETAILED PROCEDURE / STEPS</div>
  <table class="ot"><tr><th style="width:44px">Step</th><th>Action</th><th style="width:30%">Check / Acceptance</th></tr>${o.steps.map((x,i)=>`<tr${stepLink(i)}><td class="n">${i+1}</td><td>${tagify(n,x[0])}</td><td>${esc(x[1])}</td></tr>`).join("")}</table>
  <div class="osec am">5. COMMON PROBLEMS &amp; TROUBLESHOOTING</div>
  <table class="ot am"><tr><th>Symptom</th><th>Likely Cause</th><th>Action</th></tr>${o.ts.map((t,i)=>`<tr><td>${tagify(n,t[0])}${tsLink(i)}</td><td>${tagify(n,t[1])}</td><td>${tagify(n,t[2])}</td></tr>`).join("")}</table>
  <div class="osec gr">6. KEY LEARNING POINTS</div><ul class="ob gr">${o.kp.map(k=>`<li>${tagify(n,k[0])}</li>`).join("")}</ul>
  <table class="osig"><tr><th>Prepared by</th><th>Reviewed by (Supervisor)</th><th>Approved by (Manager)</th><th>Date of Sharing</th></tr>
   <tr><td>${esc(o.prep)}</td><td>${esc(o.rev)} (${o.rid})</td><td>${esc(o.app)} (${o.aid})</td><td>${dayStr(o.date)}</td></tr></table>
  <div class="ofoot"><span>${ft?esc(ft):"&nbsp;"}</span><span>Source: ${esc((DOC[o.doc]||{}).src||"opl_merged.pdf")}</span></div>
  </div>`;

/* ------------------------------------------------------------------ simulation engine */
let SIM=null;
const cmp=(v,c)=>c&&(c[0]===">"?v>c[1]:v<c[1]);
const vstate=(d,v)=>cmp(v,d.tr)?"tr":(cmp(v,d.al)||cmp(v,d.al2))?"al":"ok";
const vs=(S,d)=>((d.rz||d.na)&&S.E.armed&&!S.E.armed(S))?"ok":vstate(d,S.V[d.k]);
const tfmt=t=>{t=Math.max(0,t);const d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60),p=x=>String(x).padStart(2,"0");return d?`Day ${d+1}  ${p(h)}:${p(m)}`:h?`${p(h)}:${p(m)}:${p(s)}`:`${p(m)}:${p(s)}`};
function lg(c,m){if(!SIM)return;SIM.log.unshift([tfmt(SIM.t),c,m]);SIM.log=SIM.log.slice(0,80)}
window.OPLH.lg=lg;
function fb(c,m){SIM.fb={c,m}}

function simInit(no,i){
  const o=OPL[no],n=o.set,E=EQ[n],list=SC[no]||[];if(!E||!list.length)return null;
  i=CL(i|0,0,list.length-1);const s=list[i];
  const P=Object.assign({},E.P0,s.p||{}),V={};E.V.forEach(d=>V[d.k]=d.lo);
  SIM={no,i,n,o,E,s,P,V,R:{},t:0,ph:{},hist:[],log:[],steps:{},done:{},bad:0,trips:0,trip:null,tt:{},alm:{},run:false,spd:1,ts:s.ts||E.ts||1,out:null,hold:0,fl:{},dmg:null,fb:null,hint:false,sample:0,dr:0};
  if(s.r)for(const k in s.r)SIM.R[k]=s.r[k].slice();
  E.init&&E.init(SIM);
  for(let j=0;j<4;j++){const T=E.model(SIM,0);Object.assign(V,T)}  /* settle at equilibrium */
  if(s.v)Object.assign(V,s.v);
  s.init&&s.init(SIM);
  SIM.dmg=null;
  lg("SYS",`Scenario loaded: ${s.n}`);
  return SIM;
}
function step(dt){
  const S=SIM,E=S.E;
  for(const k in S.R){const [g,r]=S.R[k],d=g-S.P[k],q=r*dt;if(Math.abs(d)<=q){S.P[k]=g;delete S.R[k]}else S.P[k]+=Math.sign(d)*q}
  const T=E.model(S,dt);
  E.V.forEach(d=>{if(T[d.k]!==undefined&&isFinite(T[d.k]))S.V[d.k]+=(T[d.k]-S.V[d.k])*Math.min(1,dt/(d.tau||1))});
  S.t+=dt;
  const armed=E.armed?E.armed(S):true;
  E.V.forEach(d=>{const v=S.V[d.k],st=vs(S,d);
    if(st!=="ok"&&!S.alm[d.k]){S.alm[d.k]=1;lg(st==="tr"?"ALM":"AL",`${d.tag} ${d.l} ${st==="tr"?"HIGH-HIGH / LOW-LOW":"alarm"}: ${F(v,d.d)} ${d.u}`)}
    if(st==="ok")S.alm[d.k]=0;
    const ar=d.arm?d.arm(S):armed;if(!d.tr||!ar||S.trip){S.tt[d.k]=0;return}
    if(cmp(v,d.tr)){S.tt[d.k]=(S.tt[d.k]||0)+dt;if(S.tt[d.k]>=(d.dly||0)){
      if(S.P.byp&&d.byp!==false){if(!S.fl["bw"+d.k]){S.fl["bw"+d.k]=1;lg("ALM",`${d.tag} beyond trip set point (${d.tr[0]} ${d.tr[1]} ${d.u}) — interlock BYPASSED, no protective action taken`)}}
      else{S.trip={k:d.k,tag:d.tag,t:S.t,l:d.l};S.trips++;E.onTrip&&E.onTrip(S,d);lg("ALM",`${KIL[S.n].logic} TRIP — ${d.tag} ${d.l} ${d.tr[0]} ${d.tr[1]} ${d.u}. Final elements actuated.`)}}}
    else S.tt[d.k]=0});
}
function finish(ok,msg){
  const S=SIM;if(S.out)return;S.run=false;
  let sc=100-S.bad*20-(S.s.k==="bad"?0:Math.min(3,S.trips)*12);const stp=Object.keys(S.steps).length;sc=CL(sc+Math.min(10,stp*2),0,100);
  if(!ok)sc=Math.min(sc,35);
  S.out={ok,msg,sc:Math.round(sc)};lg(ok?"OK":"ALM",ok?`Scenario complete: ${msg}`:`Scenario not completed: ${msg}`);
}
function tick(dr){
  const S=SIM;if(!S||!S.run||S.out)return;
  S.dr=dr;const dt=dr*S.ts*S.spd,h=S.E.h||1,nn=Math.min(40,Math.max(1,Math.ceil(dt/h)));
  for(let j=0;j<nn;j++){step(dt/nn);if(S.dmg)break}
  if(S.dmg){finish(false,S.dmg);return}
  if(S.s.g&&S.good>0&&S.s.g[1](S)){S.hold+=dr;if(S.hold>=(S.s.g[2]||2.5))finish(true,S.s.g[0])}else S.hold=0;
  if(S.s.fail){const m=S.s.fail(S);if(m)finish(false,m)}
}

/* ------------------------------------------------------------------ simulator UI */
const KS=["fault","proc","trend","bad"];
function simView(o){
  const sc=SC[o.no]||[];
  if(!sc.length)return `<div class="card"><h3>No scenario defined</h3></div>`;
  let i=CL(st.si|0,0,sc.length-1);if(!SIM||SIM.no!==o.no||SIM.i!==i)simInit(o.no,i);
  const S=SIM;
  return `<div class="sim"><div class="scn">${sc.map((x,j)=>`<button class="${j===S.i?"on":""}" onclick="go('opl',{om:'sim',si:${j}});"><span class="k ${x.k}">${KIND[x.k][0]}</span><span>${esc(x.n)}<small>${KIND[x.k][1]}${x.row!=null?" · troubleshooting row "+(x.row+1):""}</small></span></button>`).join("")}</div>
  <div id="simWrap">${simBody()}</div></div>`;
}
function simBody(){
  const S=SIM,s=S.s,o=S.o;
  return `<div class="sbrief"><div><p>${s.d}</p><p class="lsn"><b>OPL says:</b> ${esc(o.obj)}</p><p class="goal">Goal: ${esc(s.g[0])}</p></div>
   <div class="sctl"><div class="clock" id="simClk">${tfmt(S.t)}<small>simulated time · ${S.ts>=3600?"≈"+F(S.ts/3600,S.ts>=36000?0:1)+" h":S.ts>=60?F(S.ts/60,0)+" min":S.ts+" s"} per second at 1×</small></div>
    <div class="row"><button id="simRun" onclick="oplRun()">${S.out?"Repeat":S.run?"Pause":"Run"}</button><button class="ghost" onclick="oplReset()">Reset</button></div>
    <div class="row spd">${[1,4,16].map(k=>`<button class="ghost ${S.spd===k?"on":""}" onclick="oplSpd(${k})">${k}×</button>`).join("")}<label class="muted" style="font-size:12px;display:flex;gap:5px;align-items:center;margin-left:6px"><input type="checkbox" ${S.hint?"checked":""} onchange="SIMH(this.checked)">Show guidance</label></div></div></div>
  <div class="smain"><div class="sfig" id="simFig"></div><div class="sside"><div id="simBan"></div><div class="fpl" id="simVals"></div><div class="ilp" id="simIL"></div></div></div>
  <div class="slow"><div class="sacts" id="simActs">${actsHTML()}</div><div class="strend" id="simTrend"></div></div>
  <div class="sbot"><div class="sstep" id="simSteps">${stepsHTML()}</div><div class="slog" id="simLog"></div></div>`;
}
function actsHTML(){
  const S=SIM,s=S.s,E=S.E,hi=S.hint?s.a.findIndex((a,i)=>a[2]>0&&!S.done[i]):-1;
  const b=(a,i,g)=>{const cls=[S.done[g+i]?(a[2]<0?"bd":"dn"):"",hi===i&&!g?"hint":""].join(" ");const sn=[].concat(a[1]||[]).filter(Boolean);

  const LTi=f.L+P.ld,out=P.pm?(P.au?CL(1+.06*(LTi-P.sp),0,2.2):1)*P.in0f(S):0;
  if(dt){f.L=CL(f.L+(P.in-out)*1.2*dt,0,100);
   f.I=CL(f.I+(P.wi*.08-(P.dr?.35:0))*dt,0,100);if(P.dr&&f.I<2)f.hc+=dt;
   let pt=3+P.op*7-P.cool*3-P.mw*2.5;const vcap=f.vent?3:1;
   if(f.P>3.05)pt-=Math.min(vcap*1.2,(f.P-3)*1.4)*(P.pc?0:1);if(f.P<2.95&&P.n2)pt+=(3-f.P)*1.5*(P.pc?0:1);
   if(P.pc)pt+=.9*Math.sin(S.t/25);
   f.P+=(pt-f.P)*Math.min(1,dt/40);if(P.ci&&f.P>P.ps)f.P=P.ps+.15;f.P=Math.max(.02,f.P);
   f.O2+=((f.P<.3&&!P.n2?21:.2)-f.O2)*Math.min(1,dt/(f.P<.3&&!P.n2?900:3000));
   if(P.pm&&f.L<15)f.pd+=dt*.012;
   f.wt-=dt*P.cr/31536000;
   if(!P.br)f.lg=f.L}
  if(f.L>96)S.dmg="Drum overfilled — liquid backed into the column overhead and flooded DA-8910.";
  if(f.P>12.5)S.dmg="Drum pressure exceeded design with the PSV isolated — flange failure, hexane release.";
  if(f.pd>=1)S.dmg="GA-8920 reflux pump destroyed by cavitation — LSLL protection was bypassed.";
  if(f.hc>30)S.dmg="Boot drain left open after the interface broke through: hexane sent to the oily-water sewer.";
  if(f.O2>8)S.dmg="Air drawn into the hexane drum — explosive atmosphere in FA-8901.";
  if(f.wt<9)S.dmg="Boot wall thinned below the 9 mm minimum (corrosion allowance consumed) — vessel must be taken out of service.";
  return {LT:CL(LTi,0,100),LH:f.L,LL:f.L,LG:f.lg,IF:f.I,PR:f.P,O2:f.O2,PV:P.pm?(f.L<15?7:1.6)+(f.I>90?2:0):0,WT:f.wt,RF:out*30}},
 fig(S){const P=S.P,V=S.V,s=k=>G.st(S,k),f=S.fl;let o=G.bg(660,340);const L=CL(f.L/100),I=CL(f.I/100);

  o+=G.txt(119,206,P.br?"gauge plugged":"bridle gauge",P.br?"#e3b341":"#8b98a5",8,"middle");
  o+=G.inst(78,140,"LT-8901",G.v(S,"LT"),s("LT"),112,140)+G.txt(78,98,"LSHH/LSLL","#8b98a5",7.5,"middle");
  // PCV split range + PSV
  o+=G.pipe("M640 24H420V92",4)+G.flow(S,"n2",`M640 24H420V92`,P.n2&&f.P<2.95?.8:0,"#a371f7",1.6)+G.valve(560,24,P.n2&&f.P<2.95?1:0,"PCV-8905A N₂")+G.txt(650,16,"N₂","#a371f7",8,"end");
  o+=G.pipe("M445 92V56H640",4)+G.flow(S,"vt","M445 92V56H640",f.P>3.05||f.vent?.8:0,"#8b98a5",1.6)+G.valve(560,56,f.P>3.05||f.vent?1:0,"PCV-8905B vent")+G.txt(650,72,"→ flare","#8b98a5",8,"end");
  o+=G.inst(522,118,"PSHH-8902",G.v(S,"PR"),s("PR"),470,118);
  o+=G.thin("M330 92V36","#4a5563",3)+G.valve(330,70,P.ci,"",1)+G.txt(336,30,"PSV-8901 · "+F(P.ps,1)+" barg · CSO "+(P.ci?"open":"CLOSED!"),P.ci?"#8b98a5":"#ff7b72",8);
  if(P.ci&&f.P>P.ps-.05)o+=G.puff(S,"psv",330,34,.9,"#ff9b6a");

  [["GA-8920A","standby",0,262],["GA-8920B","duty",P.pm,340]].forEach(([t,l,on,x])=>{const a=G.rot(S,t,on?600:0);o+=`<circle cx="${x}" cy="300" r="15" fill="#1a222c" stroke="${on&&f.L<15?"#f85149":"#8b98a5"}"/><g transform="rotate(${a} ${x} 300)"><line x1="${x-10}" x2="${x+10}" y1="300" y2="300" stroke="#c9d1d9" stroke-width="2"/><line x1="${x}" x2="${x}" y1="290" y2="310" stroke="#c9d1d9" stroke-width="2"/></g>`+G.txt(x,326,t,"#8b98a5",7.5,"middle")+G.txt(x,336,l,on?"#56d364":"#8b98a5",7.5,"middle");

  o+=G.txt(560,180,"boot wall "+F(f.wt,2)+" mm (min 9.0)",f.wt<9.5?"#e3b341":"#8b98a5",8.5,"middle");

  return `<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif">${o}</svg>`}};
